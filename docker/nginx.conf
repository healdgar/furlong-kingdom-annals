server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # the game is one 2 MB page: compress it
    gzip on;
    gzip_min_length 1024;
    gzip_types application/javascript text/css text/plain image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
    }
    # always check for a newer build; textures change rarely
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location /assets/ {
        add_header Cache-Control "public, max-age=604800";
    }
}
