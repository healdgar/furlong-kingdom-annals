function killNotable(n,cause,silent){
  if(!n.alive)return;
  n.alive=false;n.deathDay=day();
  const wasMonarch=n===W.monarch;
  const h=houseOf(n);
  if(!silent){
    const pos=n.house===0?W.capital.pos:(W.settlements[h.seat]?.pos||W.capital.pos);
    const pri=wasMonarch?10:n.role==='head'?7:n.role==='heir'?6:2;
    if(pri>2||n.epithet||chance('sim',0.22))
      emit('crown',pri,pos,`${fullTitle(n)}${n.house>0&&n.role!=='head'?' of '+houseOf(n).name:''} has died ${cause}, in the ${ordinal(Math.max(1,n.age||ageOf(n)))} year of ${n.sex==='f'?'her':'his'} age.`);
  }
  if(n.spouse){const sp=notableById(n.spouse);if(sp)sp.spouse=null;}
  if(wasMonarch)succession();
  else if(n.role==='head'&&h){
    const heir=n.heirs.map(notableById).find(k=>k&&k.alive&&ageOf(k)>=16);
    if(heir){heir.role='head';h.head=heir.id;heir.agenda=n.agenda;
      const younger=n.heirs.map(notableById).find(k=>k&&k.alive&&k!==heir&&ageOf(k)>=16&&k.sex==='m');
      if(younger)partition(n.house,younger);}
    else{const any=W.notables.find(m=>m.alive&&m.house===n.house&&ageOf(m)>=16);if(any){any.role='head';h.head=any.id;}}
  }
}
function succession(){
  const old=W.monarch;
  const heirs=old.heirs.map(notableById).filter(n=>n&&n.alive).sort((a,b)=>b.age-a.age||a.id-b.id);
  const adult=heirs.find(h=>ageOf(h)>=16);
  if(adult){
    W.monarch=adult;adult.role='monarch';adult.house=0;adult.agenda='wears the crown newly';
    W.reignNum[adult.name]=(W.reignNum[adult.name]||0)+1;
    W.reignStart=day();
    W.legitimacy=clamp(W.legitimacy+8,0,100);
    reignHeader(adult);
    emit('crown',9,W.capital.pos,`${fullTitle(adult)} is crowned in ${W.capital.name} amid solemn rites and the acclaim of the crowd.`,{festival:true});
  }else if(heirs.length){
    const child=heirs[0];
    W.monarch=child;child.role='monarch';child.house=0;child.agenda='reigns under a regency';
    W.reignNum[child.name]=(W.reignNum[child.name]||0)+1;
    W.reignStart=day();
    W.legitimacy=clamp(W.legitimacy-18,0,100);
    W.settlements.forEach(s=>s.unrest=clamp(s.unrest+10,0,100));
    reignHeader(child);
    emit('crown',9,W.capital.pos,`The crown passes to the child ${child.name}, but ${child.age<8?'a babe':'a minor'} cannot rule; a regency of quarrelsome lords governs in ${child.sex==='f'?'her':'his'} name.`);
    W.houses.forEach(h=>{if(!h.crown&&!h.exiled)h.loyalty=clamp(h.loyalty-12,0,100);});
    // a child on the throne is an invitation
    if(!W.war){
      const amb=W.houses.map((h,i)=>i).filter(i=>i>0&&!W.houses[i].exiled&&W.houses[i].loyalty<42)
        .sort((a,b)=>W.houses[b].might-W.houses[a].might)[0];
      if(amb!==undefined&&amb===plyH())claimPetition(amb,'moves against the child on the throne');
      else if(amb!==undefined&&chance('sim',0.5)){W.truceUntil=0;startWar(amb,'moves against the child on the throne');}
    }
  }else{
    // succession crisis: strongest house with a living claimant takes the throne
    W.legitimacy=clamp(W.legitimacy-30,0,100);
    const claimants=W.houses.map((h,i)=>i).filter(i=>i>0&&!W.houses[i].exiled)
      .sort((a,b)=>W.houses[b].might-W.houses[a].might);
    let head=null,ci=-1;
    for(const c of claimants){
      const cand=notableById(W.houses[c].head);
      if(cand&&cand.alive){head=cand;ci=c;break;}
      const any=W.notables.filter(n=>n.alive&&n.house===c&&ageOf(n)>=16).sort((x,y)=>ageOf(y)-ageOf(x))[0];
      if(any){head=any;ci=c;W.houses[c].head=any.id;any.role='head';break;}
    }
    if(!head){ // the realm scrapes the bottom of the barrel

/* ============================ MILITARY =================================== */

function warScore(d){if(W.war)W.war.score=clamp(W.war.score+d,-120,120);}
function inRevolt(hi){ // is this house in arms against the crown right now?

  [...W.armies].forEach(a=>{if(a.standing&&!(W.feuds||[]).some(f=>f.a===a.house||f.b===a.house)){liftSiege(a);if(a.state!=='battle'){a.foe=null;routHome(a);}}else if(!a.standing)disbandArmy(a);}); // household hosts go home; levies are paid off

  const keeps=W.settlements.some(s=>s.owner===W.war.rebel);
  if(result===1&&keeps){ // a beaten vassal submits: it keeps what was not taken from it, and remembers
    h.loyalty=55;(h.grudges=h.grudges||{})[0]=true;W.legitimacy=clamp(W.legitimacy+8,0,100);sovAmbition('victor');
    emit('war',10,W.capital.pos,`${warName} is ended after ${dur} months. ${h.name} kneels and renews its oaths; the crown keeps the towns and lands it took.`);
  }else if(result===1){
    h.exiled=true;h.exiledDay=day();
    W.settlements.forEach(s=>{if(s.owner===W.war.rebel)s.owner=0;});
    W.legitimacy=clamp(W.legitimacy+15,0,100);
    sovAmbition('victor');
    const head=notableById(h.head);
    emit('war',10,W.capital.pos,`${warName} is ended after ${dur} months. ${h.name} is attainted and driven into exile beyond the mountains; its sigil is struck from the rolls.`);
    if(head&&chance('sim',0.5))killNotable(head,'on the scaffold, unrepentant',true);
  }else if(result===-1){
    const head=notableById(h.head);
    if(head&&head.alive){
      const old=W.monarch;
      if(old&&old.alive){old.role='courtier';old.agenda='broods on a stolen crown';}
      W.monarch=head;head.role='monarch';head.house=0;
      h.loyalty=95;W.legitimacy=42;
      adoptDynasty(W.war.rebel);
      W.reignNum[head.name]=(W.reignNum[head.name]||0)+1;W.reignStart=day();
      W.settlements.forEach(s=>{if(s.owner===W.war.rebel)s.owner=0;});
      // the house needs a new head now that its lord wears the crown
      const newHead=W.notables.filter(n=>n.alive&&n.house===W.war.rebel&&n!==head&&ageOf(n)>=16).sort((a,b)=>ageOf(b)-ageOf(a))[0];
      if(newHead){newHead.role='head';h.head=newHead.id;}
      reignHeader(head);
      emit('war',10,W.capital.pos,`The old dynasty is cast down! ${fullTitle(head)} of ${h.name} takes the throne by right of conquest, and ${warName} passes into song.`);
    }else{
      emit('war',9,W.capital.pos,`${warName} gutters out in exhaustion; a hollow peace settles over burnt fields.`);
    }
  }else{
    h.loyalty=45;
    emit('war',8,W.capital.pos,`${warName} ends after ${dur} months, with neither side master of the field. A weary peace is sworn at the border stones.`);
  }
  { // the peace settles what the rising took: a crown victory hands back its towns; any end leaves the capital with the crown
    for(const s of W.settlements){ // (the hosts are already paid off, so who rose is read from what they took: anything not the crown's own capture)
      if(result===1&&s.takenFrom!=null&&s.owner!==0&&s.owner!==s.takenFrom&&W.houses[s.takenFrom]&&!W.houses[s.takenFrom].exiled){s.owner=s.takenFrom;syncOwner(s);}
      s.takenFrom=null;}
    if(W.capital.owner!==0){W.capital.owner=0;syncOwner(W.capital);}
  }
  W.war=null;W.truceUntil=day()+1500;
  if(W.player)W.player.peaceSince=day();
  refreshOverlay();
}
function nearestPlaceName(x,z){
  let best=W.settlements[0],bd=1e18;
  for(const s of W.settlements){const d=dist2d(x,z,s.pos.x,s.pos.z);if(d<bd){bd=d;best=s;}}
  return best.name;
}

/* ============================ THREATS ==================================== */
function igniteFire(s,n,cause){
  const cands=s.buildings.filter(b=>b.state==='sound');
  let lit=0;
  for(let i=0;i<n&&cands.length;i++){
    const b=pick('sim',cands);
    if(b.state==='sound'){b.state='burning';b.burnT=0;s.fires.push(b);updateBuildingInstance(b);lit++;}
  }
  return lit;
}
function tickThreats(){
  const dis=MOD.disaster*mythMult();
  const myth=MOD.myth;
  // random plague genesis (rare; trade is the usual vector)
  if(!W.plagueActive&&chance('sim',0.00013*dis*MOD.vir)){ // a new pestilence every generation or so
    const s=pick('sim',W.settlements.filter(x=>x.harbor||x.kind==='capital'))||W.capital;
    s.infected=4;
    emit('fates',7,s.pos,`A strange sickness appears in ${s.name}: fevers, and dark blooms upon the skin. The learned mutter of ill airs.`);
    plagueArrives(s);
  }
  // fires: spread & burn out
  for(const s of W.settlements){
    if(!s.fires.length)continue;
    const wet=W.weather.state==='rain'||W.weather.state==='storm'||W.weather.state==='snow';
    const dry=W.drought?1.8:1;
    const newFires=[];
    for(const b of s.fires){
      b.burnT++;
      if(b.burnT>=3){
        b.state='ruin';b.rebuildT=day()+180+randi('sim',300);s.ruinCount++;
        (s._burned||(s._burned=[])).push({x:b.x,z:b.z});
        updateBuildingInstance(b);continue;
      }
      // spread through the adjacency graph, biased by wind
      for(const o of s.buildings){
        if(o.state!=='sound')continue;
        const d=dist2d(b.x,b.z,o.x,o.z);
        if(d<24&&chance('sim',(wet?0.05:0.3)*dry)){
          const windDot=((o.x-b.x)*Math.cos(W.weather.wind)+(o.z-b.z)*Math.sin(W.weather.wind))/(d||1);
          if(chance('sim',0.5+windDot*0.4)){o.state='burning';o.burnT=0;newFires.push(o);updateBuildingInstance(o);}
        }
      }
      newFires.push(b);
    }
    const before=s.fires.length;
    s.fires=newFires.filter(b=>b.state==='burning');
    if(before>0&&s.fires.length===0){
      if(s.ruinCount>=6){W.stats.greatFires++;
        emit('fates',8,s.pos,`The great fire of ${s.name} is spent at last. ${s.ruinCount} roofs are fallen to ash; the survivors sift the ruins.`);
        s.prosperity=clamp(s.prosperity-12,1,100);}
      const B=s._burned||[];s._burned=[];
      if(B.length>=8&&s._lay&&s._lay.live){ // the burned district is cleared and laid out again: stone houses, and a straight street across it
        const cx=B.reduce((t,q)=>t+q.x,0)/B.length,cz=B.reduce((t,q)=>t+q.z,0)/B.length,r=clamp(Math.max(...B.map(q=>dist2d(q.x,q.z,cx,cz)))+8,24,75);
        s._lay.live.fire({x:cx,z:cz,r});syncLive(s);
        emit('trade',5,{x:cx,z:cz},`In ${s.name} the burned streets are cleared; the council lays out a new, straight street and orders the houses rebuilt in stone.`);}
    }
    if(s.fires.length===5&&!s._gfAnnounced){s._gfAnnounced=true;
      emit('fates',8,s.pos,`Fire leaps from roof to roof in ${s.name}! The wind ${wet?'and the rain contend with':'feeds'} the blaze.`);}
    if(!s.fires.length)s._gfAnnounced=false;
  }
  // rebuilding — scars heal slowly, gated on prosperity
  if(day()%10===0)for(const s of W.settlements)for(const b of s.buildings){
    if(b.state==='ruin'&&day()>b.rebuildT&&s.prosperity>40&&chance('sim',0.3)){
      b.state='sound';s.ruinCount=Math.max(0,s.ruinCount-1);updateBuildingInstance(b);
    }
  }
  // lightning ignition
  if(W.weather.state==='storm'&&chance('sim',0.02*dis)){
    const s=pick('sim',W.settlements);
    if(igniteFire(s,1,'lightning'))emit('fates',5,s.pos,`Lightning strikes a roof in ${s.name} and flames take hold.`);
  }
  // drought
  const si=seasonIdx();
  if(si===1&&!W.drought&&W.clock.day%360>=95&&W.clock.day%360<=100&&chance('sim',0.05*dis)){
    W.drought=true;lastSeasonKey='';
    emit('fates',7,W.capital.pos,`No rain has fallen since the spring; the realm is gripped by drought. Fields wither to straw and the millponds shrink.`);
  }
  if(W.drought&&si===2){W.drought=false;lastSeasonKey='';
    emit('fates',5,W.capital.pos,`Autumn rains at last break the drought, though the harvest is thin.`);}
  // flood
  if(si===0&&W.snowpack>60&&(W.weather.state==='storm'||W.weather.state==='rain')&&chance('sim',0.05*dis)&&!W.flooding){
    W.flooding=8;W.snowpack=15;
    for(const s of W.settlements)if(s.river){
      s.prosperity=clamp(s.prosperity-8,1,100);
      const riverside=s.buildings.filter(b=>b.state==='sound').slice(0,3);
      for(const b of riverside)if(chance('sim',0.4)){b.state='ruin';b.rebuildT=day()+150;s.ruinCount++;updateBuildingInstance(b);}
      emit('fates',7,s.pos,`The river bursts its banks at ${s.name}! Brown water sweeps through the low streets, carrying off byres and bridges.`);
    }
  }
  // earthquake
  if(chance('sim',0.00009*dis)){
    const ex=(rand('sim')-0.5)*SIZE*0.8,ez=(rand('sim')-0.5)*SIZE*0.8;
    cam.shake=26;
    let wrecked=0;
    for(const s of W.settlements){
      if(dist2d(ex,ez,s.pos.x,s.pos.z)>1100)continue;
      for(const b of s.buildings)if(b.state==='sound'&&chance('sim',0.06)){b.state='ruin';b.rebuildT=day()+240;s.ruinCount++;updateBuildingInstance(b);wrecked++;}
      if(chance('sim',0.4))igniteFire(s,1,'quake');
    }
    emit('fates',9,{x:ex,z:ez},`The earth shakes! Walls crack and bells toll of themselves${wrecked?'; '+wrecked+' buildings are thrown down':''}. The pious speak of judgment.`);
  }
  // bandits
  tickBandits(dis);
  // dragon (Myth gates its waking inside; a raid already under way must always resolve)
  tickDragon();
  // omens
  tickOmens(myth,dis);
}
let campN=0;
function tickBandits(dis){
  const avgUnrest=W.settlements.reduce((t,s)=>t+s.unrest,0)/W.settlements.length;
  if(W.banditCamps.length<3&&chance('sim',(0.0012+avgUnrest*0.00006+(W.war?0.002:0))*MOD.bandit)){
    // camp in forest far from settlements
    for(let t=0;t<40;t++){
      const cx=randi('sim',GRID),cz=randi('sim',GRID),i=cIdx(cx,cz);
      if(W.biome[i]!==B.FOREST&&W.biome[i]!==B.PINE)continue;
      const x=cellX(cx),z=cellZ(cz);
      if(W.settlements.some(s=>dist2d(x,z,s.pos.x,s.pos.z)<700))continue;
      const camp={id:++campN,x,z,raids:0,king:null,born:day()};
      W.banditCamps.push(camp);
      const g=campGroup(0x4a4038);g.position.set(x,hAt(x,z),z);
      g.traverse(o=>o.userData.pick={type:'camp',camp});
      scene.add(g);G.campMeshes.set(camp,g);
      emit('fates',5,{x,z},`Masterless men gather in the ${W.biome[i]===B.PINE?'pine uplands':'greenwood'}; travellers speak of a robber camp near ${nearestPlaceName(x,z)}.`);
      break;
    }
  }
  for(const camp of[...W.banditCamps]){
    // outlaws drift away if the pickings are thin
    if(day()-camp.born>900&&camp.raids<2){
      const g=G.campMeshes.get(camp);if(g)scene.remove(g);G.campMeshes.delete(camp);dropMarker(camp);
      W.banditCamps=W.banditCamps.filter(x=>x!==camp);
      continue;
    }
    // ambush caravans passing near (position computed in sim time, not render time)
    for(const c of W.caravans){
      if(c.sea||c.river||c.robbed)continue; // barges are beyond the outlaws' reach
      const f=(day()-c.departDay)/Math.max(0.01,c.arriveDay-c.departDay);
      const p=polyPos(c.poly,f);
      if(!p)continue;
      if(dist2d(camp.x,camp.z,p.x,p.z)<320&&chance('sim',0.12*MOD.bandit)){
        c.robbed=true;camp.raids++;camp.loot=(camp.loot||0)+c.value;
        emit('fates',5,{x:p.x,z:p.z},`Bandits fall upon a caravan on the ${W.settlements[c.origin].name} road! The mules are driven off and the goods lost.`);
        W.settlements[c.dest].prosperity=clamp(W.settlements[c.dest].prosperity-1,1,100);
      }
    }
    if(camp.raids>=3&&!camp.king&&chance('sim',0.01)){
      camp.king=personName('m')+' '+pick('sim',['the Red','Hooksword','of the Hollow','Half-hanged','the Quiet']);
      const n=mkNotable({name:camp.king,sex:'m',age:30,birthDay:day()-30*360,house:0,role:'Bandit King',traits:['bold','cruel'],agenda:'reigns over the greenwood'});
      camp.kingId=n.id;
      emit('fates',6,camp,`The outlaws have crowned a king of thieves: men whisper the name ${camp.king}.`);
    }
    // crown response: bounty patrol
    if(camp.raids>=2&&!camp.patrol&&(sovOn()||W.treasury>400)&&!(camp.ignoreUntil>day())&&chance('sim',0.02)){
      petition({key:'bounty'+camp.id,title:'Outlaws on the roads',pos:camp,
        text:`Merchants petition the crown: the robbers near ${nearestPlaceName(camp.x,camp.z)}${camp.king?', led by '+camp.king+',':''} have taken ${camp.raids} caravans. Will the crown send riders?`,
        ai:0,opts:[
        {label:'Post a bounty and send riders',cost:200,act:()=>sendRiders(camp)},
        {label:'The roads must look to themselves',act:()=>{camp.ignoreUntil=day()+240;W.legitimacy=clamp(W.legitimacy-1,0,100);
          emit('trade',3,camp,`The crown will not spare riders for the roads near ${nearestPlaceName(camp.x,camp.z)}; the merchants hire their own guards.`);}}]});
    }
    if(camp.patrol&&day()>=camp.patrolArrive){
      if(chance('sim',camp.king?0.45:0.75)){
        const g=G.campMeshes.get(camp);if(g)scene.remove(g);G.campMeshes.delete(camp);dropMarker(camp);
        W.banditCamps=W.banditCamps.filter(x=>x!==camp);
        if(camp.kingId){const bk=notableById(camp.kingId);if(bk)killNotable(bk,'hanged at the crossroads',true);}
        emit('war',5,camp,`The bandit camp near ${nearestPlaceName(camp.x,camp.z)} is burned and its brigands ${camp.king?'scattered — '+camp.king+' swings at the crossroads':'hanged in a row'}.`);
        W.legitimacy=clamp(W.legitimacy+2,0,100);
      }else{
        camp.patrol=false;camp.raids++;
        emit('war',5,camp,`The crown’s riders are ambushed in the deep wood and driven off; the outlaws grow bolder.`);
      }
    }
  }
}
function wakeDragon(msg){
  const d=W.dragon,tgt=[...W.settlements].sort((a,b)=>b.prosperity*b.pop-a.prosperity*a.pop)[0];
  const L=d.lair;
  d.state='raiding';d.wakes++;d.target=tgt;d.mood='wrathful';
  d.path=[{x:L.x,z:L.z,y:L.y+120},{x:(L.x+tgt.pos.x)/2,z:(L.z+tgt.pos.z)/2,y:500},{x:tgt.pos.x,z:tgt.pos.z,y:tgt.pos.y+60}];
  d.departDay=day();d.arriveDay=day()+dist2d(L.x,L.z,tgt.pos.x,tgt.pos.z)/3000;
  emit('fates',10,{x:L.x,z:L.z},msg(d,tgt));
}
function sendRiders(camp){
  if(camp.patrol||!W.banditCamps.includes(camp))return;
  camp.patrol=true;
  camp.patrolArrive=day()+dist2d(camp.x,camp.z,W.capital.pos.x,W.capital.pos.z)/700;
  emit('war',4,W.capital.pos,`The crown posts a bounty and sends riders against the outlaws of ${nearestPlaceName(camp.x,camp.z)}.`);
}
function tickDragon(){
  const d=W.dragon;
  if(d.dead){
    if(!d.rebornAt)d.rebornAt=day()+38*360+randi('sim',10*360);
    if(day()>=d.rebornAt){
      W.dragon={name:pick('sim',NAMEB.dragon),lair:d.lair,state:'sleeping',hoard:500,pos:null,path:null,
        target:null,mood:'newly come',wakes:0};
      emit('fates',7,{x:d.lair.x,z:d.lair.z},`Shepherds swear that a shadow crossed the moon, and that something has taken up the old lair on the high peak. The elders name it ${W.dragon.name}.`);
    }
    return;
  }
  if(d.state==='sleeping'){
    d.mood=W.treasury>8000?'dreaming of gold':'slumbering';
    // Myth gates only spontaneous waking; a wyrm already aloft always finishes its flight home
    if(MOD.myth>=1&&day()>(d.peaceUntil||0)&&chance('sim',clamp(W.treasury/30000,0,1)*0.0035*mythMult()))
      wakeDragon((d,tgt)=>`${d.name} has woken! The dragon lifts from the high peak on wings like storm-cloud, and turns toward ${tgt.name}.`);
  }else if(d.state==='raiding'&&day()>=d.arriveDay){
    const t=d.target;
    igniteFire(t,3,'dragon');
    const stolen=Math.max(0,W.treasury*0.3);
    W.treasury-=stolen;d.hoard+=stolen;
    t.unrest=clamp(t.unrest+18,0,100);
    W.legitimacy=clamp(W.legitimacy-8,0,100);
    emit('fates',10,t.pos,`${d.name} descends upon ${t.name} in fire! A district burns, and the wyrm flies home heavy with ${Math.round(stolen)} in gold.`);
    d.state='returning';
    d.path=[{x:t.pos.x,z:t.pos.z,y:t.pos.y+80},{x:d.lair.x,z:d.lair.z,y:d.lair.y+120}];
    d.departDay=day();d.arriveDay=day()+dist2d(t.pos.x,t.pos.z,d.lair.x,d.lair.z)/3000;
  }else if(d.state==='returning'&&day()>=d.arriveDay){
    d.state='sleeping';d.mood='sated';
    // the crown responds, per the monarch's valor
    const m=W.monarch;
    if(m&&m.alive&&ageOf(m)>=16){
      const swear=()=>{d.slayAt=day()+25;d.slayer=m.id;
        emit('crown',8,W.capital.pos,`${fullTitle(m)} swears before the court to slay the wyrm, and calls for volunteers of good courage.`);};
      const tribute=()=>{const t=Math.max(0,W.treasury*0.2);
        W.treasury-=t;d.hoard+=t;d.peaceUntil=day()+1800;
        W.legitimacy=clamp(W.legitimacy-6,0,100);
        emit('crown',7,W.capital.pos,`${fullTitle(m)} sends tribute of ${Math.round(t)} gold to the dragon's peak, buying an uneasy peace. The smallfolk grumble at the cost.`);};
      petition({key:'wyrm',title:`${d.name} returns to its peak`,pos:{x:d.lair.x,z:d.lair.z},
        text:`The wyrm has fed on ${d.target.name} and flown home. The court looks to ${fullTitle(m)}: will the crown ride against it, or pay for peace?`,
        ai:()=>m.traits.includes('bold')||(!m.traits.includes('craven')&&chance('sim',0.5))?0:1,
        opts:[{label:`Swear to slay it (${m.traits.includes('bold')?'bold — ':''}the monarch rides in person)`,act:swear},
              {label:'Send tribute (a fifth of the treasury)',act:tribute},
              {label:'Do nothing, and bar the gates',act:()=>{W.legitimacy=clamp(W.legitimacy-3,0,100);
                emit('crown',5,W.capital.pos,`The crown neither fights nor pays; the smallfolk mutter that the wyrm will come again.`);}}]});
    }
  }
  if(d.slayAt&&day()>=d.slayAt){
    const m=notableById(d.slayer);d.slayAt=null;
    if(m&&m.alive){
      if(chance('sim',0.45+(m.traits.includes('bold')?0.08:0)-(m.traits.includes('craven')?0.15:0))){
        d.dead=true;d.state='dead';d.mood='slain';
        W.treasury+=d.hoard;W.legitimacy=clamp(W.legitimacy+25,0,100);
        m.epithet='the Dragonslayer';sovAmbition('wyrm');
        emit('crown',10,{x:d.lair.x,z:d.lair.z},`Wonder of the age! ${fullTitle(m)} has slain ${d.name} upon the high peak. The hoard — ${Math.round(d.hoard)} in old gold — is carried down by torchlight.`,{festival:true});
      }else{
        emit('fates',10,{x:d.lair.x,z:d.lair.z},`Woe! ${fullTitle(m)} is burned upon the mountainside by ${d.name}, and the host returns bearing only a scorched shield.`);
        killNotable(m,'in dragonfire upon the peak',true);
        d.peaceUntil=day()+900;
      }
    }
  }
}
function tickOmens(myth,dis){
  if(W.comet&&day()>W.comet.until)W.comet=null; // expire even with Myth off, or a fanged comet doubles fate forever
  if(myth<1)return;
  // comet
  if(!W.comet&&chance('sim',0.0006*dis)){
    W.comet={start:day(),until:day()+12,teeth:myth>=2};
    if(myth>=2)W.comet.until=day()+360;
    emit('fates',6,W.capital.pos,`A comet burns in the ${pick('sim',['northern','western','evening'])} sky, trailing fire. ${myth>=2?'The wise are afraid: such stars rain ruin on the year beneath them.':'Some say it foretells the death of princes; others, a good vintage.'}`);
    W.settlements.forEach(s=>s.unrest=clamp(s.unrest+4,0,100));
    if(myth>=2&&!W.prophet){
      const p=mkNotable({name:personName(chance('sim',0.5)?'m':'f'),sex:'m',age:40,birthDay:day()-40*360,house:0,role:'Prophet',traits:['pious','bold'],agenda:'cries doom in the market squares'});
      W.prophet=p.id;
      emit('fates',5,W.capital.pos,`A ragged prophet appears at the gates of ${W.capital.name}, crying that the comet is a sword unsheathed.`);
    }
  }
  if(W.comet&&day()>W.comet.until)W.comet=null;
  // eclipse
  if(W.eclipse<=0&&chance('sim',0.00025*dis)){
    W.eclipse=1.2;
    emit('fates',6,W.capital.pos,`At midday the sun is eaten and a cold dusk falls. Birds go to roost; men fall to their knees in the fields.`);
    W.settlements.forEach(s=>s.unrest=clamp(s.unrest+(myth>=2?7:3),0,100));
  }
  // small omens
  if(chance('sim',0.0004*dis)){
    const s=pick('sim',W.settlements);
    emit('fates',3,s.pos,pick('sim',[
      `A calf with two heads is born near ${s.name}; the priests dispute its meaning.`,
      `The moon rises red as a wound over ${s.name}.`,
      `Fish rain upon the fields outside ${s.name}, to the wonder of all.`,
      `A white hart is seen at dusk by the walls of ${s.name}, and vanishes.`]));
    if(myth>=2)s.unrest=clamp(s.unrest+3,0,100);
  }
}

/* ============================ GROWTH ===================================== */
/* Population drives the built fabric both ways: growth raises new roofs
   (outside the walls once the core is full), decline lets them fall to ruin,
   and sustained prosperity upgrades buildings through the tiers
   (hovel-built → timber-framed → stone-built). */
const HOUSEHOLD=5; // souls to a roof; a storeyed town house holds lodgers and journeymen too
const RESID=new Set(['house','longhouse','burgher','shop','tavern','smithy','bakery','inn','tannery','dyer','hospital','toll']);
function housing(s){let n=20;for(const b of s.buildings)if(b.state==='sound')n+=RESID.has(b.arch)?HOUSEHOLD*(1+0.45*b.tier):2;return n;}
function syncLive(s){ // after a structural change: buildings in and out of the instance buffers, walls, streets, fields, distance fields
  for(const b of G.bldList)if(b.removed&&b.state!=='gone'){b.state='gone';updateBuildingInstance(b);}
  for(const b of s.buildings)if(b.idx===undefined&&G.bldList.length<G.bodies.instanceMatrix.count){b.idx=G.bldList.length;G.bldList.push(b);updateBuildingInstance(b);if(G.land)clearLandUnder(b);}
  G.bodies.count=G.roofs.count=G.bldList.length;G.bodies.instanceMatrix.needsUpdate=G.roofs.instanceMatrix.needsUpdate=true;
  if(s.wallRad)s.wallR=Math.max(...s.wallRad);
  s.growSlots=s._lay.queue();stitchRoads();G.roadsDirty=true;G.detDirty=true;rebuildWalls();
  if(G.land)markSettlementBuilt(s);
  if(G.feat){const F=G.feat;F.mute=true; // walls, ways and yards are laid again from what stands now (burned lanes and pulled-down houses leave no ghosts)
    F.src[1].fill(0);F.E[1].fill(255);F.src[2].fill(0);F.E[2].fill(255);F.src[4].fill(0);
    for(const o of W.settlements){featWalls(o);for(const b of o.buildings)if(b.state!=='gone'&&!b.removed)featBuilding(b);}featRoads();F.mute=false;
    const R=(s.extentR||s.radius||300)+260;featDirty(s.pos.x-R,s.pos.z-R,s.pos.x+R,s.pos.z+R);}
}
function outsideFrac(s){ // how much of the town now stands outside its wall
  if(!s.wallRad)return 1;let o=0,n=0;
  for(const b of s.buildings)if(b.state==='sound'&&RESID.has(b.arch)){n++;const a=Math.atan2(b.z-s.pos.z,b.x-s.pos.x);if(dist2d(b.x,b.z,s.pos.x,s.pos.z)>wallRadAt(s,a)+4)o++;}
  return n?o/n:0;
}
function tickHistory(){ // once a year for each place (staggered): the town's own history continues
  W.settlements.forEach((s,si)=>{
    const L=s._lay;if(!L||!L.live||day()%360!==(si*47+90)%360)return;
    if(s.pop0===undefined)s.pop0=s.pop;
    if(L.reuse)for(const b of L.reuse(Math.max(3,Math.round(s.buildings.length/25))))if(b.idx!==undefined)updateBuildingInstance(b);
    const roadsN=W.roads.filter(r=>r.a===si||r.b===si).length;let did=null;
    if(s.kind==='village'&&AD()>=950&&s.pop>420&&s.prosperity>50&&(roadsN>=2||s.river||s.harbor)&&chance('sim',0.4)){
      L.live.promote();did=`${s.name} is granted a market charter; the village is a town now, and its fair draws the countryside.`;}
    else if(s.kind!=='village'&&!s.wallRad&&s.pop>850&&s.prosperity>48&&chance('sim',0.3)){
      L.live.wall();s._wallPop=s.pop;s._wallYr=year();did=`The burghers of ${s.name} raise a wall about their town${s.natDef>0.2?', the river guarding one side':''}.`;}
    else if(s.wallRad&&s.kind!=='village'&&outsideFrac(s)>0.45&&s.pop>(s._wallPop||s.pop0)*1.4&&year()-(s._wallYr||-99)>=45&&s.prosperity>52&&!s.siegeBy&&chance('sim',0.3)){ // walls are dear: a generation or two between circuits
      if(L.live.wall()){s._wallPop=s.pop;s._wallYr=year();const h=s.history[s.history.length-1];did=`${s.name} has outgrown its walls: a new circuit takes in the suburbs${h&&/keeps (\d+)%/.test(h.t)?`, keeping ${h.t.match(/keeps (\d+)%/)[1]}% of the old wall`:''}.`;}
      else s._wallYr=year()-30;} // the old wall still serves: ask again in fifteen years
    else if(s.walls===1&&AD()>=1150&&s.prosperity>55&&s.pop>600&&chance('sim',0.25)&&L.live.stoneWall())did=`The burghers of ${s.name} take down their palisade and wall the town in stone.`;
    else if(s.bailey&&!s.baileyStone&&AD()>=1150&&s.prosperity>55&&chance('sim',0.2)&&L.live.stoneBailey())did=`The bailey at ${s.name} is walled in stone.`;
    else if(s.prosperity>(s.motte&&!s.motteStone?45:68)&&s.pop>s.pop0*(s.motte?1.1:1.4)&&chance('sim',0.25)&&L.live.rebuildKeep()){s.motteStone=true;did=`The keep of ${s.name} is rebuilt in stone.`;}
    else if(s.kind!=='village'&&s.prosperity>65&&s.pop>s.pop0*1.6&&chance('sim',0.2)&&L.live.rebuildChurch())did=`The church of ${s.name} is pulled down and rebuilt larger, its new tower visible for leagues.`;
    else if(s.kind!=='village'&&AD()>=1000&&s.pop>900&&chance('sim',0.15)&&L.live.parish())did=`A new parish church is built for a growing quarter of ${s.name}.`;
    else if(s.kind!=='village'&&AD()>=1220&&s.wallRad&&s.pop>1100&&chance('sim',0.2)&&L.live.friary())did=`Friars are given ground by the wall of ${s.name} for their house.`;
    else if(s.kind!=='village'&&AD()>=1150&&(s.role==='crossing'||s.kind==='capital'&&s.river)&&s.pop>900&&chance('sim',0.1)&&L.live.neustadt())did=`The lord plants a “New Town” across the river from ${s.name}: one straight street of equal plots.`;
    else if(s.bastions&&(s.role==='border'||s.kind==='capital')&&!s.citadel&&chance('sim',0.3)&&L.live.citadel())did=`A star citadel is raised astride the walls of ${s.name}, a quarter razed for it.`;
    if(!did&&s.kind!=='village'&&AD()>=1150)L.live.backyards();
    if(did){syncLive(s);emit('trade',6,s.pos,did);}
    else if(s.growSlots&&s.growSlots.length<15){L.live.lanes(s.kind==='village'?2:4);s.growSlots=L.queue();}
    // aftermath of a siege: the suburbs burned to deny the enemy cover
    if(s._besieged&&!s.siegeBy){s._besieged=false;if(s.wallRad){L.live.siege();syncLive(s);}}
    if(s.siegeBy)s._besieged=true;
  });
}
function tickGrowth(){
  if(day()%6!==0)return;
  for(const s of W.settlements){
    const room=housing(s);
    if(s.pop>room*1.1&&s.prosperity>35&&!s.siegeBy){
      const n=s.pop>room*1.5?3:1;let got=0; // far behind: the town fills quickly
      for(let k=0;k<n;k++){const b=addBuildingLive(s);if(b)got++;
        if(b&&chance('sim',0.03))emit('trade',3,s.pos,`${s.name} grows: new roofs rise in the ${b.district} quarter.`);}
      if(!got&&chance('sim',0.5)){ // nowhere left to build: the town builds upward, the nearest houses first
        const low=s.buildings.filter(o=>o.state==='sound'&&RESID.has(o.arch)&&o.tier<Math.max(1,tierCap())).map(o=>[o,dist2d(o.x,o.z,s.pos.x,s.pos.z)]).sort((x,y)=>x[1]-y[1]).slice(0,30);
        const pk=wpick(low,x=>-x[1]/120+(x[0].arch==='burgher'||x[0].arch==='shop'?0.5:0),1),b=pk&&pk[0];
        if(b){b.tier++;b.h=ARCH[b.arch][2]*(0.8+b.tier*0.25);updateBuildingInstance(b);
          if(!s._upNote){s._upNote=1;emit('trade',3,s.pos,`${s.name} can spread no further; its houses rise a storey and let rooms to lodgers.`);}}
      }
    }else if(s.pop<room*0.5&&chance('sim',0.15)){ // too few to fill the houses: the outermost stand empty and fall in
      const out=s.buildings.filter(o=>o.state==='sound'&&RESID.has(o.arch)).map(o=>[o,dist2d(o.x,o.z,s.pos.x,s.pos.z)]).sort((x,y)=>y[1]-x[1]).slice(0,20);
      const pk=wpick(out,x=>x[1]/100-x[0].tier*0.8,1),b=pk&&pk[0]; // the poor outskirts empty first
      if(b){b.state='ruin';b.deserted=true;b.rebuildT=Infinity;s.ruinCount++;updateBuildingInstance(b);}
    }
    // prosperity slowly rebuilds in better material
    if(s.prosperity>62&&!s.siegeBy&&chance('sim',0.25)){
      const core=(s.extentR||s.radius||100)*0.4;
      const ups=s.buildings.filter(b=>b.state==='sound'&&b.arch!=='wall'&&!b.motte&&b.tier<Math.min(tierCap(),b.inst||s.kind!=='village'&&dist2d(b.x,b.z,s.pos.x,s.pos.z)<core?2:1)); // stone for the rich heart of a town; the rest stays timber
      if(ups.length){
        const b=pick('sim',ups);
        b.tier++;
        const a=ARCH[b.arch];
        b.h=a[2]*(0.8+b.tier*0.25); // taller and finer on the same lot (growing the footprint overlapped the neighbours)
        updateBuildingInstance(b);
        if(chance('sim',0.04))
          emit('trade',3,s.pos,`A ${a[4]} in ${s.name} is rebuilt in ${b.tier===2?'good stone':'timber and plaster'}; the street is the finer for it.`);
      }
    }
  }
}

/* ============================ ACTS (triggers) ============================ */
function doAct(act,p,opt){
  const nearS=()=>{let b=W.settlements[0],bd=1e18;for(const s of W.settlements){const d=dist2d(p.x,p.z,s.pos.x,s.pos.z);if(d<bd){bd=d;b=s;}}return b;};

    case 'fire':{const s=nearS();if(igniteFire(s,2,'act'))emit('fates',6,s.pos,`Fire! Flames leap up in ${s.name}.`);break;}
    case 'flood':{W.snowpack=90;W.flooding=8;
      for(const s of W.settlements)if(s.river){s.prosperity=clamp(s.prosperity-8,1,100);
        emit('fates',7,s.pos,`The river rises in spate and drowns the low streets of ${s.name}.`);}break;}
    case 'drought':{W.drought=true;lastSeasonKey='';
      emit('fates',7,W.capital.pos,`The sky turns to brass: drought settles on the realm.`);break;}
    case 'quake':{cam.shake=26;let n=0;
      for(const s of W.settlements){if(dist2d(p.x,p.z,s.pos.x,s.pos.z)>1100)continue;
        for(const b of s.buildings)if(b.state==='sound'&&chance('sim',0.07)){b.state='ruin';b.rebuildT=day()+240;s.ruinCount++;updateBuildingInstance(b);n++;}
        if(chance('sim',0.5))igniteFire(s,1,'quake');}

    case 'dragon':{const d=W.dragon; // (used to also set the treasury to 9,000 — free gold for the crown)
      if(!d||d.dead){emit('fates',2,null,'The high peak is silent; no wyrm lairs there now.');return false;}
      if(d.state!=='sleeping'){emit('fates',2,null,`${d.name} is already aloft.`);return false;}
      d.peaceUntil=0;d.forceWake=true;
      emit('fates',6,{x:d.lair.x,z:d.lair.z},`Something stirs on the high peak; shepherds drive their flocks down before nightfall.`);break;}
    case 'bandits':{const camp={id:++campN,x:p.x,z:p.z,raids:0,king:null,born:day()};W.banditCamps.push(camp);
      const g=campGroup(0x4a4038);g.position.set(p.x,hAt(p.x,p.z),p.z);

      scene.add(g);G.campMeshes.set(camp,g);

    case 'assassinate':{const m=W.monarch;if(m&&m.alive){
      emit('crown',10,W.capital.pos,`Murder in the court! ${fullTitle(m)} is slain by a hired knife${pick('sim',[' at the feast',' upon the stair',' at prayer'])}. The realm holds its breath.`);
      W.legitimacy=clamp(W.legitimacy-15,0,100);
      W.settlements.forEach(s=>s.unrest=clamp(s.unrest+12,0,100));
      killNotable(m,'by an assassin’s blade',true);}break;}
    case 'contest':{if(W.war){emit('war',2,null,`The realm is already at war; no further claimant dares stir.`);return false;}
      const c=W.houses.map((h,i)=>i).filter(i=>i>0&&!W.houses[i].exiled);
      if(c.length){const hi=c.sort((a,b)=>W.houses[a].loyalty-W.houses[b].loyalty)[0];
        W.houses[hi].loyalty=Math.min(W.houses[hi].loyalty,25);W.truceUntil=0;
        startWar(hi,'contests the succession');}break;}
    case 'marriage':{ // nobles only — the Prophet and the Bandit King are nobody's match
      const MARRY=['monarch','heir','scion','cousin','head'];
      const single=W.notables.filter(n=>n.alive&&!n.spouse&&MARRY.includes(n.role)&&ageOf(n)>=17&&ageOf(n)<=45);

      if(!(a&&b)){emit('crown',2,null,'The heralds search the rolls in vain: there is no suitable match to be made.');return false;}

    case 'bless':{for(const s of W.settlements)s.stores.grain+=s.pop*0.35;W.drought=false;lastSeasonKey='';
      emit('trade',4,W.capital.pos,`The season turns kind beyond all memory: granaries groan and the price of bread falls to nothing.`);break;}
    case 'comet':{W.comet={start:day(),until:day()+(MOD.myth>=2?360:12),teeth:MOD.myth>=2};

    case 'village':{const ci=toCell(p.x),cj=toCell(p.z);
      if(W.water[cIdx(ci,cj)]||slopeAt(ci,cj)>0.25){emit('trade',2,p,'The surveyors find no good ground here.');return false;}
      if(W.settlements.some(o=>dist2d(p.x,p.z,o.pos.x,o.pos.z)<(o.radius||90)+150)){
        emit('trade',2,p,'The surveyors will not charter a village in the shadow of another.');return false;}
      const s={name:placeName(),kind:'village',pos:{x:p.x,z:p.z,y:hAt(p.x,p.z)},cx:ci,cz:cj,pop:60,

        harbor:false,river:false,owner:0,buildings:[],garrison:4,infected:0,recovered:0,plagueDead:0,
        fires:[],ruinCount:0,pyres:false,festivalUntil:0,siegeBy:null,revolted:false,growthClock:0,lastRaid:-999,radius:90,

      let bj=0,bd=1e18;W.settlements.forEach((o,oi)=>{if(oi!==si){const d=dist2d(p.x,p.z,o.pos.x,o.pos.z);if(d<bd){bd=d;bj=oi;}}});

      W.adj[si].push({to:bj,ri:W.roads.length-1});W.adj[bj].push({to:si,ri:W.roads.length-1});
      // lay the village out like any other: square, lanes, frontages
      s.pop=opt&&opt.planned?220:60;s.role=opt&&opt.fort?'fort':opt&&opt.planned?'market':'farm';if(opt&&opt.planned){s.kind='town';s.planned=true;s.forceMode='planned';}if(opt&&opt.owner!=null)s.owner=opt.owner;else if(opt&&opt.from)s.owner=opt.from.owner;
      if(opt&&opt.fort){s.walls=1;s.garrison=30;}
      { // named by its founders, in their tongue, for why it is here; a daughter village often after its mother
        const fr=opt&&opt.from,oc=opt&&opt.owner!=null?opt.owner:fr?fr.owner:s.owner;
        s.cult=(fr&&fr.cult)||(W.houses[oc]&&W.houses[oc].cult)||W.crownCult;
        s.name=culturedName(s.cult,siteKeys(s,siteFeatures(p.x,p.z)),nameRng(day()*7+si),fr&&!(opt.fort||opt.planned)?fr.name:null);
      }
      layoutSettlement(s);
      const jl=W.settlements[bj]._lay;if(jl&&jl.joinRoad(W.roads.length-1))syncLive(W.settlements[bj]); // the track enters the old place as a street
      stitchRoads();
      for(const b of s.buildings){if(G.bldList.length>=G.bodies.instanceMatrix.count)break;b.idx=G.bldList.length;G.bldList.push(b);updateBuildingInstance(b);}
      G.bodies.count=G.roofs.count=G.bldList.length;
      for(const b of s.buildings)clearLandUnder(b);

      if(G.treeHash)for(const t of G.treeHash.near(p.x,p.z,s.radius))if(!t.cut&&dist2d(p.x,p.z,t.x,t.z)<s.radius*0.9){t.cut=true;showTree(t,false);} // the settlers clear a green
      for(const r of W.roads)if(r.a===si||r.b===si)for(let k=0;k<r.path.length;k+=2)clearLandAt(r.path[k].x,r.path[k].z,6);
      rebuildRoadMesh();
      const sp=makeTextSprite(s.name,1.6);sp.position.set(p.x,s.pos.y+90,p.z);scene.add(sp);G.labels.push(sp);
      const m=new THREE.Mesh(new THREE.SphereGeometry(60,8,6),new THREE.MeshBasicMaterial({visible:false}));
      m.position.set(p.x,s.pos.y+18,p.z);m.userData.pick={type:'settlement',s};scene.add(m);G.pickS.push(m);
      if(opt&&opt.planned){s.history=[{yr:year(),t:`Founded in one stroke by ${W.houses[s.owner].name} as a free market town: a broad market street, equal plots, a charter of liberties to draw settlers.`}];

}

/* ============================ MASTER TICK ================================ */

/* =========================================================================
   CHRONICLE — the product. Dated entries in annalist voice; click to fly.
   ========================================================================= */
const chronList=()=>document.getElementById('chronlist');
let chronFilter='all', allLines=[], entryCount=0;
const CATMAP={crown:'crown',war:'war',trade:'trade',fates:'fates'};
function emit(cat,pri,pos,text,opts){
  const ev={day:day(),cat,pri,pos:pos?{x:pos.x,z:pos.z}:null,text,opts:opts||{}};
  if(W.prehistory)return ev; // the centuries before play begins leave their marks on the land and in each town's history, not in the annals
  chronicleAdd(ev);
  director.push(ev);
  fxEvent(ev);
  return ev;
}
function chronicleAdd(ev){
  allLines.push('['+dateStr(ev.day)+'] '+ev.text);
  const el=document.createElement('div');
  el.className='centry';el.dataset.cat=ev.cat;
  el.innerHTML='<span class="cd">'+dateStr(ev.day)+'.</span> '+ev.text.replace(/</g,'&lt;');
  if(ev.pos)el.addEventListener('click',()=>{flyTo(ev.pos.x,ev.pos.z,420);markManual();});
  if(chronFilter!=='all'&&ev.cat!==chronFilter)el.style.display='none';
  const list=chronList();
  const stick=list.scrollTop+list.clientHeight>list.scrollHeight-60;
  list.appendChild(el);

/* =========================================================================
   AUTO-DIRECTOR — flies the camera to the story
   ========================================================================= */
const director={queue:[],shot:null,shotUntil:0,cool:{},idleUntil:0,idleTarget:null,
  push(ev){
    if(ev.pri<3||!ev.pos)return;
    this.queue.push({ev,born:perfNow()});
    if(this.queue.length>12)this.queue.sort((a,b)=>b.ev.pri-a.ev.pri).length=12;
  },
  update(now,dt){
    if(cam.mode!=='director'&&!document.body.classList.contains('watch')){
      if(this.shot){this.shot=null;hideBeat();} // don't leave a stale card when the user takes the wheel
      return;
    }
    if(now<cam.manualUntil){
      if(this.shot){this.shot=null;hideBeat();}
      return;
    }
    // expire stale
    this.queue=this.queue.filter(q=>now-q.born<50&&(!this.shot||q.ev!==this.shot.ev));
    // pick a beat
    let best=null;
    for(const q of this.queue){
      const cd=this.cool[q.ev.cat+q.ev.pri]||0;
      if(now<cd&&q.ev.pri<9)continue;
      if(!best||q.ev.pri>best.ev.pri)best=q;
    }
    const curPri=this.shot?this.shot.ev.pri:-1;
    if(best&&(now>=this.shotUntil||best.ev.pri>curPri+1)){
      this.queue=this.queue.filter(q=>q!==best);
      this.beginShot(best.ev,now);
    }else if(!this.shot||now>=this.shotUntil){
      this.shot=null;
      hideBeat();
      // idle: golden-hour establishing orbits (Math.random — must not touch the sim stream)
      if(now>=this.idleUntil){
        this.idleUntil=now+22;
        const s=W.settlements[Math.floor(Math.random()*W.settlements.length)];
        flyTo(s.pos.x,s.pos.z,700+Math.random()*1400,Math.random()*Math.PI*2);
      }
      cam.yaw+=dt*0.03;
    }
    if(this.shot){
      const sh=this.shot;
      cam.yaw+=dt*sh.orbit;
      const t=now-sh.start;
      if(t>3&&sh.push&&cam.dist>sh.push)cam.dist=Math.max(sh.push,cam.dist*Math.pow(0.9,dt*60));
      if(sh.follow&&!cam.follow){cam.follow=sh.follow;}
    }
  },
  beginShot(ev,now){
    const hold=ev.pri>=9?18:ev.pri>=7?14:10;
    this.shot={ev,start:now,orbit:0.05,push:null,follow:null};
    this.shotUntil=now+hold;
    this.cool[ev.cat+ev.pri]=now+45;
    cam.follow=null;
    let d=500;
    if(ev.opts.follow)this.shot.follow=ev.opts.follow;
    if(ev.cat==='war'){d=800;this.shot.push=380;this.shot.orbit=0.08;}
    else if(ev.cat==='fates'&&ev.pri>=9){d=900;this.shot.push=420;}
    else if(ev.cat==='fates'){d=600;this.shot.push=320;}
    else if(ev.opts.festival){d=420;this.shot.orbit=0.12;}
    else if(ev.cat==='crown'){d=520;this.shot.push=300;}
    else if(ev.cat==='trade'){d=600;}
    if(W.dragon&&W.dragon.state==='raiding'&&ev.pri===10&&ev.cat==='fates'){this.shot.follow=W.dragon;}
    flyTo(ev.pos.x,ev.pos.z,d,cam.yaw+0.6);
    showBeat(ev);
  }
};
function showBeat(ev){
  document.getElementById('beattext').textContent=ev.text;
  document.getElementById('beatdate').textContent=dateStr(ev.day);
  document.getElementById('beat').style.display='block';
}
function hideBeat(){document.getElementById('beat').style.display='none';}
function toggleWatch(){
  const on=document.body.classList.toggle('watch');
  if(on){cam.mode='director';cam.manualUntil=0;}
  else{cam.mode='free';hideBeat();}
}

function petition(p){
  if(!sovOn()||(p.to|0)!==(W.player.house|0)){if(p.sovOnly)return;runPetition(p,aiPick(p),true);return;} // not ours to answer: its lord (or the council) decides
  if(W.petitions.some(q=>q.key===p.key))return;
  p.born=day();p.due=day()+(p.days||30);
  W.petitions.push(p);
  if(W.player.pause&&speedIdx>0&&!sovPausedFrom){sovPausedFrom=speedIdx;setSpeed(0);}
  renderPetition();
}
function aiPick(p){
  let i=typeof p.ai==='function'?p.ai():(p.ai||0);
  const ok=o=>o&&!(o.cost&&purse(p.to|0)<o.cost);
  if(!ok(p.opts[i]))i=Math.max(0,p.opts.findIndex(ok));

}
function runPetition(p,i){

  if(o.act)o.act();

}

/* ---- the crown's works: roads, paving, land, clearing a district. Every one is paid for, and every one moves
   the simulation: a new road takes the traffic of the old detour, paving quickens the carts, land bought pays rent,
   a cleared district is laid out again along a straight street and built up by the town's own growth. */
function roadPlan(ai,bi){ // the surveyors' line, and what it will cost: every slope, bridge, marsh and wood is priced
  const A=W.settlements[ai],B=W.settlements[bi],cells=roadAstar(cIdx(A.cx,A.cz),cIdx(B.cx,B.cz));if(!cells)return null;
  let c=0,bridges=0;for(let k=1;k<cells.length;k++){c+=roadCost(cells[k-1],cells[k]);if(W.water[cells[k]]===2&&W.water[cells[k-1]]!==2)bridges++;}
  const path=resample(smoothPath(resample(cells.map(q=>({x:cellX(q%GRID),z:cellZ((q/GRID)|0)})),9),14),8);path[0]={x:A.pos.x,z:A.pos.z};path[path.length-1]={x:B.pos.x,z:B.pos.z};
  return {cells,path,len:polyLen(path),bridges,cost:Math.round(c*14+200)};

function crownRoad(ai,bi){return orderRoad(ai,bi,0);}
/* works are orders, not miracles: a project is set on foot, paid month by month, and the world carries it out */
function orderRoad(ai,bi,payer,P0){

  G.ordersDirty=true;(W.projects=W.projects||[]).push({type:'clear',si,x:p.x,z:p.z,r:R,next:day()+20,gone:0});
  s.unrest=clamp(s.unrest+5,0,100);

}
function lordsRoads(){ // where a long way round carries much traffic, the lord who gains by it builds the short way
  const n=W.settlements.length,P=W.settlements.map(s=>Math.max(20,s.pop)),tot=P.reduce((t,v)=>t+v,0);let best=null;
  for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){const a=W.settlements[i],b=W.settlements[j],d=dist2d(a.pos.x,a.pos.z,b.pos.x,b.pos.z);if(d>2200)continue;
    if(W.roads.some(r=>(r.a===i&&r.b===j)||(r.a===j&&r.b===i)))continue;const rt=route(i,j);if(!rt||rt.len<d*1.6)continue;
    const gain=P[i]*P[j]/tot*(rt.len-d*1.15)/1000;if(!best||gain>best.gain)best={i,j,gain};}
  if(!best||best.gain<25)return;
  const a=W.settlements[best.i],b=W.settlements[best.j],payer=[a.owner,b.owner].filter(h=>h>0&&h!==plyH()&&W.houses[h]&&!W.houses[h].exiled&&!houseAtWar(h)).sort((x,y)=>(W.houses[y].gold||0)-(W.houses[x].gold||0))[0];
  const P0=roadPlan(best.i,best.j);if(!P0)return;
  if(payer&&(W.houses[payer].gold||0)>=P0.cost*1.3)orderRoad(best.i,best.j,payer,P0);
  else if(plyH()!==0&&W.treasury>=P0.cost*2&&(a.owner===0||b.owner===0))orderRoad(best.i,best.j,0,P0); // the crown's council, when no one rules it in person
}
function costOf(d){return typeof d.cost==='function'?d.cost():d.cost;}
function decreeBlock(d){ // → [reason or '', cost]
  const c=costOf(d);

  if(ok!==true)return [ok,c];
  const cd=d.cd?cdLeft('d_'+d.k):0;
  if(cd)return [`ready in ${cd} d`,c];
  if(c>0&&W.treasury<c)return ['too costly',c];

}
function runDecree(k){
  const d=DECREES.find(x=>x.k===k);if(!d)return;
  const [why,c]=decreeBlock(d);if(why)return;
  if(d.place===true){setPlaceMode('charter',c,'Choose the ground for the new village — Esc to cancel');return;}
  if(d.place){setPlaceMode(d.place,d.k,d.hint);return;}
  W.treasury-=c;if(d.cd)setCd('d_'+d.k,d.cd);

}

function ambList(){return W.player&&W.player.house>0?LORD_AMB:AMBITIONS;}
function sovAmbition(key){

  const a=ambList().find(x=>x[0]===key);if(!a)return;

    text:`The dynasty you guided${oldName?' ('+oldName+')':''} has lost the throne after ${yrs} year${yrs===1?'':'s'} of your rule, with a legacy of ${L}${bestLegacy()>L?' (best for this realm: '+bestLegacy()+')':''}. ${fullTitle(W.monarch)} now wears the crown.`,
    opts:[{label:`Rule on as ${W.houses[0].name}`,act:()=>{P.legacy=0;P.amb={};P.since=day();P.startPop=realmPop();P.peaceSince=day();}},
          {label:'Lay down the crown and return to the chronicle',act:()=>setSovereign(false)}]});

function tickSovereign(){
  const P=W.player;if(!P)return;

    if(!sovOn()){ // left Sovereign mode or watching: the council clears the table
      while(W.petitions.length){const p=W.petitions.shift();runPetition(p,aiPick(p));}

    }else if(day()>=W.petitions[0].due){
      const p=W.petitions.shift(),i=aiPick(p);
      emit('crown',3,null,`The crown is silent on “${p.title}”; the council decides: ${p.opts[i].label.replace(/^./,c=>c.toLowerCase())}.`);

  if(P.house>0&&W.houses[P.house].exiled){emit('house',8,W.capital.pos,`${W.houses[P.house].name} is broken and in exile; your part in the realm is played out.`);setSovereign(false);return;}
  if(day()%360===0&&day()>P.since){P.legacy+=2;saveBest(P.legacy);}
  if(day()%10===0)for(const a of ambList())if(a[3]&&!P.amb[a[0]]&&a[3]())sovAmbition(a[0]);

function setSovereign(on,hi){

function lordCmd(cmd,arg){

    case 'muster':{if(cdLeft('l_muster')||!spend(hi,300))return;setCd('l_muster',60);const a=raiseArmy(hi,si,hostTarget(hi)*1.2,'host');a.hold=true;

      h.loyalty=clamp(h.loyalty+12,0,100);emit('war',5,seat.pos,`${h.name} sends men and silver to the royal host.`);break;}
    case 'declare':{if(!W.war||inRevolt(hi))return;raiseArmy(hi,si,600*(h.might||1),'rebel');h.loyalty=Math.min(h.loyalty,20);
      emit('war',8,seat.pos,`${h.name} declares for the rebels!`);refreshOverlay();break;}
    case 'feud':{const j=+arg;if(!W.houses[j]||atWar(hi,j))return;startFeud(hi,j,hi);h.loyalty=clamp(h.loyalty-(W.legitimacy>60?6:2),0,100);break;}
    case 'peace':{const j=+arg,fd=(W.feuds||[]).find(f=>(f.a===hi&&f.b===j)||(f.b===hi&&f.a===j));
      if(fd){fd.until=day();emit('war',5,seat.pos,`${h.name} sends heralds to ${W.houses[j].name} to treat for peace.`);}break;}
    case 'rebel':{if(W.war)return;
      if(!(P.confirm==='rebel'&&performance.now()<P.confirmUntil)){P.confirm='rebel';P.confirmUntil=performance.now()+5000;return;}

function refreshHousePanel(){

      <div class="hbar"><div style="width:${house.exiled?0:Math.round(house.loyalty)}%"></div></div>${hi>0&&!house.exiled&&house.gold!==undefined?`<span style="font-size:11px;margin-left:6px;color:${house.gold<0?'#c0392b':'inherit'}" title="The house's purse">${Math.round(house.gold).toLocaleString()}g</span>`:''}</div>`;

    const m=W.monarch;let s='';

      s+=`<div class="succline pk" data-cmd="notable" data-arg="${m.id}">♛ ${esc(fullTitle(m))}, age ${ageOf(m)}</div>`;
      if(heirs.length)heirs.slice(0,4).forEach((n,i)=>{s+=`<div class="succline pk" data-cmd="notable" data-arg="${n.id}">${i+1}. ${esc(fullTitle(n))}, age ${ageOf(n)}</div>`;});

/* =========================================================================
   PARCHMENT MAP — the realm drawn as the chroniclers would draw it
   ========================================================================= */
function drawLandMap(g,S){ // the estate surveyor's hand: furlongs hatched along their strips, meadows, vines, hedges and parish bounds
  if(!G.land)return;
  const id=g.getImageData(0,0,S,S),d=id.data,px=SIZE/S,F=G.land.F,m=G.land.mask;
  const ink=(o,r,gg,b,a)=>{d[o]=d[o]*(1-a)+r*a;d[o+1]=d[o+1]*(1-a)+gg*a;d[o+2]=d[o+2]*(1-a)+b*a;};
  const near2=(x,z)=>{const fx=(x+SIZE/2)/FG,fz=(z+SIZE/2)/FG,ci=Math.floor(fx),cj=Math.floor(fz);let a=null,b=null,da=1e9,db=1e9,pa,pb;
    for(let j=cj-1;j<=cj+1;j++)for(let i=ci-1;i<=ci+1;i++){const f=F[clamp(j,0,FN-1)*FN+clamp(i,0,FN-1)],sx=i+0.15+0.7*f.jx,sz=j+0.15+0.7*f.jz,dd=(fx-sx)**2+(fz-sz)**2;
      if(dd<da){db=da;b=a;pb=pa;da=dd;a=f;pa=[sx,sz];}else if(dd<db){db=dd;b=f;pb=[sx,sz];}}
    const nx=pb[0]-pa[0],nz=pb[1]-pa[1],L=Math.hypot(nx,nz)||1;
    return[a,b,Math.abs((fx-(pa[0]+pb[0])/2)*nx/L+(fz-(pa[1]+pb[1])/2)*nz/L)*FG];};
  for(let yy=0;yy<S;yy++)for(let xx=0;xx<S;xx++){
    const x=(xx+0.5)*px-SIZE/2,z=(yy+0.5)*px-SIZE/2,[f,f2,eb]=near2(x,z),o=(yy*S+xx)*4,c=cIdx(toCell(x),toCell(z));
    if(f.lord!==f2.lord&&f.lord>=0&&eb<px*1.6){const hc=lordColor(f.lord);ink(o,hc>>16&255,hc>>8&255,hc&255,0.85);continue;} // the lord's bound, in his colours
    if(f.held&&((xx+yy)%7)<2){const hc=lordColor(f.lord);ink(o,hc>>16&255,hc>>8&255,hc&255,0.5);} // held by the sword
    if(f.dom!==f2.dom&&eb<px*0.8&&(f.dom>=0||f2.dom>=0)&&((xx+yy)>>1)%3!==0){ink(o,122,52,38,0.55);continue;} // the parish bound, dotted
    if(f.kind===LK.NONE||f.state<LS.TILLED||(f.kind===LK.VINE?!m[c*4+1]:!m[c*4])||m[c*4+2])continue;
    if(eb<px*0.7&&f2!==f){ink(o,90,96,60,0.5);continue;} // hedge or headland
    if(f.state===LS.PASTURE||f.state===LS.SCRUB){ink(o,150,170,110,0.28);continue;}
    if(f.state===LS.BURNT){ink(o,70,50,40,0.45);continue;}
    if(f.kind===LK.MEADOW){ink(o,140,175,110,0.35);continue;}
    if(f.kind===LK.VINE){ink(o,120,70,110,((xx+yy*3)%4===0)?0.6:0.12);continue;}
    const w=f.w||30,t=(x*-Math.sin(f.th)+z*Math.cos(f.th))/(w*2),fr=t-Math.floor(t);
    ink(o,196,170,112,0.2);if(fr*w*2<px*0.9)ink(o,120,96,60,0.45); // every other strip ruled
  }
  g.putImageData(id,0,0);
}
function buildMapCanvas(){
  const S=1000,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),px=S/GRID;
  const mx=(x)=>(x+SIZE/2)/SIZE*S,mz=(z)=>(z+SIZE/2)/SIZE*S;
  const rng=layoutRng(777),rr=()=>rng();
  /* parchment with a little foxing */
  g.fillStyle='#E9DCC3';g.fillRect(0,0,S,S);
  for(let i=0;i<2600;i++){g.fillStyle=`rgba(${120+rr()*40|0},${90+rr()*30|0},${50+rr()*20|0},${rr()*0.05})`;g.beginPath();g.arc(rr()*S,rr()*S,1+rr()*7,0,7);g.fill();}
  /* land tint + hill-shading, drawn per cell into a small image and scaled up smoothly */
  const img=document.createElement('canvas');img.width=img.height=GRID;const ig=img.getContext('2d'),id=ig.createImageData(GRID,GRID);
  const tint={[B.MARSH]:[169,181,143],[B.MEADOW]:[214,210,168],[B.FARM]:[222,210,160],[B.FOREST]:[176,190,146],[B.PINE]:[160,178,146],[B.ROCK]:[196,186,166],[B.SNOW]:[236,232,222]};
  for(let cz=0;cz<GRID;cz++)for(let cx=0;cx<GRID;cx++){
    const i=cIdx(cx,cz),o=i*4;
    if(W.water[i]===1){ // sea: paler near the shore
      let near=9;for(let r=1;r<=8&&near===9;r++)for(let d=-r;d<=r&&near===9;d++)for(const[a,b]of[[d,-r],[d,r],[-r,d],[r,d]])if(inB(cx+a,cz+b)&&!W.water[cIdx(cx+a,cz+b)]){near=r;break;}
      const t=clamp(near/8,0,1);id.data[o]=lerp(176,138,t);id.data[o+1]=lerp(198,166,t);id.data[o+2]=lerp(200,182,t);id.data[o+3]=255;continue;
    }
    const col=tint[W.biome[i]]||tint[B.MEADOW];
    const hx=W.h[cIdx(Math.max(0,cx-1),cz)]-W.h[cIdx(Math.min(GRID-1,cx+1),cz)],hz=W.h[cIdx(cx,Math.max(0,cz-1))]-W.h[cIdx(cx,Math.min(GRID-1,cz+1))];
    const sh=clamp(1+(hx+hz)*0.006,0.72,1.18); // light from the north-west
    id.data[o]=clamp(col[0]*sh,0,255);id.data[o+1]=clamp(col[1]*sh,0,255);id.data[o+2]=clamp(col[2]*sh*0.98,0,255);id.data[o+3]=255;

  /* coastline */
  g.strokeStyle='rgba(60,80,95,0.55)';g.lineWidth=1.2;
  for(let cz=1;cz<GRID-1;cz++)for(let cx=1;cx<GRID-1;cx++){
    const i=cIdx(cx,cz);if(W.water[i]!==1)continue;
    if(!W.water[cIdx(cx+1,cz)]){g.beginPath();g.moveTo((cx+0.5)*px,cz*px);g.lineTo((cx+0.5)*px,(cz+1)*px);g.stroke();}
    if(!W.water[cIdx(cx-1,cz)]){g.beginPath();g.moveTo((cx-0.5)*px,cz*px);g.lineTo((cx-0.5)*px,(cz+1)*px);g.stroke();}
    if(!W.water[cIdx(cx,cz+1)]){g.beginPath();g.moveTo(cx*px,(cz+0.5)*px);g.lineTo((cx+1)*px,(cz+0.5)*px);g.stroke();}
    if(!W.water[cIdx(cx,cz-1)]){g.beginPath();g.moveTo(cx*px,(cz-0.5)*px);g.lineTo((cx+1)*px,(cz-0.5)*px);g.stroke();}

    const gr=g.createRadialGradient(mx(s.pos.x),mz(s.pos.z),R*0.2,mx(s.pos.x),mz(s.pos.z),R);
    gr.addColorStop(0,col+'33');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.beginPath();g.arc(mx(s.pos.x),mz(s.pos.z),R,0,7);g.fill();

    if(W.water[i])continue;

      g.fillStyle='#e8dcc2';g.beginPath();g.moveTo(x-w,y+2);g.lineTo(x,y-h);g.lineTo(x+w,y+2);g.closePath();g.fill();
      g.fillStyle='rgba(90,70,50,0.35)';g.beginPath();g.moveTo(x,y-h);g.lineTo(x+w,y+2);g.lineTo(x+w*0.15,y+2);g.closePath();g.fill();

   PER-FRAME WORLD ANIMATION
   ========================================================================= */
function polyPos(poly,f){
  if(!poly||!poly.length)return null;
  if(poly.length===1)return{x:poly[0].x,z:poly[0].z};
  f=clamp(f,0,1);
  const total=poly._len||(poly._len=poly.reduce((t,p,i)=>i?t+dist2d(poly[i-1].x,poly[i-1].z,p.x,p.z):0,0));
  let want=f*total,acc=0;
  for(let i=1;i<poly.length;i++){
    const seg=dist2d(poly[i-1].x,poly[i-1].z,poly[i].x,poly[i].z);
    if(acc+seg>=want){
      const t=seg>0?(want-acc)/seg:0;
      return{x:lerp(poly[i-1].x,poly[i].x,t),z:lerp(poly[i-1].z,poly[i].z,t),
        y:poly[i].y!==undefined?lerp(poly[i-1].y??poly[i].y,poly[i].y,t):undefined,
        dir:Math.atan2(poly[i].z-poly[i-1].z,poly[i].x-poly[i-1].x)};
    }
    acc+=seg;
  }
  const last=poly[poly.length-1];
  return{x:last.x,z:last.z,y:last.y};
}

      G.cartCovers.setColorAt(ci,C1.setHex(CARGOCOL[c.good]||0xe6d8a8));ci++;
    }
    if(showDots&&dotI<G.caravanDots.length){
      const sp=G.caravanDots[dotI++];
      sp.visible=true;sp.position.set(p.x,y+14,p.z);
      const ds=clamp(camera.position.distanceTo(sp.position)*0.01,8,40);
      sp.scale.set(ds,ds,1);
    }
  }
  G.caravans.count=G.cartCovers.count=ci;
  G.caravans.instanceMatrix.needsUpdate=true;G.cartCovers.instanceMatrix.needsUpdate=true;if(G.cartCovers.instanceColor)G.cartCovers.instanceColor.needsUpdate=true;
  for(let i=cogI;i<G.cogs.length;i++)G.cogs[i].visible=false;
  for(let i=bargeI;i<G.barges.length;i++)G.barges[i].visible=false;
  for(let i=dotI;i<G.caravanDots.length;i++)G.caravanDots[i].visible=false;
  G.caravans.instanceMatrix.needsUpdate=true;
  /* --- envoys --- */
  {const E=W.envoys||[],now=W.clock.day;G.envoyMeshes=G.envoyMeshes||new Map();
    for(let i=E.length-1;i>=0;i--){const e=E[i];if(now>=e.back){const m=G.envoyMeshes.get(e.id);if(m){scene.remove(m);disposeTree(m);G.envoyMeshes.delete(e.id);}dropMarker(e);E.splice(i,1);}}
    for(const e of E){let m=G.envoyMeshes.get(e.id);
      if(!m){m=new THREE.Group();const H=W.houses[0],col=new THREE.Color(H.sigilHue[0]),gold=new THREE.Color(H.sigilHue[1]);
        for(const k of[-1.6,1.6]){const horse=new THREE.Mesh(new THREE.BoxGeometry(2.6,1.3,0.9),new THREE.MeshLambertMaterial({color:0x5a4030}));horse.position.set(k,1.5,0);m.add(horse);
          const rider=new THREE.Mesh(new THREE.BoxGeometry(0.7,1.5,0.7),new THREE.MeshLambertMaterial({color:col}));rider.position.set(k,2.9,0);m.add(rider);}
        const pole=new THREE.Mesh(new THREE.BoxGeometry(0.15,4,0.15),new THREE.MeshLambertMaterial({color:0x3a2c20}));pole.position.set(1.6,4.5,0);m.add(pole);
        const pen=new THREE.Mesh(new THREE.PlaneGeometry(1.8,1),new THREE.MeshBasicMaterial({color:gold,side:THREE.DoubleSide}));pen.position.set(2.5,6,0);m.add(pen);
        m.userData.pick={type:'envoy',e};scene.add(m);G.envoyMeshes.set(e.id,m);}
      const p=envoyPos(e,now);if(!p)continue;const y=surfY(p.x,p.z),us=clamp(cam.cur.dist*0.004,1,6);
      m.position.set(p.x,y,p.z);m.rotation.y=-(p.dir||0)+(now>=e.decide?Math.PI:0);m.scale.setScalar(us);
      placeMarker(e,houseMarker(0),p.x,y,p.z,20);}
  }
  /* --- armies --- */
  let si2=0;
  for(const a of W.armies){
    let p;
    if(a.state==='march'||a.state==='rout'){
      const f=(simDay-a.departDay)/Math.max(0.01,a.arriveDay-a.departDay);
      p=polyPos(a.poly,f);
    }else if(a.state==='battle'&&a.battlePos){ // fight where the hosts met, not back at their muster town
      const off=a.side==='crown'?-14:14;
      p={x:a.battlePos.x+off,z:a.battlePos.z+off*0.5,dir:a.side==='crown'?0.46:Math.PI+0.46};
    }
    if(!p){const s=W.settlements[a.at];p={x:s.pos.x+(a.state==='siege'?90:20),z:s.pos.z+40,dir:0};}
    const y=surfY(p.x,p.z);
    a._rpos={x:p.x,y:y+10,z:p.z};
    placeMarker(a,houseMarker(a.house),p.x,y,p.z,a.standing?26:32);
    if(a.flag){
      const fs=clamp(cam.cur.dist*0.0019,0.45,4.5); // a real banner up close, a legible marker from on high
      a.flag.position.set(p.x+Math.cos(p.dir||0)*2,y+19*fs+Math.sin(now*2+a.id)*0.2*fs,p.z+Math.sin(p.dir||0)*2);
      a.flag.quaternion.copy(camera.quaternion); // true billboard; Euler .y alone skews at most angles
      a.flag.scale.setScalar(fs);
    }
    // soldiers when near: ranks in the house's colours; scaled up with distance so a host still reads
    const dcam=dist2d(camera.position.x,camera.position.z,p.x,p.z);
    if(dcam<2600){
      const H=W.houses[a.house],us=clamp(cam.cur.dist*0.0055,1.2,7);
      const cT=new THREE.Color(H.sigilHue[0]),cS=new THREE.Color(H.sigilHue[1]),hsl={};
      cT.getHSL(hsl);cT.setHSL(hsl.h,Math.max(hsl.s,0.45),Math.max(hsl.l,0.5)); // even a sable livery must read at a glance
      const n=Math.min(160,Math.max(12,Math.round(a.strength/3))),per=n>60?14:10;
      const dir=p.dir||0,fx=Math.cos(dir),fz=Math.sin(dir),lx=-fz,lz=fx;
      for(let k=0;k<n&&si2<1500;k++){
        const col=k%per-(per-1)/2,row=Math.floor(k/per);
        let sx=p.x+(fx*(-row*1.9)+lx*col*1.3)*us,sz=p.z+(fz*(-row*1.9)+lz*col*1.3)*us;
        if(a.state==='battle'){sx+=Math.sin(now*7+k*3)*0.9*us;sz+=Math.cos(now*6+k*5)*0.9*us;}
        else if(a.state==='siege'||a.state==='idle'){sx+=Math.sin(k*12.9)*0.5;sz+=Math.cos(k*7.3)*0.5;}
        const bob=a.state==='march'||a.state==='rout'?Math.abs(Math.sin(now*8+k))*0.12*us:0;
        const yy=surfY(sx,sz)+bob,ry=-dir+Math.PI/2+(a.state==='rout'?Math.PI:0);
        setInst(G.soldiers,si2,sx,yy,sz,ry,us,us,us);setInst(G.soldierShields,si2,sx,yy,sz,ry,us,us,us);setInst(G.soldierKit,si2,sx,yy,sz,ry,us,us,us);
        G.soldiers.setColorAt(si2,cT);G.soldierShields.setColorAt(si2,cS);
        si2++;
      }
    }
  }
  for(const m of[G.soldiers,G.soldierShields,G.soldierKit]){m.count=si2;m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;}
  for(const [camp,g] of G.campMeshes)placeMarker(camp,markerTex('camp',g2=>{badge(g2,'#3a2e28','#c0392b');g2.fillStyle='#e8dcc2';g2.font='bold 30px serif';g2.textAlign='center';g2.fillText('⚔',32,43);}),camp.x,hAt(camp.x,camp.z),camp.z,22);
  if(W.dragon&&!W.dragon.dead&&G.dragonMesh){const dm=G.dragonMesh,vis=dm.visible;
    placeMarker(W.dragon,markerTex('dragon',g2=>{badge(g2,'#7a1f1f','#e8c247');g2.font='32px serif';g2.textAlign='center';g2.fillText('🐉',32,44);}),vis?dm.position.x:W.dragon.lair.x,(vis?dm.position.y:W.dragon.lair.y)-20,vis?dm.position.z:W.dragon.lair.z,vis?30:20);}
  else if(W.dragon)dropMarker(W.dragon);
  /* --- dragon --- */
  const d=W.dragon;
  const dsc=clamp(cam.cur.dist*0.0011,1,3);G.dragonMesh.scale.setScalar(dsc);
  if(d&&!d.dead){
    if(d.state==='raiding'||d.state==='returning'){
      const f=clamp((simDay-d.departDay)/Math.max(0.01,d.arriveDay-d.departDay),0,1);
      const p=polyPos(d.path,f);
      if(p){
        G.dragonMesh.visible=true;
        const py=(p.y!==undefined?p.y:400)+Math.sin(now*1.5)*3;
        G.dragonMesh.position.set(p.x,py,p.z);
        G.dragonMesh.rotation.set(Math.sin(now*6)*0.04,-(p.dir||0)+Math.PI/2,Math.sin(now*0.7)*0.12);
        d._rpos={x:p.x,y:py,z:p.z};
        const flap=Math.sin(now*4.5)*0.75;
        G.dragonWings[0].rotation.z=flap;G.dragonWings[1].rotation.z=-flap;
        if(d.state==='raiding'&&f>0.78&&Math.random()<dt*40){ // fire from the jaws as it stoops on the town
          const m=G.dragonMesh.localToWorld(new THREE.Vector3(0,2.5,13+Math.random()*6));
          spawnFlame(m.x,m.y-Math.random()*20,m.z);
        }
      }
    }else if(d.state==='sleeping'&&cam.cur.dist<3000&&dist2d(camera.position.x,camera.position.z,d.lair.x,d.lair.z)<2200){
      G.dragonMesh.visible=true;
      G.dragonMesh.position.set(d.lair.x,d.lair.y+2.5,d.lair.z);G.dragonMesh.rotation.set(0,0.6,0);
      d._rpos={x:d.lair.x,y:d.lair.y+6,z:d.lair.z};
      G.dragonWings[0].rotation.z=-0.9;G.dragonWings[1].rotation.z=0.9; // wings folded along the flanks
      if(Math.random()<dt*0.6)spawnSmoke(d.lair.x,d.lair.y+6,d.lair.z+12,true); // it breathes in its sleep
    }else G.dragonMesh.visible=false;
  }else if(G.dragonMesh)G.dragonMesh.visible=false;
  /* --- townsfolk walking the streets --- */
  {
    let nearest=null,nd=1e18;
    for(const s of W.settlements){const dd=dist2d(cam.cur.focus.x,cam.cur.focus.z,s.pos.x,s.pos.z);if(dd<nd){nd=dd;nearest=s;}}
    if(nearest&&cam.cur.dist<260&&nd<(nearest.extentR||nearest.radius)+120){
      if(G.citList.length===0||G.citList[0].s!==nearest){
        G.citList=[];
        const sts=(nearest.streets||[]).filter(t=>!t.hidden&&t.kind!=='edge'&&t.pts.length>1);
        const pal=[0x7a3b2e,0x3e5a7a,0x5b6b3a,0x8a7a5a,0x6b4a6e,0xa88b4a,0x4a4a4a,0x9a5a3a,0xb8ae98];
        const n=Math.min(140,Math.round(nearest.pop/8)+12);
        for(let i=0;i<n&&sts.length;i++){
          // most folk are near the heart of town, on the market and the high streets
          let st=sts[Math.floor(Math.random()*sts.length)];
          for(let t=0;t<3;t++){const o=sts[Math.floor(Math.random()*sts.length)];if(dist2d(o.pts[0].x,o.pts[0].z,nearest.pos.x,nearest.pos.z)<dist2d(st.pts[0].x,st.pts[0].z,nearest.pos.x,nearest.pos.z))st=o;}
          const L=polyLen(st.pts);if(L<5)continue;
          G.citList.push({s:nearest,st,L,t:Math.random()*L,v:(0.9+Math.random()*0.7)*(Math.random()<0.5?1:-1),off:(Math.random()-0.5)*st.hw*1.5,
            col:new THREE.Color(pal[Math.floor(Math.random()*pal.length)]).multiplyScalar(0.85+Math.random()*0.3),pause:0});
        }
      }
      let k=0;
      for(const c of G.citList){
        const vt=dt*visPace();
        if(c.pause>0)c.pause-=vt;else{c.t+=c.v*vt;if(Math.random()<vt*0.05)c.pause=1+Math.random()*4;}
        if(c.v*vt>c.L){c.t=Math.random()*c.L;} // at the fast settings a whole street's worth of walking passes in a frame
        if(c.t<0||c.t>c.L){c.v=-c.v;c.t=clamp(c.t,0,c.L);}
        const p=polyPos(c.st.pts,c.t/c.L);if(!p)continue;
        const dir=p.dir||0,x=p.x-Math.sin(dir)*c.off,z=p.z+Math.cos(dir)*c.off;
        const bob=c.pause>0||!vt?0:Math.abs(Math.sin(now*7+k*2))*0.06;
        const ry=-dir+(c.v>0?Math.PI/2:-Math.PI/2);
        const yz=surfY(x,z)+0.28+bob;setInst(G.citizens,k,x,yz,z,ry,1,1,1);setInst(G.citKit,k,x,yz,z,ry,1,1,1);
        G.citizens.setColorAt(k,c.col);k++;
      }
      G.citizens.count=G.citKit.count=k;
      G.citizens.instanceMatrix.needsUpdate=true;G.citKit.instanceMatrix.needsUpdate=true;if(G.citizens.instanceColor)G.citizens.instanceColor.needsUpdate=true;
    }else if(G.citList.length){G.citList=[];G.citizens.count=G.citKit.count=0;}
  }
  /* --- birds --- */
  for(const b of G.birds){
    const u=b.userData;u.a+=dt*u.sp;
    const bx=u.c.x+Math.cos(u.a)*u.r,bz=u.c.z+Math.sin(u.a)*u.r;
    b.position.set(bx,Math.max(hAt(bx,bz)+40,u.c.y?u.c.y+u.h:u.h+hAt(bx,bz)),bz);
    b.rotation.y=-u.a;
  }
  /* --- labels: fade by distance --- */
  for(const sp of G.labels){
    const dd=camera.position.distanceTo(sp.position);
    const vis=G.labelsOn&&cam.cur.dist>240;
    sp.visible=vis;
    if(vis){
      const sc=clamp(dd*0.0011,0.45,3.4);
      sp.scale.set(sp.userData.w*0.42*sc,sp.userData.h*0.42*sc,1);
      sp.material.opacity=clamp((dd-180)/300,0,1);
    }
  }
  for(const bn of G.banners)bn.rotation.y=Math.sin(now*0.8)*0.3+camera.rotation.y*0.2;
}

/* =========================================================================
   MAIN LOOP & BOOT
   ========================================================================= */
let simAccum=0,lastT=0,hudT=0,overlayT=0,uiT=0,errN=0,errT=0;
function simErr(e){errN++;if(performance.now()-errT>5000){errT=performance.now();console.error('annals: error caught ('+errN+' so far)',e);}} // one bad tick must not freeze the realm
function animate(t){
  requestAnimationFrame(animate);
  const now=t/1000;
  let dt=Math.min(0.1,now-lastT||0.016);lastT=now;
  // advance simulation
  if(!Number.isFinite(simAccum))simAccum=0;
  simAccum+=dt*(SPEEDS[speedIdx]||0);
  let ticks=0;const tb=performance.now();
  while(simAccum>=1&&(ticks<1||performance.now()-tb<28)){ // time-budgeted, so the fastest speed runs as fast as the machine allows
    if(speedIdx===0){simAccum=0;break;} // a petition paused the realm mid-frame: stop here, not a dozen days on
    simAccum-=1;try{simTick();}catch(e){simErr(e);}ticks++;}
  const cap=Math.max(45,(SPEEDS[speedIdx]||0)*0.25);if(simAccum>cap)simAccum=cap; // don't spiral if a frame stalls
  W.clock.frac=W.clock.frac||0;
  if(SPEEDS[speedIdx]>0)W.clock.frac=simAccum; // 0..1 within the current day
  // cinematic sun: a full day/night cycle every ~150 real seconds while running,
  // decoupled from sim speed so high speeds don't strobe the lighting
  if(SPEEDS[speedIdx]>0)W.visT=(W.visT||0.38)+dt/150;
  const displayDay=W.clock.day+clamp(W.clock.frac,0,0.999);
  const saveDay=W.clock.day;W.clock.day=Number.isFinite(displayDay)?displayDay:saveDay;
  try{director.update(perfNow(),dt);updateCamera(dt,now);animateWorld(dt,now);}
  catch(e){simErr(e);}
  finally{W.clock.day=saveDay;} // an error mid-frame must not leave the calendar on a fractional (or worse) day
  if(G.detDirty&&now-(G.detT||0)>Math.max(0.5,(G.detMs||0)*0.015)){const t0=performance.now();G.detT=now;rebuildDetails();G.detMs=performance.now()-t0;} // the costlier the rebuild, the rarer
  featFlush(now);
  if(G.ordersDirty)refreshOrders();
  if(G.orders)for(const m of G.orders.children)m.material.opacity=0.35+0.25*Math.sin(now*3); // an order in hand pulses gently
  if(G.roadsDirty&&now-(G.roadT||0)>2){G.roadT=now;G.roadsDirty=false;rebuildRoadMesh();} // chimneys & spires follow fire and rebuilding
  hudT-=dt;
  if(hudT<=0){hudT=0.5;updateHUD();refreshInspect();renderPetition();
    if((uiT=(uiT+1)%2)===0)refreshCrownPanel();}
  overlayT-=dt;
  if(overlayT<=0){overlayT=6;if(overlayMode)refreshOverlay();}
  renderer.render(scene,camera);
}
async function boot(){
  const cm=location.hash.match(/c=(sea|land)/);COAST_PREF=cm?cm[1]:null;
  const ym=location.hash.match(/y=(\d{3,4})/),em=location.hash.match(/e=(dark|high)/);
  START_AD=clamp(ym?+ym[1]:em&&em[1]==='high'?1250:850,850,1500);
  const m=location.hash.match(/s=(\d+)/);
  const seed=m?parseInt(m[1],10)>>>0:Math.floor(Math.random()*1e9);
  if(!m)history.replaceState(null,'','#s='+seed+(ym?'&y='+ym[1]:em?'&e='+em[1]:'')+(cm?'&c='+cm[1]:''));
  const line=document.getElementById('loadline'),bar=document.querySelector('#loadbar>div');
  const progress=(txt,f)=>{line.textContent=txt;bar.style.width=Math.round(f*100)+'%';
    return new Promise(r=>setTimeout(r,30));};
  await progress('Forging the realm…',0.02);
  await generateWorld(seed,progress);
  // 3D labels are baked to canvases once: wait (briefly) for the manuscript face so they don't bake in the fallback
  try{if(document.fonts)await Promise.race([document.fonts.load('24px "IM Fell English"'),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  initGraphics();
  buildTerrain();buildFields();lastSeasonKey='';updateTerrainColors(0,0);buildTrees();buildBuildings();buildLabels();buildAgents();buildParticles();buildFx();buildDynamic();
  simInit();
  if(START_AD>W.startAD){ // the same history, run forward unseen to the year play begins
    W.prehistory=true;const yrs=START_AD-W.startAD;
    for(let y=0;y<yrs;y++){for(let i=0;i<360;i++)simTick();
      if(y%3===0)await progress(`The centuries pass… AD ${AD()} — ${W.settlements.length} places, ${Math.round(W.settlements.reduce((t,s)=>t+s.pop,0)).toLocaleString()} souls`,0.97*(y/yrs));}
    W.prehistory=false;rebuildRoadMesh();rebuildDetails();rebuildWalls();lastSeasonKey='';
    for(const s of W.settlements)s.pop0=s.pop;
  }
  initUI();initInput();
  // opening entries
  allLines.push('THE ANNALS OF '+W.name.toUpperCase());
  const m0=W.monarch;
  reignHeader(m0);
  emit('crown',4,W.capital.pos,`Here begin the annals of the realm of ${W.name}, set down faithfully by the chroniclers of ${W.capital.name}.`);
  emit('crown',3,W.capital.pos,`${fullTitle(m0)}, ${m0.traits.join(' and ')}, holds the throne at ${W.capital.name}. ${W.settlements.length-1} towns and villages owe fealty, and the five great houses keep their seats.`);
  // camera opening: establish over capital
  cam.focus.set(W.capital.pos.x,W.capital.pos.y,W.capital.pos.z);
  cam.cur.focus.copy(cam.focus);
  cam.dist=3200;cam.cur.dist=4200;cam.yaw=rand('sim')*Math.PI*2;cam.cur.yaw=cam.yaw-0.4;
  cam.mode='director';
  document.getElementById('loading').style.opacity='0';
  setTimeout(()=>document.getElementById('loading').remove(),900);
  {const hm=location.hash.match(/[#&]h=(\d+)/);if(hm)setTimeout(()=>setSovereign(true,+hm[1]),1000);} // #…&h=2: begin as that house (0 the crown)
  requestAnimationFrame(animate);
}
boot();
</script>
