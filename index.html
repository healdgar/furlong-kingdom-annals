<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Annals</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap');
:root{
  --parch:#E9DCC3; --parch2:#DFCFAF; --ink:#2B2320; --ink2:#4a3f36;
  --gold:#C9A227; --red:#8a2f22; --edge:#b7a482;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#101318;}
body{font-family:'Segoe UI',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);}
#gl{position:absolute;inset:0;}
#gl canvas{touch-action:none;} /* our own orbit/pinch handlers, not the browser's scroll/zoom */
canvas{display:block;}
.serif{font-family:'IM Fell English',Georgia,'Times New Roman',serif;}

/* ---------- loading ---------- */
#loading{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1d2430 0%,#0c0f14 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:var(--parch);
  transition:opacity .8s;}
#loading h1{font-family:'IM Fell English',Georgia,serif;font-size:42px;letter-spacing:2px;margin-bottom:14px;color:var(--gold);}
#loadline{font-family:'IM Fell English',Georgia,serif;font-size:18px;font-style:italic;opacity:.85;min-height:26px;}
#loadbar{width:280px;height:3px;background:#2b3242;margin-top:18px;border-radius:2px;overflow:hidden;}
#loadbar>div{height:100%;width:0;background:var(--gold);transition:width .2s;}

/* ---------- HUD top ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
  padding:6px 12px;z-index:20;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,16,12,.72),rgba(20,16,12,0));}
#hud .chip{display:flex;align-items:center;gap:6px;color:var(--parch);font-size:13px;
  text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap;}
#hud .chip b{color:var(--gold);font-weight:600;}
#hud img.sig{width:18px;height:18px;border-radius:3px;border:1px solid rgba(233,220,195,.4);}
#datechip{font-family:'IM Fell English',Georgia,serif;font-size:16px !important;}
#timec{margin-left:auto;pointer-events:auto;display:flex;gap:4px;}
#rulebtn{pointer-events:auto;background:rgba(201,162,39,.18);border:1px solid var(--gold);color:var(--gold);height:26px;padding:0 10px;
  border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;}
#rulebtn:hover{background:rgba(201,162,39,.32);}
body.sov #rulebtn{background:var(--gold);color:#241d10;}
#rulebtn .pc{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:8px;background:var(--red);color:var(--parch);font-size:11px;}
#legacychip{display:none !important;}
body.sov #legacychip{display:flex !important;}
#timec button{background:rgba(233,220,195,.12);border:1px solid rgba(233,220,195,.35);color:var(--parch);
  min-width:34px;height:26px;border-radius:4px;cursor:pointer;font-size:12px;}
#timec button.on{background:var(--gold);color:#241d10;border-color:var(--gold);font-weight:700;}
#timec button:hover{border-color:var(--gold);}

/* ---------- Chronicle ---------- */
#chron{position:absolute;top:44px;right:10px;bottom:10px;width:340px;z-index:15;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--parch),var(--parch2));border:1px solid var(--edge);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);overflow:hidden;}
#chron header{padding:8px 12px 4px;border-bottom:1px solid var(--edge);}
#chron header{display:flex;align-items:center;gap:6px;cursor:pointer;}
#chron h2{font-family:'IM Fell English',Georgia,serif;font-size:19px;font-weight:normal;color:var(--ink);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#chronmin{background:none;border:none;color:var(--ink2);font-size:14px;cursor:pointer;padding:0 2px;}
#chron.min{bottom:auto;}
#chron.min #chronfilters,#chron.min #chronlist,#chron.min #chronfoot{display:none;}
#chronfilters{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--edge);flex-wrap:wrap;}
#chronfilters .f{font-size:11px;padding:2px 9px;border-radius:10px;border:1px solid var(--edge);cursor:pointer;color:var(--ink2);background:transparent;}
#chronfilters .f.on{background:var(--ink);color:var(--parch);border-color:var(--ink);}
#chronlist{flex:1;overflow-y:auto;padding:6px 10px;scrollbar-width:thin;}
#chronlist::-webkit-scrollbar{width:6px}#chronlist::-webkit-scrollbar-thumb{background:var(--edge);border-radius:3px}
.centry{font-family:'IM Fell English',Georgia,serif;font-size:14px;line-height:1.35;padding:5px 4px;cursor:pointer;
  border-bottom:1px dotted rgba(74,63,54,.25);}
.centry:hover{background:rgba(201,162,39,.15);}
.centry .cd{color:var(--red);font-size:12px;font-style:italic;margin-right:4px;}
.creign{font-family:'IM Fell English',Georgia,serif;text-align:center;font-size:15px;color:var(--red);
  padding:10px 6px 6px;font-style:italic;}
.creign:before,.creign:after{content:"❦";color:var(--gold);margin:0 8px;font-style:normal;}
#chronfoot{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--edge);}
#chronfoot button{flex:1;font-size:11px;padding:4px;background:transparent;border:1px solid var(--edge);border-radius:4px;cursor:pointer;color:var(--ink2);}
#chronfoot button:hover{border-color:var(--ink);color:var(--ink);}

/* ---------- Drawer ---------- */
#drawer{position:absolute;top:44px;left:10px;bottom:10px;width:270px;z-index:15;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--parch),var(--parch2));border:1px solid var(--edge);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);overflow:hidden;transition:transform .3s;}
#drawer.closed{transform:translateX(-262px);}
/* the toggle lives outside the drawer: #drawer clips its overflow, which used to hide it */
#drawertoggle{position:absolute;left:280px;top:52px;z-index:16;width:22px;height:44px;background:var(--parch);border:1px solid var(--edge);
  border-left:none;border-radius:0 5px 5px 0;cursor:pointer;color:var(--ink2);font-size:12px;transition:left .3s;}
body.drawerclosed #drawertoggle{left:18px;}
#dtabs{display:flex;border-bottom:1px solid var(--edge);}
#dtabs .t{flex:1;text-align:center;font-size:11.5px;padding:7px 0;cursor:pointer;color:var(--ink2);border-right:1px solid var(--edge);}
#dtabs .t:last-child{border-right:none;}
#dtabs .t.on{background:var(--ink);color:var(--parch);}
#dbody{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin;}
#dbody::-webkit-scrollbar{width:6px}#dbody::-webkit-scrollbar-thumb{background:var(--edge);border-radius:3px}
.slrow{margin-bottom:9px;}
.slrow label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:2px;}
.slrow label b{color:var(--ink);font-weight:600;}
.slrow input[type=range]{width:100%;accent-color:var(--gold);height:16px;}
.actbtn{display:block;width:100%;text-align:left;font-size:12.5px;padding:6px 9px;margin-bottom:5px;cursor:pointer;
  background:rgba(43,35,32,.06);border:1px solid var(--edge);border-radius:4px;color:var(--ink);}
.actbtn:hover{background:var(--gold);border-color:var(--gold);color:#241d10;}
.actbtn .tg{float:right;color:var(--red);font-weight:700;}
.ovbtn{display:block;width:100%;text-align:left;font-size:12.5px;padding:6px 9px;margin-bottom:5px;cursor:pointer;
  background:transparent;border:1px solid var(--edge);border-radius:4px;color:var(--ink);}
.ovbtn.on{background:var(--ink);color:var(--parch);border-color:var(--ink);}
.wrow{margin-bottom:8px;font-size:12px;}
.wrow input[type=text]{width:100%;padding:5px;border:1px solid var(--edge);border-radius:4px;background:rgba(255,255,255,.4);font-size:13px;color:var(--ink);}
.wbtn{width:100%;font-size:12.5px;padding:6px;margin-bottom:5px;cursor:pointer;background:rgba(43,35,32,.06);
  border:1px solid var(--edge);border-radius:4px;color:var(--ink);}
.wbtn:hover{border-color:var(--ink);}
.houserow{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px;}
.houserow img{width:22px;height:22px;border-radius:3px;border:1px solid var(--edge);}
.houserow .hbar{flex:1;height:5px;background:rgba(43,35,32,.15);border-radius:3px;overflow:hidden;}
.houserow .hbar>div{height:100%;background:var(--gold);}
.houserow.exiled .hname{text-decoration:line-through;opacity:.55;}
.dhead{font-family:'IM Fell English',Georgia,serif;font-size:14px;color:var(--red);margin:8px 0 6px;border-bottom:1px solid var(--edge);padding-bottom:2px;}
.succline{font-size:11.5px;color:var(--ink2);margin-bottom:3px;}
.succline.pk,.houserow.pk{cursor:pointer;}
.succline.pk:hover,.houserow.pk:hover .hname{text-decoration:underline;}
.note{font-size:11.5px;color:var(--ink2);font-style:italic;margin:4px 0 8px;line-height:1.35;}
.slrow input[type=range]:disabled{opacity:.4;}
/* ---------- crown (sovereign) panel ---------- */
.cstat{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:1px 0;}
.cstat b{color:var(--ink);font-weight:600;}
.cbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;font-size:12px;padding:5px 8px;margin-bottom:4px;
  cursor:pointer;background:rgba(43,35,32,.06);border:1px solid var(--edge);border-radius:4px;color:var(--ink);}
.cbtn:hover:not(:disabled){background:var(--gold);border-color:var(--gold);color:#241d10;}
.cbtn:disabled{opacity:.45;cursor:default;}
.cbtn .cost{font-size:11px;color:var(--red);white-space:nowrap;}
.cbtn small{display:block;font-size:10.5px;color:var(--ink2);margin-top:1px;}
.cbtn:hover:not(:disabled) .cost{color:#241d10;}
.chouse{border:1px solid var(--edge);border-radius:4px;padding:5px 6px;margin-bottom:6px;}
.chouse .houserow{margin-bottom:4px;}
.chouse .hb{display:flex;flex-wrap:wrap;gap:3px;}
.chouse .hb button{flex:1 1 45%;font-size:10.5px;padding:3px 4px;cursor:pointer;background:transparent;border:1px solid var(--edge);border-radius:3px;color:var(--ink);}
.chouse .hb button:hover:not(:disabled){background:var(--gold);border-color:var(--gold);}
.chouse .hb button:disabled{opacity:.4;cursor:default;}
.tag{font-size:10px;color:var(--red);font-style:italic;margin-left:3px;}
.amb{font-size:11.5px;color:var(--ink2);margin-bottom:2px;}
.amb.done{color:var(--ink);}
.amb.done:before{content:"✓ ";color:#3d6b2a;font-weight:700;}
.amb:not(.done):before{content:"○ ";}
.warbar{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--red),#d9c89b 50%,#3d6b2a);position:relative;margin:4px 0 6px;}
.warbar i{position:absolute;top:-3px;width:3px;height:13px;background:var(--ink);border-radius:1px;}

/* ---------- Inspector ---------- */
#insp{position:absolute;left:290px;bottom:14px;width:290px;z-index:16;display:none;
  background:linear-gradient(160deg,var(--parch),var(--parch2));border:1px solid var(--edge);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);padding:10px 12px;}
#insp h3{font-family:'IM Fell English',Georgia,serif;font-size:17px;font-weight:normal;display:flex;align-items:center;gap:8px;}
#insp h3 img{width:22px;height:22px;border-radius:3px;border:1px solid var(--edge);}
#insp .sub{font-size:11px;color:var(--red);font-style:italic;margin-bottom:6px;}
#insp .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--ink2);}
#insp .row b{color:var(--ink);font-weight:600;}
#insp .agline{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:12.5px;margin-top:6px;color:var(--ink);}
#inspx{position:absolute;top:6px;right:9px;cursor:pointer;color:var(--ink2);font-size:14px;background:none;border:none;}
#inspfollow{margin-top:7px;width:100%;font-size:11.5px;padding:4px;cursor:pointer;background:transparent;border:1px solid var(--edge);border-radius:4px;color:var(--ink2);}
#inspfollow:hover{border-color:var(--ink);color:var(--ink);}
#inspacts{margin-top:6px;}
#inspacts:empty{display:none;}
#inspacts .cbtn{font-size:11.5px;padding:4px 7px;}
body.drawerclosed #insp{left:30px;}

/* ---------- beat card ---------- */
#beat{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);max-width:620px;z-index:14;
  background:rgba(20,16,12,.78);border:1px solid rgba(201,162,39,.5);border-radius:6px;padding:9px 20px;
  color:var(--parch);text-align:center;display:none;pointer-events:none;}
#beat .bt{font-family:'IM Fell English',Georgia,serif;font-size:17px;line-height:1.3;}
#beat .bd{font-size:11px;color:var(--gold);font-style:italic;margin-top:2px;}

/* watch-mode date */
#watchdate{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:14;display:none;
  font-family:'IM Fell English',Georgia,serif;font-size:20px;color:var(--parch);text-shadow:0 1px 3px #000;pointer-events:none;}

#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:13;font-size:11px;
  color:rgba(233,220,195,.55);pointer-events:none;text-shadow:0 1px 2px #000;white-space:nowrap;}

body.hideui #hud,body.hideui #chron,body.hideui #drawer,body.hideui #insp,body.hideui #hint{display:none !important;}
body.watch #chron,body.watch #drawer,body.watch #insp,body.watch #hint,body.watch #hud{display:none !important;}
body.watch #watchdate{display:block;}
#uiback{position:absolute;top:10px;right:10px;z-index:40;display:none;background:rgba(20,16,12,.55);color:var(--parch);border:1px solid rgba(233,220,195,.35);
  border-radius:4px;padding:5px 10px;font-size:12px;cursor:pointer;}
body.watch #uiback,body.hideui #uiback{display:block;}
#placehint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:30;display:none;
  background:var(--red);color:var(--parch);padding:5px 16px;border-radius:4px;font-size:13px;white-space:nowrap;}
body.watch #drawertoggle,body.hideui #drawertoggle,body.watch #petition,body.hideui #petition{display:none !important;}
/* ---------- petitions: the court awaits a decision ---------- */
#petition{position:absolute;top:48px;left:50%;transform:translateX(-50%);width:min(460px,calc(100vw - 24px));z-index:25;display:none;
  background:linear-gradient(160deg,var(--parch),var(--parch2));border:2px solid var(--gold);border-radius:6px;
  box-shadow:0 10px 40px rgba(0,0,0,.6);padding:10px 14px 9px;}
#petition h4{font-family:'IM Fell English',Georgia,serif;font-size:18px;font-weight:normal;color:var(--red);margin-bottom:3px;display:flex;gap:8px;align-items:baseline;}
#petition h4 span{flex:1;}
#petition h4 a{font-family:system-ui,sans-serif;font-size:11px;color:var(--ink2);cursor:pointer;text-decoration:underline;}
#petition .pt{font-family:'IM Fell English',Georgia,serif;font-size:14px;line-height:1.35;color:var(--ink);margin-bottom:8px;}
#petition .pf{font-size:10.5px;color:var(--ink2);font-style:italic;margin-top:4px;}
/* ---------- narrow screens: panels stop overlapping ---------- */
@media (max-width:900px){
  #chron{width:280px;}
  #insp{width:min(290px,calc(100vw - 20px));}
  #hint{display:none;}
}
@media (max-width:760px){ /* HUD: chips wrap, then the time controls take their own row */
  #hud{flex-wrap:wrap;row-gap:3px;gap:8px;padding:4px 8px;}
  #hud .chip{font-size:12px;}
  #datechip{font-size:14px !important;}
  #timec{margin-left:0;width:100%;justify-content:flex-end;}
  #timec button{min-width:28px;}
  #chron{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:40vh;}
  #chron.min{bottom:10px;}
  #drawer{top:100px;width:min(270px,calc(100vw - 40px));}
  #drawertoggle{top:108px;left:min(280px,calc(100vw - 30px));}
  #insp,body.drawerclosed #insp{left:10px;bottom:auto;top:100px;}
  #beat{bottom:auto;top:100px;max-width:calc(100vw - 20px);}
  #petition{top:100px;}
  #placehint{white-space:normal;width:calc(100vw - 40px);text-align:center;}
}
</style>
</head>
<body>
<div id="gl"></div>
<div id="loading"><h1 id="loadtitle">ANNALS</h1><div id="loadline">Forging the realm…</div><div id="loadbar"><div></div></div></div>

<div id="hud">
  <span class="chip" id="datechip">—</span>
  <span class="chip" id="wxchip">☀</span>
  <span class="chip" id="crownchip"><img class="sig" id="crownsig" alt=""><b id="crownname">—</b></span>
  <span class="chip">⛁ <b id="treasury">0</b></span>
  <span class="chip">☺ <b id="realmpop">0</b></span>
  <span class="chip" id="legitchip" title="Legitimacy">♛ <b id="legit">0</b></span>
  <span class="chip" id="legacychip" title="Legacy of your dynasty">✦ <b id="legacy">0</b></span>
  <div id="timec">
    <button id="rulebtn" title="Rule the realm yourself: decrees, petitions, war orders">♛ Rule</button>
    <button data-s="0" title="Pause (Space)">⏸</button><button data-s="1">▶</button><button data-s="2" class="on">▶▶</button><button data-s="3">▶▶▶</button><button data-s="4">▶▶▶▶</button><button data-s="5" title="A year a second (5): reel through the ages">⏩</button>
  </div>
</div>
<div id="watchdate">—</div>

<div id="chron">
  <header id="chronhead"><h2 id="chrontitle">The Annals</h2><button id="chronmin" title="Collapse / expand">▾</button></header>
  <div id="chronfilters">
    <button class="f on" data-f="all">All</button>
    <button class="f" data-f="crown">Crown</button>
    <button class="f" data-f="war">War</button>
    <button class="f" data-f="trade">Trade</button>
    <button class="f" data-f="fates">Fates</button>
  </div>
  <div id="chronlist"></div>
  <div id="chronfoot">
    <button id="btnexport">Export chronicle</button>
    <button id="btnshare">Copy share link</button>
  </div>
</div>

<div id="drawer">
  <div id="dtabs">
    <div class="t" data-t="crown">Crown</div>
    <div class="t on" data-t="rates">Rates</div>
    <div class="t" data-t="acts">Acts</div>
    <div class="t" data-t="over">Overlays</div>
    <div class="t" data-t="world">Realm</div>
  </div>
  <div id="dbody"></div>
</div>
<button id="drawertoggle" title="Hide / show the panel">◂</button>

<div id="insp">
  <button id="inspx">✕</button>
  <h3 id="insptitle">—</h3>
  <div class="sub" id="inspsub"></div>
  <div id="inspbody"></div>
  <div id="inspacts"></div>
  <button id="inspfollow">Follow</button>
</div>

<div id="beat"><div class="bt" id="beattext"></div><div class="bd" id="beatdate"></div></div>
<button id="uiback" title="Show the controls again (Esc)">✕ controls</button>
<div id="placehint">Click the map to place — Esc to cancel</div>
<div id="petition"></div>
<div id="hint">drag pan · right-drag turn &amp; tilt · scroll zoom · click to inspect · Space pause · 1–4 speed · R rule · M map · C watch · H hide UI</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   ANNALS — a living kingdom in a single file
   Everything procedural. Seed in the URL hash is the whole save file.
   ========================================================================= */
'use strict';

/* ---------------- RNG: sfc32, separate streams for gen & history -------- */
function sfc32(a,b,c,d){return function(){a>>>=0;b>>>=0;c>>>=0;d>>>=0;let t=(a+b)|0;a=b^b>>>9;b=c+(c<<3)|0;c=(c<<21|c>>>11);d=d+1|0;t=t+d|0;c=c+t|0;return(t>>>0)/4294967296;};}
function seedStreams(seed){
  function mix(n){n=Math.imul(n^n>>>15,n|1);n^=n+Math.imul(n^n>>>7,n|61);return(n^n>>>14)>>>0;}
  const s=seed>>>0;
  return {
    gen: sfc32(mix(s),mix(s+0x9e37),mix(s+0x85eb),mix(s+0xc2b2)),
    sim: sfc32(mix(s+0x1b87),mix(s+0x27d4),mix(s+0x1656),mix(s+0x9c83))
  };
}
let SEED=1234567, RS=null, COAST_PREF=null; // null: as the seed falls; 'sea' or 'land' from the hash
const rand=(st)=>RS[st]();
const randi=(st,n)=>Math.floor(RS[st]()*n);
const pick=(st,arr)=>arr[Math.floor(RS[st]()*arr.length)];
const chance=(st,p)=>RS[st]()<p;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const dist2d=(ax,az,bx,bz)=>Math.hypot(ax-bx,az-bz);

/* ---------------- value noise + fBm ------------------------------------- */
function makeNoise(seed){
  const s=seed|0;
  function h(x,y){let n=(x|0)*374761393+(y|0)*668265263+s*1013904223;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return(n>>>0)/4294967296;}
  return function(x,y){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return h(xi,yi)*(1-u)*(1-v)+h(xi+1,yi)*u*(1-v)+h(xi,yi+1)*(1-u)*v+h(xi+1,yi+1)*u*v;
  };
}
function fbm(n2,x,y,oct,lac,gain){
  let a=.5,f=1,s=0,norm=0;
  for(let i=0;i<oct;i++){s+=a*n2(x*f,y*f);norm+=a;a*=gain;f*=lac;}
  return s/norm;
}

  const coastRoll=rand('gen')<0.42, coastEdge=randi('gen',4); // 0=N 1=E 2=S 3=W
  const coastal=COAST_PREF==='sea'?true:COAST_PREF==='land'?false:coastRoll; // the draw is always taken, so the rest of the world is the same seed either way
  const ca=Math.cos(spineA),sa=Math.sin(spineA);

    const u=cx/GRID-0.5,v=cz/GRID-0.5;
    const wx=fbm(n3,u*3+9,v*3,3,2,.5)-.5, wz=fbm(n3,u*3,v*3+7,3,2,.5)-.5; // domain warp

  /* --- hydrology: fill depressions, then flow accumulation, carve rivers --

function seaRoute(ai,bi){ // cogs keep to the water: a search over sea cells from harbour to harbour (they used to sail straight over the land)

      if(W.water[c]!==1)continue;let open=0;for(const[ex,ez]of[[1,0],[-1,0],[0,1],[0,-1]])if(inB(cx+ex,cz+ez)&&W.water[cIdx(cx+ex,cz+ez)]===1)open++;

    for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){if(!dx&&!dz)continue;const nx=cx+dx,nz=cz+dz;if(!inB(nx,nz))continue;const n=cIdx(nx,nz);

function roadCost(a,b){ // between neighboring cells

/* places (greens, market places) are irregular blobs: a radius per angle about a centre */
const PLN=20;

const ROLE_NAME={seat:'seat of the crown',fort:'fortress town',border:'border fortress',port:'port town',crossing:'bridge town',market:'market town',
  farm:'farming village',fishing:'fishing village',timber:'woodcutters’ village',mining:'mining village'};

/* ---------------- towns grown through time --------------------------------
   Not a plan but a history. The founders' nucleus depends on why the place
   exists — a crown tower on the rise, a landing on the shore, a hamlet at the
   ford, farms about a green where roads meet. Then ages of growth: houses
   ribbon out along the roads first; back lanes branch off where there is room,
   bend with the ground, stop at the water and at the wall, and join older
   streets, making irregular blocks. A wall is raised around the town of its
   age; later houses spill past the gates. When a city outgrows its wall a new
   one is built and the old line becomes a street, a few towers left standing.
   Institutions stay where they were founded and are rebuilt larger on the
   same ground; fires clear districts that are rebuilt in stone on straighter
   streets; sieges raze suburbs that grow back. Every town keeps its story. */
function layoutSettlement(s){
  const idx=W.settlements.indexOf(s),rng=layoutRng(idx),rr=()=>rng(),rpick=a=>a[Math.floor(rng()*a.length)];
  let isCap=s.kind==='capital',isTown=s.kind==='town',isVil=s.kind==='village';
  const role=s.role||(isCap?'seat':isTown?'market':'farm');s.role=role;
  const C=s.pos;let R0=isCap?440:isTown?310:170,Rmax=R0; // the reach of the built-up town; it widens as the town outgrows it
  const count=Math.min(isCap?Math.round(s.pop/4):Math.round(s.pop/4.2),isCap?620:isTown?280:48);
  const HW=isCap?3.4:isTown?3:2.4,RHW=isVil?3.2:4;
  riverStrips();
  const cellOK=(x,z)=>{const ci=toCell(x),cj=toCell(z),i=cIdx(ci,cj);return !W.water[i]&&slopeAt(ci,cj)<0.35&&W.h[i]>1;};
  const buildable=(x,z)=>cellOK(x,z)&&!riverAt(x,z,1)&&!lakeAt(s,x,z,2);
  s.streets=[];s.places=[];s.roadSpoke={};s.history=[];s.remnants=[];s.oldWalls=[];s.relicWalls=[];s.burns=[];
  s.wallRad=null;s.wallKind=null;s.natDef=0;s.plazaR=0;s.coreR=Rmax;s.radius=80;s.wallR=80;
  const segH=makeHash(24),placed=makeHash(16);
  let curE=0;
  const era=AD(),early=era<1000,motteAge=era<1070; // what the builders of this age know how to build
  const E=early?(isVil?2:3):isCap?6:isTown?5:3;
  const FRAC=early?(E===2?[0.5,1]:[0.3,0.65,1]):isCap?[0.06,0.16,0.32,0.52,0.76,1]:isTown?[0.1,0.26,0.5,0.76,1]:[0.4,0.75,1];
  const agoYears=e=>Math.round((E-e)*(isVil?70:55)/10)*10;
  let live=false;const hist=(e,t)=>s.history.push(live?{yr:year(),t}:{ago:agoYears(e),t}); // live entries are dated in the annals' own years
  const addSeg=(a,b,hw,st)=>{const o={a,b,hw,st,x:(a.x+b.x)/2,z:(a.z+b.z)/2};segH.add(o,dist2d(a.x,a.z,b.x,b.z)/2+hw+2);};

    if(kind!=='edge')for(let i=0;i<pts.length-1;i++)addSeg(pts[i],pts[i+1],hw,st);

  };
  const nearStreet=(x,z,pad,skip)=>{let best=null,bd=1e9;
    for(const g of segH.near(x,z,pad+8)){if(g.st===skip||g.st.gone)continue; /* a burned-out lane frees its ground *//* hidden (future) lanes stay reserved too */const d=segDist(x,z,g.a,g.b)-g.hw;if(d<pad&&d<bd){bd=d;best=g;}}return best;};
  const inPlace=(x,z,pad)=>s.places.some(p=>placeHit(p,x,z,pad));
  const wallSide=(x,z)=>s.wallRad?dist2d(x,z,C.x,C.z)-wallRadAt(s,Math.atan2(z-C.z,x-C.x)):-1e9;
  const probe=(f)=>{const c=obbCorners(f.x,f.z,f.w,f.d,f.rot),o=[...c,{x:f.x,z:f.z}];
    for(let i=0;i<4;i++)o.push({x:(c[i].x+c[(i+1)%4].x)/2,z:(c[i].z+c[(i+1)%4].z)/2});return o;};
  const fits=(f,gap,soft)=>{
    let inside=0,outside=0;

      if(s.wallRad){const wd=wallSide(c.x,c.z);if(Math.abs(wd)<7)return false;if(s.bastions&&wd>0&&wd<70)return false;if(wd<0)inside++;else outside++;}
      if(s.citadel&&dist2d(c.x,c.z,s.citadel.x,s.citadel.z)<s.citadel.S*0.85)return false;
      if(!soft&&s.bailey&&(dist2d(c.x,c.z,s.bailey.x,s.bailey.z)<s.bailey.r+4||dist2d(c.x,c.z,s.motte.x,s.motte.z)<s.motte.r+3))return false;
      for(const t of s.remnants)if(dist2d(c.x,c.z,t.x,t.z)<t.r+1)return false;
      for(const R of[s.hillCastle,s.burgRing])if(R&&Math.abs(dist2d(c.x,c.z,R.x,R.z)-R.r)<3.5)return false; // nothing astride a castle's curtain or the close wall

      const U=bst.pts[k-6],ul=dist2d(U.x,U.z,D.x,D.z)||1,base=Math.atan2((U.z-D.z)/ul,(U.x-D.x)/ul);

      const poly=[{x:D.x,z:D.z},...rad.map((r,i)=>{const a=base+(i/NR*2-1)*1.75;return{x:D.x+Math.cos(a)*r,z:D.z+Math.sin(a)*r};})];
      if(poly.some(q=>dist2d(q.x,q.z,C.x,C.z)<110)||inPoly(poly,C.x,C.z))continue;
      if(W.roads.some(rd=>rd.path.some(q=>inPoly(poly,q.x,q.z))))continue; // it would drown a highway

  }
  const roadTan=(st,i)=>{const a=st.pts[Math.max(0,i-1)],b=st.pts[Math.min(st.pts.length-1,i+1)];const L=dist2d(a.x,a.z,b.x,b.z)||1;return[(b.x-a.x)/L,(b.z-a.z)/L];};

  /* ---- the founders' nucleus ---- */
  const blob=(x,z,rx,rz,ang,noise)=>{const r=[];for(let k=0;k<PLN;k++){const a=k/PLN*Math.PI*2-ang;

  const placeOK=p=>{for(let k=0;k<PLN;k++){const a=k/PLN*Math.PI*2,x=p.x+Math.cos(a)*p.r[k],z=p.z+Math.sin(a)*p.r[k];if(!buildable(x,z))return false;}return true;};

    for(const off of[RHW+gr+2,RHW+gr+10,0]){

      if(placeOK(p)&&!nearStreet(p.x,p.z,gr*0.7)){addPlace(p,'green');break;}

    }
  }else if(mode==='grown'||mode==='roman'){ // the market place (or the old forum) where the roads meet
    const L=mode==='roman'?(isCap?26:20):isCap?30:22,Wd=mode==='roman'?L:isCap?15:11;
    for(const sc of[1,0.8,0.6]){const p=blob(C.x,C.z,L*sc,Wd*sc,rAng,mode==='roman'?0.1:0.3);if(placeOK(p)){addPlace(p,'market');break;}}
  }
  let plazaC=s.places.find(p=>p!==oldVil)||{x:C.x,z:C.z,r:new Array(PLN).fill(8)};
  const faceCentre=(x,z,cx,cz)=>{const m=Math.atan2(z-cz,x-cx);return -Math.atan2(Math.cos(m),-Math.sin(m));};

    }

  }
  if(!isVil&&!motteAge&&(role==='seat'||role==='fort')&&rr()<0.65){ // Freiburg's Schlossberg: the castle on the hill above the town

    for(let r=160;r<=460;r+=30)for(let a=0;a<32;a++){
      const ang=a/32*Math.PI*2,x=C.x+Math.cos(ang)*r,z=C.z+Math.sin(ang)*r,ci=toCell(x),cj=toCell(z);

    }
    if(best){
      const f={x:best.x,z:best.z,w:13,d:13,rot:rr()*Math.PI};
      if(probe(f).every(q=>cellOK(q.x,q.z))){
        s.hillCastle={x:best.x,z:best.z,r:34};

function terrNormal(x,z){const e=5,dx=hAt(x+e,z)-hAt(x-e,z),dz=hAt(x,z+e)-hAt(x,z-e),l=Math.hypot(dx,2*e,dz);return[-dx/l,2*e/l,-dz/l];}

function accMesh(acc,mat){

  g.setAttribute('normal',new THREE.Float32BufferAttribute(acc.n,3));

/* one connected strip along a polyline: shared vertices at every joint (the old per-segment quads

function strip(pts,acc,o){
  const n=pts.length;if(n<2)return;
  const fr=o.fr,m=fr.length,base=acc.p.length/3;
  for(let k=0;k<n;k++){
    const a=pts[Math.max(0,k-1)],b=pts[Math.min(n-1,k+1)];
    let tx=b.x-a.x,tz=b.z-a.z;const L=Math.hypot(tx,tz)||1;tx/=L;tz/=L;
    const hw=o.hw(k),yc=o.flatY?o.flatY(k):0;
    for(let j=0;j<m;j++){
      const x=pts[k].x-tz*hw*fr[j],z=pts[k].z+tx*hw*fr[j];
      acc.p.push(x,o.flatY?yc:hAt(x,z)+o.lift,z);
      const nn=o.flatY?[0,1,0]:terrNormal(x,z);acc.n.push(nn[0],nn[1],nn[2]);
      C1.setHex(o.col(k,j,x,z));acc.c.push(C1.r,C1.g,C1.b);
    }
  }
  for(let k=0;k<n-1;k++)for(let j=0;j<m-1;j++){
    const i0=base+k*m+j,i1=i0+1,i2=i0+m,i3=i2+1;
    acc.i.push(i0,i1,i2,i1,i3,i2);

function disc(acc,cx,cz,R,lift,colFn){ // draped polar grid (market squares)

    const rr=R*r/rings,a=k/sect*Math.PI*2,x=cx+Math.cos(a)*rr,z=cz+Math.sin(a)*rr;
    acc.p.push(x,hAt(x,z)+lift,z);const nn=terrNormal(x,z);acc.n.push(nn[0],nn[1],nn[2]);
    C1.setHex(colFn(r,k));acc.c.push(C1.r,C1.g,C1.b);
    if(r===0)break; // a single centre vertex
  }
  for(let r=0;r<rings;r++)for(let k=0;k<sect;k++){
    const k2=(k+1)%sect;
    const a=r===0?base:base+1+(r-1)*sect+k,b=r===0?base:base+1+(r-1)*sect+k2;
    const c=base+1+r*sect+k,d=base+1+r*sect+k2;

function placeMesh(acc,p,lift,colFn){ // an irregular place, draped like the streets
  const rings=6,base=acc.p.length/3;

  for(let r=1;r<=rings;r++)for(let k=0;k<PLN;k++){
    const a=k/PLN*Math.PI*2,rr=(p.r[k]+1)*r/rings,x=p.x+Math.cos(a)*rr,z=p.z+Math.sin(a)*rr;
    acc.p.push(x,hAt(x,z)+lift,z);nn=terrNormal(x,z);acc.n.push(nn[0],nn[1],nn[2]);C1.setHex(colFn(r,k));acc.c.push(C1.r,C1.g,C1.b);
  }
  for(let r=0;r<rings;r++)for(let k=0;k<PLN;k++){
    const k2=(k+1)%PLN,c=base+1+r*PLN+k,d=base+1+r*PLN+k2;

/* river strips are cached: roads need them to find where bridges go */

    {const lim=SIZE/2-4,cut=pts.findIndex(p=>Math.abs(p.x)>lim||Math.abs(p.z)>lim);if(cut>=0)pts=pts.slice(0,Math.max(2,cut));} // the river leaves the known world at its edge, not in mid-air beyond it
    if(pts.length<2)continue;

      ph=hash01(SEED%997+pts[0].x*0.013+pts[0].z*0.007)*6.28;
    const hw=hw0.map((_,k)=>{let t=0,n=0;for(let d=-5;d<=5;d++){const v=hw0[k+d];if(v!==undefined){t+=v;n++;}} // widening eases in below a confluence
      return t/n*(0.88+0.24*(0.5+0.5*Math.sin(k*0.045+ph)*Math.sin(k*0.017+ph*2)));}); // and reaches run broad or narrow

function keepToBank(P0){ // a road never meets a river at too shallow an angle: it bends gently to a steeper crossing, and keeps to the bank where it only runs alongside

  const wet=q=>riverAt(q.x,q.z,1);
  if(!P0.some(wet)&&!P0.some((q,k)=>k&&wet({x:(q.x+P0[k-1].x)/2,z:(q.z+P0[k-1].z)/2})))return P0;

  for(let k=0;k<P.length;){

    let j=k;while(j<P.length-1&&wet(P[j+1]))j++;
    if(j>=P.length-1){for(let m=k;m<P.length;m++)out.push(P[m]);break;}
    const a=P[k-1],b=P[j+1],w=wet(P[(k+j)>>1])||wet(P[k]),dx=w.b.x-w.a.x,dz=w.b.z-w.a.z,L=Math.hypot(dx,dz)||1,tx=dx/L,tz=dz/L;

    if(sa===sb){ // dipped into the stream and out again: along the bank
      for(let m=k;m<=j;m++){const q=P[m],u=(q.x-w.a.x)*tx+(q.z-w.a.z)*tz;out.push({x:w.a.x+tx*u+nx*sa*(w.hw+5),z:w.a.z+tz*u+nz*sa*(w.hw+5)});}

    for(const d of[-Lap,-(w.hw+4),w.hw+4,Lap])out.push({x:m.x+cx*d,z:m.z+cz*d,fix:1});

function riverAt(x,z,pad){ // the river segment under (x,z), if any

function rebuildRoadMesh(){ // king's roads, streets and market squares: one draped, vertex-coloured mesh; bridges where roads meet rivers

let lastSeasonKey='';
function updateTerrainColors(si,blend,amp){ // amp: how much of the season to show (fast-forward settles on a steady summer)
  amp=amp??1;
  if(!G.tvar){const nv=makeNoise(SEED^0x7A11);G.tvar=new Float32Array(GRID*GRID);
    for(let i=0;i<GRID*GRID;i++){const cx=i%GRID,cz=(i/GRID)|0;G.tvar[i]=clamp((fbm(nv,cx/26,cz/26,3,2,0.5)-0.5)*3,-1,1);}}
  const sp0=PAL.seasons[si],sp1=PAL.seasons[(si+1)%4],still=PAL.seasons[1];
  const snowT=(si===3?0.85:(si===0?Math.max(0,0.5-blend*2)*0.8:0))*amp;
  const aq=Math.round(amp*8)/8,key=aq<0.07?'still_'+(W.drought?1:0):si+'_'+(blend*8|0)+'_'+aq+'_'+(W.drought?1:0); // held steady, no recolouring at all
  if(key===lastSeasonKey)return;lastSeasonKey=key;
  const sp={};for(const k of['mead','farm','forest','pine','rock','marsh']){
    const c0=new THREE.Color(sp0[k]),c1=new THREE.Color(sp1[k]);sp[k]=new THREE.Color(still[k]).lerp(c0.lerp(c1,blend*blend),aq).getHex();
  }
  const col=G.terrain.geometry.attributes.color,N=col.count;
  if(!G._cbuf)G._cbuf=new Float32Array(N*3);
  const buf=G._cbuf;
  for(let i=0;i<N;i++){
    const c=colorForVertex(i,sp,snowT,SEED);
    buf[i*3]=c.r;buf[i*3+1]=c.g;buf[i*3+2]=c.b;
  }
  // gentle neighbor blend calms biome banding into painterly gradients
  for(let cz=0;cz<GRID;cz++)for(let cx=0;cx<GRID;cx++){
    const i=cIdx(cx,cz);
    let r=buf[i*3]*0.6,g=buf[i*3+1]*0.6,b=buf[i*3+2]*0.6,ws=0.6;
    for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){
      if(!inB(cx+dx,cz+dz))continue;
      const j=cIdx(cx+dx,cz+dz);

    }

  }
  // river cells: darker wet banks under the water strip (painting them blue made blocky diamonds;
  // roads are real meshes now, so the ground under them is left alone)
  const bankC=new THREE.Color(snowT>0.5?0x9aa39a:0x4d6a3c);
  for(let i=0;i<N;i++)if(W.water[i]===2){
    C1.setRGB(col.getX(i),col.getY(i),col.getZ(i)).lerp(bankC,0.55);col.setXYZ(i,C1.r,C1.g,C1.b);
  }
  recolorApron();
  col.needsUpdate=true;
  recolorFields(si,blend,snowT,aq);
  // trees seasonal tint
  if(G.decid){
    const tint=(summer,now)=>new THREE.Color(summer).lerp(new THREE.Color(now),aq); // fast-forward holds the summer leaf
    const dc=tint(0x4a6c2e,[0x40682f,0x4a6c2e,0x96541e,0x5e5344][si]);
    G.decid.material.color.copy(dc);
    G.pine.material.color.copy(tint(0x28472f,si===3?0x314a37:0x28472f));
    if(G.small)G.small.material.color.copy(tint(0x6d9444,[0x9cc46e,0x6d9444,0xc08a2e,0x7a6a58][si])); // fresh leaf in spring, gold in autumn
    if(G.regrow)G.regrow.material.color.copy(dc);
  }
}

function treeGeom(parts){ // [geometry, bark or leaf colour, 1 if crown]: the crown alone takes the season's tint
  const pos=[],nor=[],col=[],cr=[],c=new THREE.Color();
  for(const[g0,hex,crown]of parts){const g=g0.index?g0.toNonIndexed():g0;c.setHex(hex);
    const P=g.attributes.position,N=g.attributes.normal;
    for(let i=0;i<P.count;i++){pos.push(P.getX(i),P.getY(i),P.getZ(i));nor.push(N.getX(i),N.getY(i),N.getZ(i));
      const j=crown?0.9+hash01(i*3.1+pos.length)*0.2:1;col.push(c.r*j,c.g*j,c.b*j);cr.push(crown);}}
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('color',new THREE.Float32BufferAttribute(col,3));out.setAttribute('aCrown',new THREE.Float32BufferAttribute(cr,1));
  return out;
}
function crownMat(hex){ // the material colour is the leaf of the season, and it tints the crown only: bark stays bark
  const m=new THREE.MeshLambertMaterial({color:hex,vertexColors:true});
  m.onBeforeCompile=sh=>{
    sh.vertexShader='attribute float aCrown;\nvarying float vCrown;\n'+sh.vertexShader.replace('#include <begin_vertex>','#include <begin_vertex>\n  vCrown=aCrown;');
    sh.fragmentShader='varying float vCrown;\n'+sh.fragmentShader.replace('#include <color_fragment>','#include <color_fragment>\n  diffuseColor.rgb=mix(vColor.rgb,diffuseColor.rgb,vCrown);');
  };
  return m;
}
const BARK=0x5a4330,BIRCH=0x9c9284;
function buildTrees(){
  const cyl=(r0,r1,h,n)=>{const g=new THREE.CylinderGeometry(r0,r1,h,n||5,1,true);g.translate(0,h/2,0);return g;};
  const ball=(r,y,sy,det)=>{const g=new THREE.IcosahedronGeometry(r,det);g.scale(1,sy,1);g.translate(0,y,0);return g;};
  const cone=(r,h,y)=>{const g=new THREE.ConeGeometry(r,h,6,1,true);g.translate(0,y+h/2,0);return g;};
  // a broadleaf: a clear bole and a round crown; a conifer: tiers of cones; a small tree: a slim stem and a light crown (fruit, birch, rowan)
  const decidG=treeGeom([[cyl(0.34,0.55,4.4),BARK,0],[ball(3.2,6.6,1.05,0),0xffffff,1]]); // low-poly: some twenty thousand trees stand in the realm
  const pineG=treeGeom([[cyl(0.3,0.5,2.4,4),BARK,0],[cone(2.9,4.8,1.6),0xffffff,1],[cone(1.8,4,4.6),0xf4f4f4,1]]);
  const smallG=treeGeom([[cyl(0.18,0.28,2.8,4),BIRCH,0],[ball(1.8,3.9,1.25,0),0xffffff,1]]);
  const spots={dec:[],pine:[],small:[]};
  const nj=makeNoise(SEED^0x77E);
  for(let cz=0;cz<GRID;cz++)for(let cx=0;cx<GRID;cx++){
    const i=cIdx(cx,cz),bio=W.biome[i];
    if(bio!==B.FOREST&&bio!==B.PINE)continue;
    if(W.roadCells[i]||W.settlements.some(s=>dist2d(cellX(cx),cellZ(cz),s.pos.x,s.pos.z)<(s.wallR||s.radius)*1.5))continue;
    const dens=bio===B.FOREST?3:2;
    for(let t=0;t<dens;t++){
      const x=cellX(cx)+ (nj(cx*3+t*7,cz*3)-0.5)*CELL*1.4, z=cellZ(cz)+(nj(cx*3,cz*3+t*13)-0.5)*CELL*1.4;

    const i=cIdx(cx,cz),bio=W.biome[i];
    if((bio!==B.MEADOW&&bio!==B.FARM&&bio!==B.MARSH)||W.water[i]||W.roadCells[i]||slopeAt(cx,cz)>0.4)continue;

    if(anyLake(x,z)||W.settlements.some(s=>dist2d(x,z,s.pos.x,s.pos.z)<(s.wallR||s.radius)*1.1))continue;
    if(G.rivHash&&riverAt(x,z,2))continue;

  }

  for(const k of['dec','pine','small']){const a=spots[k],cap=k==='small'?3000:9000;if(a.length>cap){const st=a.length/cap;spots[k]=Array.from({length:cap},(_,i)=>a[Math.floor(i*st)]);}}

  G.pine=new THREE.InstancedMesh(pineG,crownMat(0x2e5138),Math.max(1,spots.pine.length));

  const TM={dec:G.decid,pine:G.pine,small:G.small};G.treeMesh=TM;
  for(const k in TM)spots[k].forEach((t,i)=>{setInst(TM[k],i,t.x,hAt(t.x,t.z)-0.3,t.z,t.x,t.s,t.s*treeSY(k,t.v),t.s);TM[k].setColorAt(i,C1.setRGB(0.84+t.v*0.26,0.86+t.v*0.24,0.82+t.v*0.2));});
  for(const k in TM)TM[k].instanceMatrix.needsUpdate=true;

  for(let i=4999;i>=0;i--){setInst(G.regrow,i,0,-500,0,0,0.001,0.001,0.001);G.regrowFree.push(i);}scene.add(G.regrow);

  G.decid.castShadow=G.pine.castShadow=G.small.castShadow=true;

      const far=crownTowns.sort((a,b)=>dist2d(b.pos.x,b.pos.z,W.capital.pos.x,W.capital.pos.z)-dist2d(a.pos.x,a.pos.z,W.capital.pos.x,W.capital.pos.z))[0];
      const loyal=W.houses.map((h,i)=>i).filter(i=>i>0&&!W.houses[i].exiled&&W.houses[i].loyalty>55&&!houseAtWar(i)&&(W.houses[i].gold??0)>-1000&&day()-(W.houses[i]._grantT||-1e9)>360*5);
      const exiled=W.houses.map((h,i)=>i).filter(i=>i>0&&W.houses[i].exiled&&day()-(W.houses[i].exiledDay||0)>360*8);
      const landless=loyal.filter(i=>!W.settlements.some(s=>s.owner===i));
      const to=landless.length?landless[0]:exiled.length&&chance('sim',0.6)?exiled[0]:loyal.length?wpick(loyal,i=>W.houses[i].loyalty/20,1):-1;
      if(to>0&&far){const h=W.houses[to],back=h.exiled;
        if(back){h.exiled=false;h.loyalty=70;const hd=W.notables.find(n=>n.alive&&n.house===to&&ageOf(n)>=16);if(hd){hd.role='head';h.head=hd.id;}}
        far.owner=to;h._grantT=day();if(back||!W.settlements.some(x=>x.owner===to&&x!==far))h.seat=W.settlements.indexOf(far);h.loyalty=clamp(h.loyalty+10,0,100);syncOwner(far);refreshOverlay();
        emit('crown',7,far.pos,back?`The crown recalls ${h.name} from exile and grants it ${far.name} to hold as a fief.`:`${far.name} is granted as a fief to ${h.name}, in reward for its loyalty.`);}
    }
  }
  // private wars: neighbours with grudges or land-hunger, when the crown is too weak to keep the peace
  W.feuds=W.feuds||[];
  for(let i=W.feuds.length-1;i>=0;i--){const fd=W.feuds[i],A=W.houses[fd.a],B=W.houses[fd.b];
    const hostA=W.armies.find(x=>x.house===fd.a&&!x.gone),hostB=W.armies.find(x=>x.house===fd.b&&!x.gone);
    if(day()>fd.until||!hostA||!hostB||A.exiled||B.exiled){
      const la=G.land.F.filter(f=>f.lord===fd.a).length-fd.la,lb=G.land.F.filter(f=>f.lord===fd.b).length-fd.lb;
      W.feuds.splice(i,1);
      for(const x of W.armies)if((x.house===fd.a||x.house===fd.b)&&!houseAtWar(x.house)&&!x.gone){liftSiege(x);if(x.standing)routHome(x);else disbandArmy(x);}
      const win=la>lb+2?A:lb>la+2?B:null;
      if(win&&win===W.houses[plyH()])sovAmbition('feud');
      emit('war',8,W.capital.pos,`${fd.name} ends${win?`; ${win.name} keeps the lands it took, and new border stones are set`:', each side keeping what it holds'}.`);
    }
  }
  if(W.feuds.length<3&&chance('sim',0.5*MOD.aggr)){ // lords fight lords: the usual weather of a fiefdom
    const borders=[];
    for(const f of G.land.F){if(f.lord<1)continue;const nb=[f.k+1,f.k-1,f.k+FN,f.k-FN].map(k=>G.land.F[k]).filter(Boolean);
      for(const g of nb)if(g.lord>=1&&g.lord!==f.lord){const a=Math.min(f.lord,g.lord),b=Math.max(f.lord,g.lord);borders.push(a*16+b);}}
    const pairs=[...new Set(borders)];
    const landed=hi=>!W.houses[hi].exiled&&W.settlements.some(s=>s.owner===hi);
    const cand=pairs.map(k=>({a:k>>4,b:k&15})).filter(p=>landed(p.a)&&landed(p.b)&&!atWar(p.a,p.b));
    const tension=p=>{const A=W.houses[p.a],B=W.houses[p.b];let t=0.2;
      if((A.grudges||{})[p.b]||(B.grudges||{})[p.a])t+=0.8;
      for(const s of W.settlements)if((s.owner===p.a||s.owner===p.b)&&s.landShort)t+=0.4;
      t+=(100-W.legitimacy)/80;return t;};
    const p=cand.length?wpick(cand,tension,0.6):null;
    const ply=plyH();
    if(p&&chance('sim',0.05*tension(p)*(p.a===ply||p.b===ply?0.5:1)))startFeud(p.a,p.b);
  }
}
function startFeud(a,b,by){ // a private war: both lords call out their tenants
  const A=W.houses[a],B=W.houses[b],ply=plyH();
  const fd={a,b,start:day(),until:day()+360*(1+randi('sim',2)),by,name:`the ${pick('sim',FEUD_NAMES)} of ${A.name.replace('House ','')} and ${B.name.replace('House ','')}`,
    la:G.land.F.filter(f=>f.lord===a).length,lb:G.land.F.filter(f=>f.lord===b).length};
  (W.feuds=W.feuds||[]).push(fd);
  for(const hi of[a,b]){const seat=W.settlements.findIndex(s=>s.owner===hi);if(seat>=0)raiseArmy(hi,seat,hostTarget(hi)*1.6,'host');}
  for(const x of W.armies)if(x.house===a||x.house===b)x.hold=x.house===ply&&x.standing; // the player's household still waits on orders; the levies take the field
  emit('war',8,W.settlements[A.seat]?W.settlements[A.seat].pos:W.capital.pos,by!=null?`${A.name} defies ${B.name} and rides out over the land between them — ${fd.name}.`
    :`${A.name} and ${B.name} fall to open war over the land between them — ${fd.name}. The crown ${W.legitimacy>60?'frowns, but':'is'} too weak to part them.`);
  return fd;
}

function buildFields(){
  if(W.villages0===undefined)W.villages0=W.settlements.filter(o=>o.kind==='village').length;
  genLand();

function tickLand(){ // monthly: the countryside follows the people
  if(!G.land||day()%30!==15)return;
  const now=day(),spring=Math.ceil((now+1)/360)*360+20,F=G.land.F,ph=G.land.perHead;
  W.settlements.forEach((s,si)=>{const own=s.furl||(s.furl=[]);
    let tilled=0,bearing=0;
    for(const f of own)if(ARABLE.has(f.kind)&&f.lord===s.owner){if(f.state===LS.TILLED||f.state===LS.BURNT)tilled+=f.area;if(f.state===LS.TILLED)bearing+=f.area;}
    const need=s.pop*landWt(s)*ph;
    s.landF=need>0?clamp(0.75+0.25*bearing/need,0.75,1):1;
    const d=f=>dist2d(f.x,f.z,s.pos.x,s.pos.z);
    if(tilled<need&&!s.siegeBy){ // take in more land: old pasture, open waste, scrub, then the wood; beyond the bounds if need be
      const bonus={[LS.PASTURE]:0.8,[LS.WILD]:0.5,[LS.SCRUB]:-0.2,[LS.WOOD]:-0.9};
      let c=own.filter(f=>ARABLE.has(f.kind)&&f.area>0&&bonus[f.state]!==undefined&&f.lord===s.owner);
      const reach=domReach(s)*1.5;
      const nearest=f=>!W.settlements.some(o=>o!==s&&dist2d(f.x,f.z,o.pos.x,o.pos.z)<d(f));
      c=c.concat(F.filter(f=>f.ar>=f.n*0.3&&d(f)<reach&&(f.lord<0||f.lord===s.owner)&&(f.dom<0||f.dom!==si&&(f.state===LS.WILD||f.state===LS.WOOD)&&ARABLE.has(f.kind))&&nearest(f)));
      const score=f=>-d(f)/350+(f.dom!==si?(f.fo>f.ar*0.5?-0.9:0.5)-(f.dom<0?0.7:1):bonus[f.state])+0.6*f.fa/Math.max(1,f.n); // the lord grants his waste to the nearer village
      c.sort((a,b)=>score(b)-score(a));
      const f=wpick(c.slice(0,12),score,0.35);
      if(f){
        if(f.dom!==si){if(f.dom>=0){const o=W.settlements[f.dom];o.furl=o.furl.filter(g=>g!==f);}
          claimFurlong(f,si,!!s.mother||s.role==='timber');if(!ARABLE.has(f.kind))shapeFurlong(f,s,LK.FIELD);
          if(!s._claimNote){s._claimNote=1;emit('trade',3,{x:f.x,z:f.z},`The men of ${s.name} drive their bounds out into the waste.`);}}
        const was=f.state;
        if(was===LS.WOOD&&f.kind===LK.FIELD)shapeFurlong(f,s,LK.CLOSE); // won from the wood: a hedged close
        setFurlong(f,LS.TILLED);s.landShort=0;
        if(was===LS.WOOD){s.assarts=(s.assarts||0)+1;
          if(s.assarts===1||s.assarts%15===0)emit('trade',3,{x:f.x,z:f.z},`The folk of ${s.name} are clearing the wood for new fields; the assarts ${pick('sim',['smoke with burning stumps','are ploughed between the stumps','are let at a penny the acre'])}.`);}
      }else if(!s.landShort){s.landShort=now;
        if(s.kind!=='village'||s.pop>120)emit('trade',3,s.pos,`There is no more land to plough about ${s.name}; its younger sons look elsewhere.`);}
    }else if(tilled>need*1.25+9000){ // too few hands: the farthest and poorest fields go back to grass
      const c=own.filter(f=>ARABLE.has(f.kind)&&f.state===LS.TILLED&&f.lord===s.owner).sort((a,b)=>d(b)-d(a)).slice(0,10);
      const f=wpick(c,f=>d(f)/350-0.6*f.fa/Math.max(1,f.n),0.35);
      if(f)setFurlong(f,LS.PASTURE);
    }
    for(const f of own)if(f.state===LS.BURNT&&now>f.until)setFurlong(f,f.lord===s.owner?LS.TILLED:LS.PASTURE);
    if(s.siegeBy){ // the besiegers forage and burn the standing crops
      const t=own.filter(f=>f.state===LS.TILLED&&ARABLE.has(f.kind)&&d(f)<(s.wallR||s.radius)+600);
      for(let k=0;k<2&&t.length;k++){const f=t.splice(randi('sim',t.length),1)[0];f.until=spring;setFurlong(f,LS.BURNT);}
    }
    // a place long out of land and doing well sends out a daughter village
    if(s.landShort&&now-s.landShort>360&&now%360===195&&s.prosperity>45&&s.pop>90&&chance('sim',0.25))foundDaughter(s);
  });
}
function foundTown(){ // a lord founds a new market town, laid out in one stroke (Freiburg): only in an age that plans towns
  if(AD()<1120||W.settlements.filter(o=>o.planned).length>=2||G.bldList.length+200>=G.bodies.instanceMatrix.count)return;
  const lords=W.houses.map((h,i)=>i).filter(i=>i>0&&i!==plyH()&&!W.houses[i].exiled&&(W.houses[i].gold||0)>1500);
  if(!lords.length)return;const hi=wpick(lords,i=>W.houses[i].gold/1500,1),seat=W.settlements.find(o=>o.owner===hi);if(!seat)return;
  const sites=[];
  for(const r of W.roads){if(r.a===r.b)continue;const q=r.path[Math.floor(r.path.length/2)];if(!q)continue;
    if(W.settlements.some(o=>dist2d(q.x,q.z,o.pos.x,o.pos.z)<(o.radius||90)+520))continue;
    const f=G.land&&furlongAt(q.x,q.z);if(f&&f.lord>=0&&f.lord!==hi)continue;
    sites.push({x:q.x,z:q.z,d:dist2d(q.x,q.z,seat.pos.x,seat.pos.z)});}
  const site=wpick(sites,q=>-q.d/1500,1);if(!site)return;
  const n=W.settlements.length;
  if(doAct('village',site,{from:seat,owner:hi,planned:true})&&W.settlements.length>n){W.houses[hi].gold-=1200;}
}
function foundDaughter(s){
  const vill=W.settlements.filter(o=>o.kind==='village').length;
  if(vill>=(W.villages0||0)+6||G.bldList.length+60>=G.bodies.instanceMatrix.count)return;
  const sites=[];
  for(let k=0;k<70;k++){
    const a=rand('sim')*Math.PI*2,r=520+rand('sim')*1100,x=s.pos.x+Math.cos(a)*r,z=s.pos.z+Math.sin(a)*r;
    if(Math.abs(x)>SIZE/2-300||Math.abs(z)>SIZE/2-300)continue;
    const ci=toCell(x),cj=toCell(z),c=cIdx(ci,cj);if(W.water[c]||slopeAt(ci,cj)>0.2)continue;
    if(W.settlements.some(o=>dist2d(x,z,o.pos.x,o.pos.z)<(o.radius||90)+300))continue;
    let sc=W.dom[c]<0?8:0; // colonists go to the waste, not into a neighbour's fields
    for(let j=0;j<16;j++){const b=j/16*Math.PI*2,px=x+Math.cos(b)*180,pz=z+Math.sin(b)*180,i=cIdx(toCell(px),toCell(pz));
      if(G.land.mask[i*4])sc+=(W.dom[i]<0?2:0.5)+(W.biome[i]===B.FARM?1:0);}
    if(sc>=14)sites.push({x,z,sc});
  }
  const best=wpick(sites,q=>q.sc,4);
  if(!best)return;
  const n=W.settlements.length;
  if(doAct('village',best,{from:s})&&W.settlements.length>n)s.pop=Math.max(40,s.pop-45);
}

function settleLand(s){ // a new village takes up the waste nearest it, laid out in Hufen
  const si=W.settlements.indexOf(s);s.furl=s.furl||[];computeDomains();
  for(const f of G.land.F){
    if(f.dom===si)continue;
    const c=cIdx(toCell(f.x),toCell(f.z));
    if(W.dom[c]===si&&(f.dom<0||f.state===LS.WILD||f.state===LS.WOOD||f.lord===s.owner&&f.held)){
      if(f.dom>=0){const o=W.settlements[f.dom];o.furl=o.furl.filter(g=>g!==f);}
      claimFurlong(f,si,true);writeFurlong(f);
    }
  }
  markSettlementBuilt(s);
  tillTo(s,s.pop*landWt(s)*G.land.perHead);
  for(const f of s.furl){writeFurlong(f);for(const t of f.trees)showTree(t,!treeGone(f,t));}
}

function addBuildingLive(s){ // growth: empty houses fill first, then the next open frontage; when there is none the town reaches further out
  const L=s._lay;if(!L||!s.growSlots)return null;
  if(G.bldList.length>=G.bodies.instanceMatrix.count)return null;
  const empty=s.buildings.find(b=>b.state==='ruin'&&b.deserted);
  if(empty){empty.state='sound';empty.deserted=false;s.ruinCount=Math.max(0,s.ruinCount-1);updateBuildingInstance(empty);return empty;}
  for(let t=0;t<30;t++){
    if(!s.growSlots.length){
      if(day()<(s._extT||0)||!L.extend())return null;
      s._extT=day()+360*2;s.growSlots=L.queue();stitchRoads();G.roadsDirty=true;
      if(G.feat)for(const st of s.streets)if(st.kind==='road')featStroke(2,st.pts,st.hw);
      if(!s.growSlots.length)return null;
    }
    // the likeliest lots are near the heart and on the busy streets, but people build where they can get a plot
    const pool=s.growSlots.slice(0,24),k0=pool[0].key;
    const c=wpick(pool,q=>-(q.key-k0)/30+(q.st.kind==='road'||q.st.market?0.4:0),1);
    s.growSlots.splice(s.growSlots.indexOf(c),1);
    const b=L.buildLot(c,Math.min(1,tierCap(),L.tierFor(c,99)));if(!b)continue;b.grown=day();
    if(c.st.hidden){c.st.hidden=false;G.roadsDirty=true;if(G.feat)featStroke(2,c.st.pts,c.st.hw);} // the first house on a new lane: the lane appears
    b.idx=G.bldList.length;G.bldList.push(b);G.bodies.count=G.roofs.count=G.bldList.length;
    updateBuildingInstance(b);clearLandUnder(b);if(G.feat)featBuilding(b);
    return b;
  }
  return null;
}

function colGeom(parts){ // [[geometry, matrix, hex]] → one geometry; tintable parts use 0xffffff
  const pos=[],nor=[],col=[],nm=new THREE.Matrix3(),v=new THREE.Vector3(),c=new THREE.Color();
  for(const[g0,m,hex]of parts){
    const g=g0.index?g0.toNonIndexed():g0;nm.getNormalMatrix(m);c.setHex(hex);
    const P=g.attributes.position,Nn=g.attributes.normal;
    for(let i=0;i<P.count;i++){
      v.fromBufferAttribute(P,i).applyMatrix4(m);pos.push(v.x,v.y,v.z);
      v.fromBufferAttribute(Nn,i).applyNormalMatrix(nm);nor.push(v.x,v.y,v.z);col.push(c.r,c.g,c.b);
    }
    if(g!==g0)g.dispose();
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(nor,3));
  out.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  return out;
}

/* =========================================================================

const cam={
  focus:new THREE.Vector3(0,0,0),yaw:0.8,dist:2600,pitchBias:0,
  cur:{focus:new THREE.Vector3(0,0,0),yaw:0.8,dist:2600,pitchBias:0},
  mode:'free',follow:null,manualUntil:0,shake:0

function pitchForDist(d){ // curved altitude path: high = map-like, low = street-like
  const t=clamp((Math.log(d)-Math.log(8))/(Math.log(4000)-Math.log(8)),0,1);
  return lerp(0.14,1.22,Math.pow(t,0.8));
}
function flyTo(x,z,d,yaw){

function updateCamera(dt,now){
  if(cam.follow){

    }

  const fx=cam.cur.focus.x,fz=cam.cur.focus.z;

  camera.lookAt(fx,fy,fz);

const raycaster=new THREE.Raycaster();
function groundPoint(e){

function onClick(e){

    const p=groundPoint(e),mode=placeMode,arg=placeArg;
    setPlaceMode(null);

      if(mode==='order')orderArmy(arg,nearestSettlementIdx(p.x,p.z));
      else if(mode==='charter'){if(W.treasury>=arg&&doAct('village',p)){W.treasury-=arg;setCd('d_charter',360);sovAmbition('founder');}}
      else if(mode==='road1'){const i=nearestSettlementIdx(p.x,p.z),s=W.settlements[i];
        if(dist2d(p.x,p.z,s.pos.x,s.pos.z)>(s.radius||90)*2)emit('crown',2,p,'The road must start from a place.');
        else{const others=W.settlements.map((o,j)=>j).filter(j=>j!==i);setPlaceMode('road2',i,`From ${s.name}: now click the place the road should reach — Esc to cancel`);}}
      else if(mode==='road2'){const i=nearestSettlementIdx(p.x,p.z),s=W.settlements[i];
        if(dist2d(p.x,p.z,s.pos.x,s.pos.z)>(s.radius||90)*2)emit('crown',2,p,'The road must end at a place.');else crownRoad(arg,i);}
      else if(mode==='pave'){const g=groundPick(p.x,p.z);if(g&&g.type==='road')paveRoad(g.r);else emit('crown',2,p,'There is no road there to pave.');}
      else if(mode==='buyland'){const f=G.land&&furlongAt(p.x,p.z);if(f)buyLand(f);}
      else if(mode==='clear'){if(clearDistrict(p))setCd('d_clear',90);}
      else if(/^l(road1|road2|pave|village)$/.test(mode))lordPlace(mode,p,arg);
      else doAct(mode,p);

  if(G.dragonMesh.visible)targets.push(G.dragonMesh);

function groundPick(x,z){ // what lies on the ground here: a wall, a road or street, a river, or else the land itself
  for(const s of W.settlements)if(s.wallRad){const a=Math.atan2(z-s.pos.z,x-s.pos.x);if(Math.abs(dist2d(x,z,s.pos.x,s.pos.z)-wallRadAt(s,a))<7)return{type:'wall',s};}

    setHTML(title,(lord?`<img src="${sigURL(f.lord)}">`:'')+esc(f.kind?KIND_NAME[f.kind][0].toUpperCase()+KIND_NAME[f.kind].slice(1):(f.state===LS.WOOD?'Woodland':'Open land')));
    sub.textContent='a furlong'+(s?' of '+s.name:'')+(lord?' · '+lord.name:' · unclaimed');
    h+=row('Use',use);
    if(f.held&&lord)h+=row('Held',`<span style="color:#c0392b">by the sword</span>, by ${esc(lord.name)} — it goes back to its people unless a fort holds it`);
    else if(lord)h+=row('Lord',esc(lord.name));
    if(s)h+=row('Worked from',`${esc(s.name)} (${(dist2d(f.x,f.z,s.pos.x,s.pos.z)/1000).toFixed(1)} km)`);
    if(f.lord>0)h+=row('Price to the crown',`${landPrice(f).toLocaleString()} gold (Buy land decree)`);else if(f.bought)h+=row('Bought','by the crown; its rent goes to the treasury');
    h+=row('Area',`${ha(f.area)} ploughable of ${ha(f.n*225)}`);
    if(f.w>1&&f.state===LS.TILLED&&f.kind!==LK.VINE)h+=row('Strips',`${Math.round(f.w)} m wide, running ${f.kind===LK.HUFE?'back from the village street':'down the slope for drainage'}`);
    if(f.kind===LK.FIELD)h+=row('Great field',['the first','the second','the third'][f.gf]+' of three, in rotation');
    h+=row('Ground',`${bio}, ${Math.round(W.h[c])} m, ${slopeAt(toCell(pk.x),toCell(pk.z))>0.22?'steep':slopeAt(toCell(pk.x),toCell(pk.z))>0.08?'sloping':'level'}`);
    const trees=f.trees.filter(t=>t.shown!==false).length+(f.sap?f.sap.length:0);if(trees)h+=row('Trees',trees+(f.sap?' (young growth)':''));
    if(f.worked)h+=row('History','worked land before'+(f.state===LS.TILLED?'':'; now abandoned'));
  }else if(pk.type==='road'){
    const r=pk.r,A=W.settlements[r.a],Bs=W.settlements[r.b];
    setHTML(title,'The king\'s road');sub.textContent=A.name+' — '+Bs.name;
    h+=row('Length',(polyLen(r.path)/1000).toFixed(1)+' km');
    h+=row('Traffic',(r.vol||0)>3?'busy':(r.vol||0)>1?'steady':(r.vol||0)>0.2?'light':'quiet');
    const carts=(G.traffic||[]).filter(t=>t.poly===r.path||t.info&&((t.info.origin===r.a&&t.info.dest===r.b)||(t.info.origin===r.b&&t.info.dest===r.a))).length;
    if(carts)h+=row('On the road now',carts+' cart'+(carts>1?'s':''));
    const camps=W.banditCamps.filter(c=>r.path.some(q=>dist2d(q.x,q.z,c.x,c.z)<500)).length;if(camps)h+=row('Danger',`<span style="color:#c0392b">${camps} outlaw camp${camps>1?'s':''} near the road</span>`);
  }else if(pk.type==='street'){
    const st=pk.st,s=pk.s,n=s.buildings.filter(b=>b.st===st&&b.state==='sound').length;
    setHTML(title,esc(STREET_NAME[st.kind]||'Street'));sub.textContent=s.name;
    h+=row('Length',Math.round(polyLen(st.pts))+' m');h+=row('Houses on it',n);
    if(st.fireSt)h+=row('Laid out','straight across ground cleared by a great fire');
    else if(st.neu)h+=row('Laid out','as the lord\'s “New Town”: one street of equal plots');
    else if(st.planned)h+=row('Laid out','in one stroke, when the town was founded');
    else if(st.castlePath)h+=row('Leads to','the castle');
    if(st.market)h+=row('Market','the market is held along it'+(s.baechle?'; runnels of water run down its sides':''));
  }else if(pk.type==='river'){
    const st=pk.st,w=pk.o.hw*2;
    setHTML(title,esc(riverName(st)));sub.textContent=st&&st.canal?'dug from the harbour into the town':'a river';
    h+=row('Width',Math.round(w)+' m');h+=row('Surface',Math.round(pk.o.y)+' m above the sea');
    const towns=W.settlements.filter(o=>st&&st.pts.some(q=>dist2d(q.x,q.z,o.pos.x,o.pos.z)<o.radius+60)).map(o=>o.name);
    if(towns.length)h+=row('Towns on its banks',esc(towns.join(', ')));
    const bridges=W.roads.reduce((t,r)=>t+(r.path.some(q=>riverAt(q.x,q.z,0)&&st&&riverAt(q.x,q.z,0).a&&st.pts.includes(riverAt(q.x,q.z,0).a))?1:0),0);if(bridges)h+=row('Bridged by',bridges+' road'+(bridges>1?'s':''));
    const boats=(G.traffic||[]).filter(t=>t.info.river).length;if(boats)h+=row('Barges on the rivers',boats);
  }else if(pk.type==='wall'){
    const s=pk.s,kinds=[0,0,0,0];for(const k of s.wallKind||[])kinds[k]++;const n=(s.wallKind||[]).length||1;
    setHTML(title,`<img src="${sigURL(s.owner)}">`+esc('The walls of '+s.name));
    sub.textContent=s.bastions?'a bastioned trace, with a ditch':s.walls>=2?'a curtain of stone':'a palisade and ditch';
    let L=0;for(let k=0;k<WALLN;k++){const a0=k/WALLN*Math.PI*2,a1=(k+1)/WALLN*Math.PI*2;L+=dist2d(Math.cos(a0)*wallRadAt(s,a0),Math.sin(a0)*wallRadAt(s,a0),Math.cos(a1)*wallRadAt(s,a1),Math.sin(a1)*wallRadAt(s,a1));}
    h+=row('Circuit',(L/1000).toFixed(2)+' km');h+=row('Gates',wallGates(s).length);
    if(kinds[1])h+=row('Cliffs',Math.round(kinds[1]/n*100)+'% of the circuit needs no wall');
    if(kinds[2])h+=row('Water',Math.round(kinds[2]/n*100)+'% runs along the bank');
    if(kinds[3])h+=row('Hillside',Math.round(kinds[3]/n*100)+'% rides a falling slope');
    if(s.citadel)h+=row('Citadel','a star fort astride the walls');
    if(s.oldWalls&&s.oldWalls.length)h+=row('Older circuits',s.oldWalls.length+', their lines now streets');
    const built=(s.history||[]).filter(x=>/wall|palisade/i.test(x.t)).map(x=>(x.yr?'AD '+(W.startAD+x.yr-1):'c. '+x.ago+' yrs before')+': '+x.t);
    if(built.length)h+=`<div class="agline" style="font-size:11.5px">${built.map(esc).join('<br>')}</div>`;
  }else if(pk.type==='dragon'){
    const d=W.dragon;
    setHTML(title,esc(d.name));
    sub.textContent='the dragon of the high peak';
    h+=row('Mood',d.mood);
    h+=row('Hoard',Math.round(d.hoard)+' gold');
    h+=row('Raids',d.wakes);
    flyToBtn(fb,'Follow',()=>{markManual();cam.follow=d;cam.dist=300;});
  }else if(pk.type==='cairn'){
    setHTML(title,esc('Battle cairn'));
    sub.textContent='';
    h+=`<div class="agline">${esc(pk.text)}</div>`;
  }else if(pk.type==='camp'){
    setHTML(title,esc(pk.camp.king?('Camp of '+pk.camp.king):'Bandit camp'));
    sub.textContent='outlaws of the greenwood';
    h+=row('Raids',pk.camp.raids);
    if(pk.camp.patrol)h+=row('Crown riders','on the way');
    flyToBtn(fb,'Visit',()=>flyTo(pk.camp.x,pk.camp.z,260));
  }
  setHTML(body,h);setHTML(acts,actsH); // live refresh only touches the DOM when something changed
  el.style.display='block';
}
function flyToBtn(fb,label,fn){fb.style.display='block';fb.textContent=label;fb.onclick=()=>{markManual();fn();};}
function hideInspect(){document.getElementById('insp').style.display='none';inspTarget=null;}
function refreshInspect(){ // live numbers; close the card when its subject has left the stage
  const pk=inspTarget;if(!pk||uiBusy())return;
  if((pk.type==='caravan'&&pk.c.gone)||(pk.type==='army'&&(pk.a||pk.army).gone)||
     (pk.type==='camp'&&!W.banditCamps.includes(pk.camp))){hideInspect();return;}
  if(pk.type==='cairn')return;
  showInspect(pk);
}
function sigURL(hi){
  const h=W.houses[hi]||W.houses[0];
  if(!h._url)h._url=makeSigil(h.sigilHue,h.charge).toDataURL();
  return h._url;
}
/* =========================================================================
   SIMULATION — one tick = one sim-day. Weather → Economy → Population →
   Politics → Military → Threats → Growth → Chronicle flush.
   Every positive feedback loop ships with a predator.
   ========================================================================= */
MOD={harvest:1,birth:1,mort:1,trade:1,tax:12,vir:1,leth:1,disaster:1,bandit:1,aggr:1,fert:1,myth:1};
let speedIdx=2,lastSpeed=2;
const day=()=>W.clock.day;
const year=()=>Math.floor(W.clock.day/360)+1;
const seasonIdx=()=>Math.floor((W.clock.day%360)/90);
const seasonDay=()=>Math.floor(W.clock.day%90)+1;
function dateStr(d){
  d=d??W.clock.day;
  return SEASONS[Math.floor((d%360)/90)]+' '+(Math.floor(d%90)+1)+', AD '+(((W&&W.startAD)||850)+Math.floor(d/360));
}
function ordinal(n){return n+(['th','st','nd','rd'][((n%100/10|0)!==1&&n%10<4)?n%10:0]||'th');}
function mythMult(){return W.comet&&W.comet.teeth&&day()<W.comet.until?2:1;}

function simInit(){
  // resource bases per settlement
  for(const s of W.settlements){
    let farm=0,forest=0,ore=0;
    for(let dz=-5;dz<=5;dz++)for(let dx=-5;dx<=5;dx++){
      if(!inB(s.cx+dx,s.cz+dz))continue;const b=W.biome[cIdx(s.cx+dx,s.cz+dz)];
      if(b===B.FARM)farm++;if(b===B.FOREST||b===B.PINE)forest++;if(b===B.ROCK)ore++;
    }
    s.res={farm,forest,ore:Math.min(ore,14),fish:(s.harbor?12:0)+(s.river?5:0)};
    // nearest river cell, for barge landings
    s.rivCell=null;
    if(s.river){
      let bd=1e9;
      for(let dz=-6;dz<=6;dz++)for(let dx=-6;dx<=6;dx++){
        const ci=s.cx+dx,cj=s.cz+dz;
        if(!inB(ci,cj)||W.water[cIdx(ci,cj)]!==2)continue;
        const d=dx*dx+dz*dz;if(d<bd){bd=d;s.rivCell=cIdx(ci,cj);}
      }
    }
  }
  W.player={on:false,started:false,legacy:0,since:0,startPop:0,peaceSince:0,amb:{},cd:{},pause:true,confirm:null};
  W.petitions=[];W.dynasty=1;
  // the river is a road that flows: barge routes between river-linked towns
  W.riverPairs=[];
  for(let i=0;i<W.settlements.length;i++)for(let j=i+1;j<W.settlements.length;j++){
    if(!W.settlements[i].river||!W.settlements[j].river)continue;
    const r=riverRoute(i,j);
    if(r&&r.len>400)W.riverPairs.push({a:i,b:j,route:r});
  }
}

/* ============================ WEATHER ==================================== */
function tickWeather(){
  const w=W.weather,si=seasonIdx();
  w.t--;
  if(w.t<=0){
    const r=rand('sim');
    const rainy=si===0?0.32:si===1?0.18:si===2?0.3:0.24;
    if(r<rainy*(W.drought?0.35:1))w.state=si===3?'snow':(chance('sim',0.25)?'storm':'rain');
    else if(r<rainy+0.24)w.state='overcast';
    else w.state='clear';
    w.t=2+randi('sim',5);
    w.wind+=(rand('sim')-0.5)*1.2;
  }
  if(si===3&&(w.state==='snow'||w.state==='storm'))W.snowpack=Math.min(100,W.snowpack+3);
  if(si!==3)W.snowpack=Math.max(0,W.snowpack-(si===0?2.2:1));
  if(W.flooding>0)W.flooding--;
  if(W.eclipse>0)W.eclipse-=1;
}

/* ============================ ECONOMY ==================================== */
function spareOf(s,g){ // what a place can send away: a hungry town keeps its food, and every town keeps a month's bread
  if(g==='grain'||g==='fish')return s.hunger>0.05?0:s.stores[g]-s.pop*(NEED.grain+NEED.fish)*30;
  return s.stores[g];}
function closedToTrade(s){return s.infected/Math.max(1,s.pop)>0.15||!!s.siegeBy||s.quarantineUntil>day();}
const NEED={grain:0.007,fish:0.003,timber:0.0006,ore:0.0002,tools:0.0004,cloth:0.0005,wine:0.0004};
function price(s,g){
  const need=s.pop*NEED[g]*25+5;
  return GOODBASE[g]*clamp(need/(s.stores[g]+2),0.3,4);
}
function tickEconomy(){
  const si=seasonIdx(),seasonF=[0.7,1.1,1.6,0.08][si];
  for(const s of W.settlements){
    const workF=clamp(s.pop/(s.pop+s.plagueDead+1),0.4,1)*(s.siegeBy?0.15:1);
    s.stores.grain+=s.res.farm*0.92*seasonF*MOD.harvest*(W.drought?0.35:1)*workF*(s.landF??1); // too little land under the plough, or crops burned
    s.stores.fish+=s.res.fish*0.8*workF;
    s.stores.timber+=s.res.forest*0.05*workF;
    s.stores.ore+=s.res.ore*0.05*workF;
    if(s.kind!=='village'){ // craft conversion
      const c=Math.min(s.stores.ore,s.stores.timber,1.4);
      s.stores.ore-=c*0.6;s.stores.timber-=c*0.6;s.stores.tools+=c*0.8;
    }
    if(s.kind==='capital'){s.stores.cloth+=0.9;s.stores.wine+=0.7;}
    for(const g of GOODS){
      s.stores[g]-=s.pop*NEED[g]*(g==='grain'||g==='fish'?0:1); // food eaten in population tick
      s.stores[g]=clamp(s.stores[g],0,s.pop*NEED[g]*220+400);
    }
    // taxes on production (towns held by houses in arms against the crown pay nothing): the crown's own towns pay it in full;
    // a lord's towns owe the crown only its feudal aid, their rents being his
    if(!inRevolt(s.owner)){const due=s.pop*0.0016*(MOD.tax/12)*(s.prosperity/60)*(s.owner>0?0.4:1);
      if(s.taxBreakUntil>day()&&s.owner>0&&s.owner===s.taxBreakHouse&&W.houses[s.owner])W.houses[s.owner].gold=(W.houses[s.owner].gold||0)+due;else W.treasury+=due;} // dues remitted to a lord stay in his purse
  }
  // caravans
  if(W.caravans.length<Math.round(30*MOD.trade)&&day()%2===0){
    for(let attempt=0;attempt<3;attempt++){
      const oi=randi('sim',W.settlements.length),o=W.settlements[oi];
      if(closedToTrade(o))continue;
      let best=null;
      for(let di=0;di<W.settlements.length;di++){
        if(di===oi)continue;const d=W.settlements[di];
        if(closedToTrade(d))continue; // emergent quarantine (or the crown's sealed gates)
        for(const g of GOODS){
          const margin=price(d,g)-price(o,g);
          if(margin>GOODBASE[g]*0.5&&o.stores[g]>40){
            const r=route(oi,di);if(!r)continue;
            const score=margin/Math.max(600,r.len);
            if(!best||score>best.score)best={score,di,g,r};
          }
        }
      }
      if(best){
        const o2=W.settlements[oi],dd=W.settlements[best.di];
        const qty=Math.min(o2.stores[best.g]*0.4,60);
        o2.stores[best.g]-=qty;
        const c={origin:oi,dest:best.di,good:best.g,qty,value:qty*price(dd,best.g),
          poly:best.r.poly,len:best.r.len,departDay:day(),arriveDay:day()+(best.r.time??best.r.len)/1000,robbed:false,
          proxy:null,sea:false};
        W.caravans.push(c);
        const rr=W.roads.find(r=>(r.a===oi&&r.b===best.di)||(r.a===best.di&&r.b===oi));
        if(rr)rr.vol=(rr.vol||0)+1;
        break;
      }
    }
  }
  // ambient market traffic keeps the roads alive even without arbitrage gaps
  for(let amb=0;amb<2;amb++){
    if(W.caravans.length>=Math.round(26*MOD.trade)||!chance('sim',0.5*MOD.trade))continue;
    const oi=randi('sim',W.settlements.length);let di=randi('sim',W.settlements.length);
    if(oi!==di){
      const o=W.settlements[oi],d2=W.settlements[di];
      if(!closedToTrade(o)&&!closedToTrade(d2)){
        const g=GOODS.reduce((a,b)=>spareOf(o,a)>spareOf(o,b)?a:b);
        if(spareOf(o,g)>25){
          const r=route(oi,di);
          if(r){
            const qty=Math.min(o.stores[g]*0.25,40);o.stores[g]-=qty;
            W.caravans.push({origin:oi,dest:di,good:g,qty,value:qty*price(d2,g),poly:r.poly,len:r.len,
              departDay:day(),arriveDay:day()+(r.time??r.len)/1000,robbed:false,sea:false,proxy:null});
            const rr=W.roads.find(r2=>(r2.a===oi&&r2.b===di)||(r2.a===di&&r2.b===oi));
            if(rr)rr.vol=(rr.vol||0)+0.5;
          }
        }
      }
    }
  }
  // river barges between river-linked settlements (faster and safer than the road)
  if(W.riverPairs&&W.riverPairs.length&&W.caravans.filter(c=>c.river).length<5&&chance('sim',0.4*MOD.trade)){
    const pr=pick('sim',W.riverPairs);
    const downstream=chance('sim',0.5);
    const oi=downstream?pr.a:pr.b,di=downstream?pr.b:pr.a;
    const o=W.settlements[oi],d2=W.settlements[di];
    if(!closedToTrade(o)&&!closedToTrade(d2)){
      const g=GOODS.reduce((a,b)=>spareOf(o,a)>spareOf(o,b)?a:b);
      if(spareOf(o,g)>25){
        const qty=Math.min(o.stores[g]*0.3,70);o.stores[g]-=qty;
        const poly=downstream?pr.route.poly:[...pr.route.poly].reverse();
        W.caravans.push({origin:oi,dest:di,good:g,qty,value:qty*price(d2,g),poly,len:pr.route.len,
          departDay:day(),arriveDay:day()+pr.route.len/1500,robbed:false,sea:false,river:true,proxy:null});
      }
    }
  }
  // cogs between harbors
  const harbors=W.settlements.map((s,i)=>s.harbor?i:-1).filter(i=>i>=0);
  if(harbors.length>=2&&W.caravans.filter(c=>c.sea).length<6&&chance('sim',0.3*MOD.trade)){
    const ai=pick('sim',harbors);let bi=pick('sim',harbors);
    if(ai!==bi){
      const a=W.settlements[ai],b=W.settlements[bi];
      const g=pick('sim',['fish','grain','cloth','wine']);
      if(spareOf(a,g)>50&&!closedToTrade(a)&&!closedToTrade(b)){ // cogs used to sail into plague ports and sieges
        const qty=Math.min(a.stores[g]*0.4,90);a.stores[g]-=qty;
        const sr=seaRoute(ai,bi);if(!sr){a.stores[g]+=qty;}else{const poly=sr.poly,len=sr.len;
        W.caravans.push({origin:ai,dest:bi,good:g,qty,value:qty*price(b,g),poly,len,departDay:day(),arriveDay:day()+len/1600,robbed:false,sea:true});}
      }
    }
  }
  for(const c of W.caravans)if(!c._carts){c._carts=true;spawnCarts(c);}
  // arrivals
  for(let i=W.caravans.length-1;i>=0;i--){
    const c=W.caravans[i];
    if(day()>=c.arriveDay){
      const d=W.settlements[c.dest];
      if(!c.robbed){
        d.stores[c.good]+=c.qty;
        const profit=c.value*0.35;
        W.treasury+=profit*(MOD.tax/100);
        d.prosperity=clamp(d.prosperity+0.4,0,100);
        W.settlements[c.origin].prosperity=clamp(W.settlements[c.origin].prosperity+0.3,0,100);
        // plague travels the trade network
        const o=W.settlements[c.origin];
        if(o.infected/Math.max(1,o.pop)>0.02&&d.infected<1&&chance('sim',0.35*MOD.vir)){
          d.infected+=3;
          emit('fates',7,d.pos,`The pestilence has come to ${d.name}, borne on the ${c.sea?'tide':'road'} from ${o.name}.`);
          plagueArrives(d);
        }
      }
      if(c.proxy){scene.remove(c.proxy);c.proxy=null;}
      c.gone=true;
      W.caravans.splice(i,1);
    }
  }
  for(const r of W.roads)r.vol=(r.vol||0)*0.995;
  // treasury upkeep drains — the predator on hoarding
  W.treasury-=W.armies.filter(a=>a.house===0&&!a.gone).reduce((t,a)=>t+a.strength*(a.standing?0.02:0.05),0); // the crown pays its own hosts by the head; the household costs less than a levy
  W.treasury-=W.settlements.reduce((t,s)=>t+(s.owner===0?s.garrison:0),0)*0.012; // the crown keeps its own garrisons; a lord keeps his
  if(W.treasury>15000)W.treasury-=(W.treasury-15000)*0.0012; // the court's splendor grows to meet the coin
  W.treasury=Math.max(-500,W.treasury);
}

/* ============================ POPULATION ================================= */
function carryingCap(s){ // souls the place can keep: the land it actually ploughs, its fisheries, and (for towns) its market
  if(G.land&&s.furl&&s.furl.length&&G.land.perHead>0){
    let bearing=0;for(const f of s.furl)if(ARABLE.has(f.kind)&&f.state===LS.TILLED&&f.lord===s.owner)bearing+=f.area;
    const yieldF=(1+Math.max(0,year()-1)*0.002)*MOD.harvest*(W.drought?0.7:1); // better ploughs and rotations, slowly, over the centuries
    const fed=bearing*yieldF/(landWt(s)*G.land.perHead)+s.res.fish*12;
    let hinter=0; // the seat lives off the realm's rents and tolls; a market town off the surplus of its villages
    if(s.kind==='capital')for(const o of W.settlements){if(o!==s)hinter+=o.pop*0.12;}
    else if(s.kind==='town')for(const o of W.settlements)if(o.kind==='village'&&dist2d(o.pos.x,o.pos.z,s.pos.x,s.pos.z)<1600)hinter+=o.pop*0.3;
    const market=((s.kind==='capital'?1200:s.kind==='town'?450:0)+hinter)*clamp(s.prosperity/60,0.4,1.4);
    // while there is still land to take in, the land is no limit: people clear more as they need it; once it is gone, it is
    return Math.max(40,s.landShort?fed+market:Math.max(fed+market,s.pop*1.35));
  }
  const base=s.kind==='capital'?3600:s.kind==='town'?1500:320;
  const land=clamp(0.55+(s.res.farm*MOD.harvest)/160+s.res.fish/45,0.5,1.45);

}
function tickPopulation(){
  for(const s of W.settlements){
    const foodNeed=s.pop*(NEED.grain+NEED.fish);
    let got=Math.min(s.stores.grain,foodNeed*0.75);s.stores.grain-=got;
    const fishGot=Math.min(s.stores.fish,foodNeed-got);s.stores.fish-=fishGot;got+=fishGot;
    {const more=Math.min(s.stores.grain,foodNeed-got);s.stores.grain-=more;got+=more;} // no fish to be had: bread must do
    const hunger=foodNeed>0?clamp(1-got/foodNeed,0,1):0;
    s.hunger=hunger;
    /* demography with a ceiling: what the land (and the sea, and the market) can feed. Births fall as
       a place fills up and settle it near 85% of capacity; towns bury more than villages (crowding,
       foul water); crowded villages send their young to the towns. Plague and famine still bite, but
       the realm now recovers from them instead of either dwindling or swelling without end. */
    if(s._room===undefined||day()%10===0)s._room=housing(s)+(s.growSlots?s.growSlots.length:0)*HOUSEHOLD*0.6+s.buildings.filter(b=>b.state==='ruin'&&!b.deserted).length*HOUSEHOLD; // free lots and burned houses can be built again (counted every ten days)
    const room=s._room;
    const K=Math.min(carryingCap(s),room*1.35);s.K=K; // people need roofs as well as bread: a cramped site builds upward, then stops
    const pf=clamp(s.prosperity/60,0.6,1.25),x=s.pop/K;
    const births=s.pop*(0.040/360)*MOD.birth*pf*clamp(1.6-x,0.1,1.2)*(1-hunger*0.8);
    const dbase=s.kind==='capital'?0.032:s.kind==='town'?0.030:0.026;
    const deaths=s.pop*(dbase/360)*MOD.mort*(1+hunger*4)*(s.siegeBy?1.5:1)*(x>1.3?1+(x-1.3):1);
    s.pop=Math.max(5,s.pop+births-deaths);if(!Number.isFinite(s.pop))s.pop=Math.max(5,Math.min(K,50));
    if(s.kind==='village'&&(x>0.97||s.landShort&&x>0.85)&&day()%30===0){ // the young leave for the towns when there is no room or no land
      const town=W.settlements.filter(o=>o.kind!=='village'&&(o.hunger||0)<0.1).sort((a,b)=>dist2d(a.pos.x,a.pos.z,s.pos.x,s.pos.z)-dist2d(b.pos.x,b.pos.z,s.pos.x,s.pos.z))[0];
      if(town){const go=s.pop*0.012*(x-0.7);s.pop-=go;town.pop+=go;}
    }
    if(s.recovered>0)s.recovered*=0.9995; // immunity fades over years, not overnight
    s.unrest=clamp(s.unrest+hunger*1.6+(MOD.tax-12)*0.012-(s.festivalUntil>day()?0.5:0)-0.14,0,100);
    s.prosperity=clamp(s.prosperity+(hunger>0.25?-0.35:0.06)-(s.siegeBy?0.5:0)-(s.quarantineUntil>day()?0.12:0),1,100);
    if(hunger>0.4&&!s.famineFlag&&s.pop>100){
      s.famineFlag=true;
      emit('trade',7,s.pos,`Famine stalks ${s.name}; the granaries stand empty and the ${['young','old','poor'][randi('sim',3)]} perish first.`);
      W.legitimacy=clamp(W.legitimacy-4,0,100);
      famineStrikes(s);
    }
    if(hunger<0.15)s.famineFlag=false;
    // migration under misery
    if((hunger>0.3||s.unrest>65)&&s.pop>60){
      const to=W.settlements.filter(o=>o!==s&&(o.hunger||0)<0.1).sort((a,b)=>b.prosperity-a.prosperity)[0];
      if(to){const flee=s.pop*0.002;s.pop-=flee;to.pop+=flee;} // nobody vanishes into thin air
    }
    // plague SIR
    if(s.infected>0.3){
      const N=Math.max(1,s.pop),beta=0.22*MOD.vir,gamma=0.075;
      const Sf=Math.max(0,N-s.infected-s.recovered);
      const newInf=beta*Sf*s.infected/N;
      const rec=gamma*s.infected;
      const dead=rec*0.28*MOD.leth;
      s.infected=Math.max(0,s.infected+newInf-rec);
      s.recovered+=rec-dead;
      s.plagueDead+=dead;s.pop=Math.max(5,s.pop-dead);
      s.pyres=s.infected/N>0.04;
      s.unrest=clamp(s.unrest+s.infected/N*1.2,0,100);
      if(newInf<rec&&s.infected<Math.max(0.5,Math.min(N*0.005,3))){s.infected=0;s.pyres=false; // only a waning outbreak burns out: a fresh seed must get its chance // burned out (no smouldering endemic)
        if(s.plagueDead>30)emit('fates',6,s.pos,`The pestilence loosens its grip on ${s.name}. ${Math.round(s.plagueDead)} souls were carried to the pyres.`);
        s.plagueDead=0;
      }
    }
  }
  W.plagueActive=W.settlements.some(s=>s.infected>0.5);
}

function partition(hi,son){ // the lands are divided between the sons: the outlying fiefs go to a cadet branch
  const h=W.houses[hi],own=W.settlements.filter(s=>s.owner===hi);if(hi===0||own.length<3)return;

  const used=new Set(W.houses.map(o=>o.sigilHue));
  const hue=HOUSEHUES.find(x=>!used.has(x))||HOUSEHUES[6+(W.houses.length%5)];
  const give=own.filter(s=>s!==seat).sort((a,b)=>dist2d(b.pos.x,b.pos.z,seat.pos.x,seat.pos.z)-dist2d(a.pos.x,a.pos.z,seat.pos.x,seat.pos.z)).slice(0,Math.floor(own.length/3));
  if(!give.length)return;
  const name='House '+give[0].name.replace(/(mere|holt|ford|caster|wyck|march|fell|combe|worth|bridge|haven|moor|dale|garth|stead|port|field|burn|cester|ham|by)$/,'')+pick('sim',['ing','mont','ric','wald','hurst']);
  const cC=CULT[h.cult]||CULT.anglo,cr=nameRng(day()+hi*101),cname=cC.house(give[0].name,cr,cC,r1(cr,cC.roots));
  const nh={name:W.houses.some(o=>o.name===cname)?name:cname,cult:h.cult,sigilHue:hue,charge:pick('sim',CHARGES),seat:W.settlements.indexOf(give[0]),loyalty:60,might:(h.might||1)*0.8,wealth:(h.wealth||1)*0.7,exiled:false,grudges:{[hi]:true},crown:false,cadetOf:hi};
  if(ci<0){if(W.houses.length>=11)return;W.houses.push(nh);ci=W.houses.length-1;}else{Object.assign(W.houses[ci],nh);delete W.houses[ci]._url;}
  son.house=ci;son.role='head';W.houses[ci].head=son.id;
  for(const s of give){s.owner=ci;syncOwner(s);}
  (h.grudges=h.grudges||{})[ci]=true;refreshOverlay();
  emit('house',7,give[0].pos,`The lands of ${h.name} are divided between the sons: ${son.name} takes ${give.map(s=>s.name).join(' and ')} and founds ${W.houses[ci].name}, a cadet branch with its own arms — and its own quarrels.`);
