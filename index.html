  else if(cmd==='hold'){a.hold=true;if(a.state==='march'){a.nextOrder=null;}emit('war',2,null,`${a.name} is ordered to hold and await the crown's word.`);}
  else if(cmd==='release'){a.hold=false;a.nextOrder=null;emit('war',2,null,`${a.name} is given leave to make war as its captains see fit.`);}
  else if(cmd==='disband'){if(a.state==='battle')return;disbandArmy(a);hideInspect();

function armyActsHTML(a){

function cbtn(cmd,arg,label,cost,why,desc){

function sovAmbition(key){
  const P=W.player;if(!P||!P.on||P.amb[key])return;
  const a=AMBITIONS.find(x=>x[0]===key);if(!a)return;
  P.amb[key]=day();P.legacy+=a[2];saveBest(P.legacy);
  emit('crown',5,W.capital.pos,`Ambition fulfilled — ${a[1].split(' — ')[0]}. The heralds add ${a[2]} to the legacy of ${W.houses[0].name}.`);
}
function dynastyChanged(oldName){
  W.dynasty=(W.dynasty||1)+1;
  const P=W.player;if(!P||!P.on)return;
  const yrs=Math.floor((day()-P.since)/360),L=P.legacy;saveBest(L);
  petition({key:'fall',title:'Your line is broken',pos:W.capital.pos,days:90,ai:0,
    text:`The dynasty you guided${oldName?' ('+oldName+')':''} has lost the throne after ${yrs} year${yrs===1?'':'s'} of your rule, with a legacy of ${L}${bestLegacy()>L?' (best for this realm: '+bestLegacy()+')':''}. ${fullTitle(W.monarch)} now wears the crown.`,
    opts:[{label:`Rule on as ${W.houses[0].name}`,act:()=>{P.legacy=0;P.amb={};P.since=day();P.startPop=realmPop();P.peaceSince=day();}},
          {label:'Lay down the crown and return to the chronicle',act:()=>setSovereign(false)}]});
}
function tickSovereign(){
  const P=W.player;if(!P)return;
  if(W.petitions.length){
    if(!sovOn()){ // left Sovereign mode or watching: the council clears the table
      while(W.petitions.length){const p=W.petitions.shift();runPetition(p,aiPick(p));}
      afterPetition();
    }else if(day()>=W.petitions[0].due){
      const p=W.petitions.shift(),i=aiPick(p);
      emit('crown',3,null,`The crown is silent on “${p.title}”; the council decides: ${p.opts[i].label.replace(/^./,c=>c.toLowerCase())}.`);
      runPetition(p,i);afterPetition();
    }
  }
  if(!P.on)return;
  if(day()%360===0&&day()>P.since){P.legacy+=2;saveBest(P.legacy);}
  if(day()%10===0)for(const a of AMBITIONS)if(a[3]&&!P.amb[a[0]]&&a[3]())sovAmbition(a[0]);
  if(sovOn()&&!W.petitions.length&&chance('sim',0.004))courtDilemma();
}
function setSovereign(on){
  if(!W||!W.player||on===W.player.on)return;
  const P=W.player;P.on=on;
  document.body.classList.toggle('sov',on);
  if(on){
    if(document.body.classList.contains('watch'))toggleWatch();
    if(!P.started){P.started=true;P.since=day();P.startPop=realmPop();P.peaceSince=day();}
    markManual();
    const dr=document.getElementById('drawer');
    if(dr.classList.contains('closed'))toggleDrawer();
    selectTab('crown');
    emit('crown',4,W.capital.pos,`${fullTitle(W.monarch)} takes the reins of government in person. Decrees, petitions and the hosts of the crown now wait upon the royal word.`);
  }else{
    if(placeMode==='order'||placeMode==='charter')setPlaceMode(null);
    while(W.petitions.length){const p=W.petitions.shift();runPetition(p,aiPick(p));}
    afterPetition();
    buildDrawer(drawerTab);
  }
  renderPetition();updateHUD();if(inspTarget)showInspect(inspTarget);
}

function runCmd(cmd,arg){

    case 'pause-toggle':W.player.pause=!W.player.pause;break;
    case 'decree':runDecree(arg);break;
    case 'h-honour':case 'h-hostage':case 'h-match':case 'h-attaint':houseCmd(cmd.slice(2),+arg);break;
    case 'notable':{const n=notableById(+arg);if(n)showInspect({type:'notable',n});break;}
    case 'army':{const a=W.armies.find(x=>x.id===+arg);if(a){showInspect({type:'army',a});flyTo(a._rpos.x,a._rpos.z,420);markManual();}break;}
    case 's-relief':case 's-garrison':case 's-walls':case 's-seal':case 's-suppress':settlementCmd(cmd.slice(2),+arg);break;

  }
  uiDownAt=0;

}

  ['plague','Unleash plague',1],['fire','Start a great fire',1],['flood','Flood the river',0],
  ['drought','Declare a drought',0],['quake','Earthquake',1],['dragon','Wake the dragon',0],
  ['bandits','Raise a bandit camp',1],['assassinate','Assassinate the monarch',0],
  ['contest','Contest the succession',0],['marriage','Arrange a royal marriage',0],
  ['bless','Bless the harvest',0],['comet','Send a comet',0],['village','Found a village',1],
  ['gold','Grant 5,000 gold',0],['raze','Raze building',1]
];
const OVERLAYS=[['territory','Territories'],['trade','Trade'],['prosperity','Prosperity'],['plague','Plague'],['unrest','Unrest']];
let drawerTab='rates';
function selectTab(t){
  document.querySelectorAll('#dtabs .t').forEach(x=>x.classList.toggle('on',x.dataset.t===t));
  buildDrawer(t);
}
function toggleDrawer(){
  const d=document.getElementById('drawer');d.classList.toggle('closed');
  const closed=d.classList.contains('closed');
  document.body.classList.toggle('drawerclosed',closed);
  document.getElementById('drawertoggle').textContent=closed?'▸':'◂';
}
function buildDrawer(tab){
  const body=document.getElementById('dbody');
  body.innerHTML='';body._h='';drawerTab=tab;
  const sealed=sovOn();
  if(tab==='crown'){setHTML(body,crownPanelHTML());return;}
  if(tab==='rates'){
    if(sealed)body.insertAdjacentHTML('beforeend','<div class="note">Providence’s dials are sealed while you rule. The tax rate is set from the Crown tab.</div>');
    for(const[key,label,min,max,def]of RATES){
      const row=document.createElement('div');row.className='slrow';
      row.innerHTML=`<label><span>${label}</span><b id="rv_${key}">${MOD[key]}</b></label>`;
      const inp=document.createElement('input');inp.type='range';
      inp.min=min;inp.max=max;inp.step=key==='tax'?1:(max-min)/100;inp.value=MOD[key];inp.disabled=sealed;
      inp.addEventListener('input',()=>{MOD[key]=+inp.value;
        document.getElementById('rv_'+key).textContent=key==='tax'?Math.round(MOD[key])+'%':('×'+(+inp.value).toFixed(2));});
      row.appendChild(inp);body.appendChild(row);
      document.getElementById('rv_'+key).textContent=key==='tax'?Math.round(MOD[key])+'%':('×'+(+MOD[key]).toFixed(2));
    }
    const mr=document.createElement('div');mr.className='slrow';
    mr.innerHTML=`<label><span>Myth</span><b id="rv_myth">${['Off','Low','High'][MOD.myth]}</b></label>`;
    const mi=document.createElement('input');mi.type='range';mi.min=0;mi.max=2;mi.step=1;mi.value=MOD.myth;mi.disabled=sealed;
    mi.addEventListener('input',()=>{MOD.myth=+mi.value;document.getElementById('rv_myth').textContent=['Off','Low','High'][MOD.myth];});
    mr.appendChild(mi);body.appendChild(mr);
  }else if(tab==='acts'){
    if(sealed)body.insertAdjacentHTML('beforeend','<div class="note">Acts of Providence are withheld while you rule — lay down the crown to wield them again.</div>');
    for(const[key,label,place]of ACTS){
      const b=document.createElement('button');b.className='actbtn';b.disabled=sealed;if(sealed)b.style.opacity=.45;
      b.innerHTML=label+(place?'<span class="tg">⌖</span>':'');
      b.addEventListener('click',()=>{
        if(sovOn())return;
        if(place)setPlaceMode(key,null,label+': click the map — Esc to cancel');
        else doAct(key,{x:W.capital.pos.x,z:W.capital.pos.z});
      });
      body.appendChild(b);
    }
  }else if(tab==='over'){
    for(const[key,label]of OVERLAYS){
      const b=document.createElement('button');b.className='ovbtn'+(overlayMode===key?' on':'');
      b.dataset.o=key;b.textContent=label;
      b.addEventListener('click',()=>setOverlay(key));
      body.appendChild(b);
    }
  }else if(tab==='world'){
    body.innerHTML=`
      <div class="wrow">Seed<br><input type="text" id="seedin" value="${SEED}"></div>
      <button class="wbtn" id="btnreforge">Reforge the realm</button>
      <button class="wbtn" id="btnmap">Parchment map (M)</button>
      <button class="wbtn" id="btndaycycle">Day/night cycle: ${dayCycleOn?'On':'Off'}</button>
      <button class="wbtn" id="btnlabels">Toggle labels</button>
      <button class="wbtn" id="btnwatch">Watch mode (C)</button>
      <div class="dhead">The Great Houses</div><div id="housepanel"></div>
      <div class="dhead">Line of Succession</div><div id="succpanel"></div>`;
    document.getElementById('btnreforge').addEventListener('click',()=>{
      const v=parseInt(document.getElementById('seedin').value,10);
      location.hash='#s='+((isNaN(v)?Math.floor(Math.random()*1e9):v)>>>0);
      location.reload();
    });
    document.getElementById('btnmap').addEventListener('click',toggleMap);
    document.getElementById('btndaycycle').addEventListener('click',e=>{
      dayCycleOn=!dayCycleOn;
      e.target.textContent='Day/night cycle: '+(dayCycleOn?'On':'Off');
    });
    document.getElementById('btnlabels').addEventListener('click',()=>{G.labelsOn=!G.labelsOn;});
    document.getElementById('btnwatch').addEventListener('click',toggleWatch);
    refreshHousePanel();
  }
}
function refreshHousePanel(){
  const hp=document.getElementById('housepanel');if(!hp)return;
  let h='';
  W.houses.forEach((house,hi)=>{
    if(hi===0)return;
    h+=`<div class="houserow pk${house.exiled?' exiled':''}" data-cmd="notable" data-arg="${house.head||''}" title="Inspect the head of the house"><img src="${sigURL(hi)}">
      <span class="hname" style="flex:0 0 92px;overflow:hidden;white-space:nowrap;">${esc(house.name.replace('House ',''))}</span>
      <div class="hbar"><div style="width:${house.exiled?0:Math.round(house.loyalty)}%"></div></div></div>`;
  });
  setHTML(hp,h);
  const sp=document.getElementById('succpanel');
  if(sp){
    const m=W.monarch;let s='';
    if(m){
      const heirs=m.heirs.map(notableById).filter(n=>n&&n.alive).sort((a,b)=>b.age-a.age);
      s+=`<div class="succline pk" data-cmd="notable" data-arg="${m.id}">♛ ${esc(fullTitle(m))}, age ${ageOf(m)}</div>`;
      if(heirs.length)heirs.slice(0,4).forEach((n,i)=>{s+=`<div class="succline pk" data-cmd="notable" data-arg="${n.id}">${i+1}. ${esc(fullTitle(n))}, age ${ageOf(n)}</div>`;});
      else s+='<div class="succline" style="color:var(--red)">No heir of the body — the succession is uncertain.</div>';
    }
    setHTML(sp,s);
  }
}
function initUI(){
  document.getElementById('chrontitle').textContent='The Annals of '+W.name;
  document.getElementById('loadtitle').textContent='The Annals of '+W.name;
  document.title='The Annals of '+W.name;
  document.getElementById('crownsig').src=sigURL(0);
  document.getElementById('crownname').textContent=fullTitle(W.monarch);
  document.querySelectorAll('#timec button').forEach(b=>b.addEventListener('click',()=>setSpeed(+b.dataset.s)));
  document.querySelectorAll('#dtabs .t').forEach(t=>t.addEventListener('click',()=>selectTab(t.dataset.t)));
  buildDrawer('rates');
  document.getElementById('drawertoggle').addEventListener('click',toggleDrawer);
  // one delegated handler for every data-cmd control (crown panel, inspector, house & succession rows)
  const cmdClick=e=>{const t=e.target.closest('[data-cmd]');if(!t||t.disabled)return;runCmd(t.dataset.cmd,t.dataset.arg);};
  document.getElementById('dbody').addEventListener('click',cmdClick);
  document.getElementById('inspacts').addEventListener('click',cmdClick);
  document.getElementById('dbody').addEventListener('input',e=>{
    if(e.target.id!=='sovtax')return;
    MOD.tax=+e.target.value;const lb=e.target.parentNode.querySelector('b');if(lb)lb.textContent=Math.round(MOD.tax)+'%';
  });
  document.addEventListener('pointerdown',e=>{if(!e.target.closest('#gl'))uiDownAt=performance.now();},true);
  document.addEventListener('pointerup',()=>{setTimeout(()=>{uiDownAt=0;},0);},true);
  document.getElementById('petition').addEventListener('click',e=>{
    const b=e.target.closest('[data-pi]');if(b&&!b.disabled){answerPetition(+b.dataset.pi);return;}
    if(e.target.closest('[data-pv]')){const p=W.petitions[0];if(p&&p.pos){markManual();flyTo(p.pos.x,p.pos.z,480);}}
  });
  document.getElementById('rulebtn').addEventListener('click',()=>setSovereign(!sovOn()));
  const chron=document.getElementById('chron');
  const setChronMin=on=>{chron.classList.toggle('min',on);document.getElementById('chronmin').textContent=on?'▸':'▾';};
  document.getElementById('chronhead').addEventListener('click',()=>setChronMin(!chron.classList.contains('min')));
  if(innerWidth<760){setChronMin(true);toggleDrawer();} // small screens start with the map clear
  document.querySelectorAll('#chronfilters .f').forEach(f=>f.addEventListener('click',()=>{
    document.querySelectorAll('#chronfilters .f').forEach(x=>x.classList.toggle('on',x===f));
    chronFilter=f.dataset.f;
    document.querySelectorAll('.centry').forEach(e=>{e.style.display=(chronFilter==='all'||e.dataset.cat===chronFilter)?'':'none';});
  }));
  document.getElementById('btnexport').addEventListener('click',()=>{
    const head=`THE ANNALS OF ${W.name.toUpperCase()}\nset down by the chroniclers · seed ${SEED}\n\n`;
    const blob=new Blob([head+allLines.join('\n')],{type:'text/plain'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download='annals-of-'+W.name.toLowerCase()+'.txt';a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  });
  document.getElementById('btnshare').addEventListener('click',()=>{
    const url=location.href.split('#')[0]+'#s='+SEED; // (origin is "null" on file://)
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).then(
      ()=>{document.getElementById('btnshare').textContent='Copied!';setTimeout(()=>document.getElementById('btnshare').textContent='Copy share link',1400);},
      ()=>prompt('Share this realm:',url));
  });
  document.getElementById('inspx').addEventListener('click',hideInspect);
  G.labelsOn=true;
  setInterval(()=>{if(document.getElementById('housepanel')&&!uiBusy())refreshHousePanel();},4000);
  window.addEventListener('hashchange',()=>{const m=location.hash.match(/s=(\d+)/);if(m&&(parseInt(m[1],10)>>>0)!==SEED)location.reload();});
}
/* =========================================================================
   PARCHMENT MAP — the realm drawn as the chroniclers would draw it
   ========================================================================= */
function buildMapCanvas(){
  const S=1000,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),px=S/GRID;
  const mx=(x)=>(x+SIZE/2)/SIZE*S,mz=(z)=>(z+SIZE/2)/SIZE*S;
  const rng=layoutRng(777),rr=()=>rng();
  /* parchment with a little foxing */
  g.fillStyle='#E9DCC3';g.fillRect(0,0,S,S);
  for(let i=0;i<2600;i++){g.fillStyle=`rgba(${120+rr()*40|0},${90+rr()*30|0},${50+rr()*20|0},${rr()*0.05})`;g.beginPath();g.arc(rr()*S,rr()*S,1+rr()*7,0,7);g.fill();}
  /* land tint + hill-shading, drawn per cell into a small image and scaled up smoothly */
  const img=document.createElement('canvas');img.width=img.height=GRID;const ig=img.getContext('2d'),id=ig.createImageData(GRID,GRID);
  const tint={[B.MARSH]:[169,181,143],[B.MEADOW]:[214,210,168],[B.FARM]:[222,210,160],[B.FOREST]:[176,190,146],[B.PINE]:[160,178,146],[B.ROCK]:[196,186,166],[B.SNOW]:[236,232,222]};
  for(let cz=0;cz<GRID;cz++)for(let cx=0;cx<GRID;cx++){
    const i=cIdx(cx,cz),o=i*4;
    if(W.water[i]===1){ // sea: paler near the shore
      let near=9;for(let r=1;r<=8&&near===9;r++)for(let d=-r;d<=r&&near===9;d++)for(const[a,b]of[[d,-r],[d,r],[-r,d],[r,d]])if(inB(cx+a,cz+b)&&!W.water[cIdx(cx+a,cz+b)]){near=r;break;}
      const t=clamp(near/8,0,1);id.data[o]=lerp(176,138,t);id.data[o+1]=lerp(198,166,t);id.data[o+2]=lerp(200,182,t);id.data[o+3]=255;continue;
    }
    const col=tint[W.biome[i]]||tint[B.MEADOW];
    const hx=W.h[cIdx(Math.max(0,cx-1),cz)]-W.h[cIdx(Math.min(GRID-1,cx+1),cz)],hz=W.h[cIdx(cx,Math.max(0,cz-1))]-W.h[cIdx(cx,Math.min(GRID-1,cz+1))];
    const sh=clamp(1+(hx+hz)*0.006,0.72,1.18); // light from the north-west
    id.data[o]=clamp(col[0]*sh,0,255);id.data[o+1]=clamp(col[1]*sh,0,255);id.data[o+2]=clamp(col[2]*sh*0.98,0,255);id.data[o+3]=255;
  }
  ig.putImageData(id,0,0);
  g.imageSmoothingEnabled=true;g.globalAlpha=0.85;g.drawImage(img,0,0,S,S);g.globalAlpha=1;
  /* coastline */
  g.strokeStyle='rgba(60,80,95,0.55)';g.lineWidth=1.2;
  for(let cz=1;cz<GRID-1;cz++)for(let cx=1;cx<GRID-1;cx++){
    const i=cIdx(cx,cz);if(W.water[i]!==1)continue;
    if(!W.water[cIdx(cx+1,cz)]){g.beginPath();g.moveTo((cx+0.5)*px,cz*px);g.lineTo((cx+0.5)*px,(cz+1)*px);g.stroke();}
    if(!W.water[cIdx(cx-1,cz)]){g.beginPath();g.moveTo((cx-0.5)*px,cz*px);g.lineTo((cx-0.5)*px,(cz+1)*px);g.stroke();}
    if(!W.water[cIdx(cx,cz+1)]){g.beginPath();g.moveTo(cx*px,(cz+0.5)*px);g.lineTo((cx+1)*px,(cz+0.5)*px);g.stroke();}
    if(!W.water[cIdx(cx,cz-1)]){g.beginPath();g.moveTo(cx*px,(cz-0.5)*px);g.lineTo((cx+1)*px,(cz-0.5)*px);g.stroke();}
  }
  /* territories: soft washes in each house's colour */
  for(const s of W.settlements){
    const h=W.houses[s.owner];if(!h)continue;
    const col='#'+h.sigilHue[0].toString(16).padStart(6,'0'),R=(s.kind==='capital'?800:s.kind==='town'?600:380)/SIZE*S;
    const gr=g.createRadialGradient(mx(s.pos.x),mz(s.pos.z),R*0.2,mx(s.pos.x),mz(s.pos.z),R);
    gr.addColorStop(0,col+'33');gr.addColorStop(1,col+'00');g.fillStyle=gr;g.beginPath();g.arc(mx(s.pos.x),mz(s.pos.z),R,0,7);g.fill();
  }
  /* mountains and forests as the old map-makers drew them */
  const glyphs=[];
  for(let cz=1;cz<GRID-1;cz+=2)for(let cx=1;cx<GRID-1;cx+=2){
    const jx=cx+(rr()-0.5)*1.6,jz=cz+(rr()-0.5)*1.6,i=cIdx(Math.round(jx),Math.round(jz)),bio=W.biome[i];
    if(W.water[i])continue;
    const nearTown=W.settlements.some(s=>dist2d(cellX(jx),cellZ(jz),s.pos.x,s.pos.z)<(s.wallR||s.radius)+60);
    if(nearTown)continue;
    if((bio===B.ROCK||bio===B.SNOW)&&(cx+cz)%4===0)glyphs.push({t:'m',x:jx*px,y:jz*px,s:bio===B.SNOW?1.35:1});
    else if(bio===B.FOREST&&rr()<0.8)glyphs.push({t:'d',x:jx*px,y:jz*px,s:0.8+rr()*0.4});
    else if(bio===B.PINE&&rr()<0.8)glyphs.push({t:'p',x:jx*px,y:jz*px,s:0.8+rr()*0.4});
  }
  glyphs.sort((a,b)=>a.y-b.y);
  for(const o of glyphs){
    const x=o.x,y=o.y,k=o.s;
    if(o.t==='m'){
      const w=11*k,h=10*k;
      g.fillStyle='#e8dcc2';g.beginPath();g.moveTo(x-w,y+2);g.lineTo(x,y-h);g.lineTo(x+w,y+2);g.closePath();g.fill();
      g.fillStyle='rgba(90,70,50,0.35)';g.beginPath();g.moveTo(x,y-h);g.lineTo(x+w,y+2);g.lineTo(x+w*0.15,y+2);g.closePath();g.fill();
      g.strokeStyle='#5a4a3a';g.lineWidth=1.1;g.beginPath();g.moveTo(x-w,y+2);g.lineTo(x,y-h);g.lineTo(x+w,y+2);g.stroke();
      if(k>1.2){g.fillStyle='#fbf7ee';g.beginPath();g.moveTo(x-w*0.3,y-h*0.7);g.lineTo(x,y-h);g.lineTo(x+w*0.3,y-h*0.7);g.closePath();g.fill();}
    }else if(o.t==='d'){
      g.strokeStyle='#5a4a3a';g.lineWidth=1;g.beginPath();g.moveTo(x,y+3*k);g.lineTo(x,y);g.stroke();
      g.fillStyle='#8fa476';g.beginPath();g.arc(x,y-2*k,3.4*k,0,7);g.fill();g.strokeStyle='#4f5a3c';g.lineWidth=0.8;g.stroke();
    }else{
      g.fillStyle='#6f8d6d';g.strokeStyle='#3f4f3a';g.lineWidth=0.8;
      g.beginPath();g.moveTo(x,y-6*k);g.lineTo(x+3.2*k,y+2*k);g.lineTo(x-3.2*k,y+2*k);g.closePath();g.fill();g.stroke();
    }
  }
  /* rivers: smooth, swelling toward the mouth */
  g.lineCap='round';g.lineJoin='round';
  for(const st of riverStrips()){
    const p=st.pts;
    for(let k=1;k<p.length;k++){
      g.strokeStyle='#4f7892';g.lineWidth=Math.max(1.1,st.hw[k]*2*S/SIZE*0.9);
      g.beginPath();g.moveTo(mx(p[k-1].x),mz(p[k-1].z));g.lineTo(mx(p[k].x),mz(p[k].z));g.stroke();
    }
  }
  /* roads: the king's roads as double-lined tracks */
  for(const r of W.roads){
    const p=resample(r.drawn||r.path,20);if(p.length<2)continue;
    const line=()=>{g.beginPath();g.moveTo(mx(p[0].x),mz(p[0].z));for(const q of p)g.lineTo(mx(q.x),mz(q.z));g.stroke();};
    g.strokeStyle='#6d5433';g.lineWidth=3.2;g.setLineDash([]);line();
    g.strokeStyle='#ead9b6';g.lineWidth=1.6;line();
  }
  /* the dragon's peak */
  if(W.dragon&&!W.dragon.dead&&MOD.myth>=1){
    const x=mx(W.dragon.lair.x),y=mz(W.dragon.lair.z);
    g.fillStyle='#8a2f22';g.font='italic 14px "IM Fell English",Georgia,serif';g.textAlign='center';
    g.strokeStyle='rgba(233,220,195,0.9)';g.lineWidth=3;g.strokeText('here dwells '+W.dragon.name,x,y+22);g.fillText('here dwells '+W.dragon.name,x,y+22);
    g.font='18px serif';g.fillText('🐉',x,y+4);
  }
  /* settlements: walled towns, a castle for the capital, clustered roofs for villages */
  g.textAlign='center';
  for(const s of W.settlements){
    const x=mx(s.pos.x),y=mz(s.pos.z),rW=(s.wallR||s.radius)/SIZE*S;
    if(s.walls>0){g.strokeStyle='#3b3029';g.lineWidth=s.walls>=2?2.4:1.4;g.setLineDash(s.walls>=2?[]:[2,2]);g.beginPath();g.arc(x,y,rW,0,7);g.stroke();g.setLineDash([]);}
    const n=s.kind==='capital'?9:s.kind==='town'?6:3,rr2=s.kind==='village'?3:rW*0.55;
    for(let k=0;k<n;k++){ // little roofs
      const a=k/n*Math.PI*2+0.4,hx=x+Math.cos(a)*rr2*(k%2?0.55:1),hy=y+Math.sin(a)*rr2*(k%2?0.55:1);
      g.fillStyle='#b0674a';g.strokeStyle='#3b3029';g.lineWidth=0.8;
      g.beginPath();g.rect(hx-2.6,hy-1,5.2,3.6);g.fill();g.stroke();
      g.beginPath();g.moveTo(hx-3.2,hy-1);g.lineTo(hx,hy-3.8);g.lineTo(hx+3.2,hy-1);g.closePath();g.fillStyle='#7d4632';g.fill();g.stroke();
    }
    if(s.kind==='capital'){ // a castle
      g.fillStyle='#d8cfbd';g.strokeStyle='#2B2320';g.lineWidth=1.2;
      g.beginPath();g.rect(x-8,y-9,16,11);g.fill();g.stroke();
      for(const tx of[-9,5]){g.beginPath();g.rect(x+tx,y-14,4,16);g.fill();g.stroke();}
      g.fillStyle='#8a2f22';g.beginPath();g.moveTo(x-1,y-9);g.lineTo(x-1,y-19);g.lineTo(x+6,y-16.5);g.lineTo(x-1,y-14);g.fill();
    }else if(s.kind==='town'){
      g.fillStyle='#d8cfbd';g.strokeStyle='#2B2320';g.lineWidth=1;g.beginPath();g.rect(x-2.5,y-10,5,11);g.fill();g.stroke();
      g.beginPath();g.moveTo(x-3.5,y-10);g.lineTo(x,y-15);g.lineTo(x+3.5,y-10);g.closePath();g.fillStyle='#5a5f6b';g.fill();g.stroke();
    }
    g.font=(s.kind==='capital'?'bold 20px':s.kind==='town'?'17px':'14px')+' "IM Fell English",Georgia,serif';
    const ly=y-rW-6-(s.kind==='capital'?8:0);
    g.strokeStyle='rgba(233,220,195,0.92)';g.lineWidth=4;g.strokeText(s.name,x,ly);
    g.fillStyle='#2B2320';g.fillText(s.name,x,ly);
  }
  /* compass rose */
  {const cx=S-78,cy=S-92,R=38;
    g.save();g.translate(cx,cy);
    g.strokeStyle='#5a4a3a';g.lineWidth=1;g.beginPath();g.arc(0,0,R*0.72,0,7);g.stroke();g.beginPath();g.arc(0,0,R*0.62,0,7);g.stroke();
    for(let k=0;k<8;k++){const a=k*Math.PI/4,L=k%2?R*0.55:R;
      g.save();g.rotate(a);
      g.fillStyle=k%2?'#c9b58f':'#2B2320';g.beginPath();g.moveTo(0,-L);g.lineTo(L*0.13,0);g.lineTo(0,L*0.1);g.closePath();g.fill();
      g.fillStyle=k%2?'#e6d8ba':'#8a2f22';g.beginPath();g.moveTo(0,-L);g.lineTo(-L*0.13,0);g.lineTo(0,L*0.1);g.closePath();g.fill();
      g.restore();}
    g.fillStyle='#2B2320';g.font='bold 15px "IM Fell English",Georgia,serif';g.textAlign='center';g.fillText('N',0,-R-6);
    g.restore();}
  /* scale bar */
  {const x0=40,y0=S-44,m=1000/SIZE*S;
    g.fillStyle='#2B2320';for(let k=0;k<2;k++){g.fillStyle=k%2?'#E9DCC3':'#2B2320';g.fillRect(x0+k*m,y0,m,5);}
    g.strokeStyle='#2B2320';g.lineWidth=1;g.strokeRect(x0,y0,2*m,5);
    g.font='italic 12px "IM Fell English",Georgia,serif';g.textAlign='left';g.fillStyle='#2B2320';g.fillText('two leagues',x0,y0-5);}
  /* frame and cartouche */
  g.strokeStyle='#2B2320';g.lineWidth=4;g.strokeRect(8,8,S-16,S-16);
  g.lineWidth=1;g.strokeRect(16,16,S-32,S-32);
  g.strokeStyle='#8a2f22';g.lineWidth=0.8;g.strokeRect(20,20,S-40,S-40);
  const tw=420;g.fillStyle='#E9DCC3';g.strokeStyle='#2B2320';g.lineWidth=1.5;
  g.beginPath();g.moveTo(S/2-tw/2,14);g.lineTo(S/2+tw/2,14);g.lineTo(S/2+tw/2-14,34);g.lineTo(S/2+tw/2,54);g.lineTo(S/2-tw/2,54);g.lineTo(S/2-tw/2+14,34);g.closePath();g.fill();g.stroke();
  g.fillStyle='#2B2320';g.font='26px "IM Fell English",Georgia,serif';g.textAlign='center';
  g.fillText('The Realm of '+W.name,S/2,43);
  g.font='italic 12px "IM Fell English",Georgia,serif';
  g.fillText('as the chroniclers know it · seed '+SEED,S/2,S-24);
  return c;
}

/* =========================================================================
   PER-FRAME WORLD ANIMATION
   ========================================================================= */
function polyPos(poly,f){
  if(!poly||!poly.length)return null;
  if(poly.length===1)return{x:poly[0].x,z:poly[0].z};
  f=clamp(f,0,1);
  const total=poly._len||(poly._len=poly.reduce((t,p,i)=>i?t+dist2d(poly[i-1].x,poly[i-1].z,p.x,p.z):0,0));
  let want=f*total,acc=0;
  for(let i=1;i<poly.length;i++){
    const seg=dist2d(poly[i-1].x,poly[i-1].z,poly[i].x,poly[i].z);
    if(acc+seg>=want){
      const t=seg>0?(want-acc)/seg:0;
      return{x:lerp(poly[i-1].x,poly[i].x,t),z:lerp(poly[i-1].z,poly[i].z,t),
        y:poly[i].y!==undefined?lerp(poly[i-1].y??poly[i].y,poly[i].y,t):undefined,
        dir:Math.atan2(poly[i].z-poly[i-1].z,poly[i].x-poly[i-1].x)};
    }
    acc+=seg;
  }
  const last=poly[poly.length-1];
  return{x:last.x,z:last.z,y:last.y};
}
let smokeIdx=0,flameIdx=0;
function spawnSmoke(x,y,z,dark){
  const p=G.smokeData[smokeIdx];smokeIdx=(smokeIdx+1)%G.smokeData.length;
  p.x=x+(Math.random()-0.5)*3;p.y=y;p.z=z+(Math.random()-0.5)*3;p.vy=3+Math.random()*3;p.life=4+Math.random()*4;p.dark=dark;
}
function spawnFlame(x,y,z){
  const p=G.flameData[flameIdx];flameIdx=(flameIdx+1)%G.flameData.length;
  p.x=x+(Math.random()-0.5)*6;p.y=y+Math.random()*4;p.z=z+(Math.random()-0.5)*6;p.life=0.5+Math.random()*0.8;
}
let dayCycleOn=false; // steady daylight by default — the cycle strobes at high sim speeds
function currentDayF(){
  if(!dayCycleOn)return 0.42; // pleasant late morning
  // compress night to ~20% of the cycle so the documentary stays watchable
  const t=(W.visT||0)%1;
  return t<0.8?0.25+(t/0.8)*0.5:0.75+((t-0.8)/0.2)*0.5;
}
function animateWorld(dt,now){
  const dayF=currentDayF();
  const simDay=W.clock.day;
  /* --- sun / moon / sky --- */
  const el2=Math.sin((dayF-0.25)*2*Math.PI); // sun elevation: dawn .25, noon .5, dusk .75
  const sunDir=new THREE.Vector3(Math.cos(dayF*Math.PI*2)*0.8,el2,Math.sin(dayF*Math.PI*2)*0.55).normalize();
  const daylight=clamp(el2*1.6+0.12,0.14,1); // nights stay readable, never pitch black
  const eclipseF=W.eclipse>0?0.12:1;
  const overcastF=(W.weather.state==='clear')?1:(W.weather.state==='overcast'?0.72:0.5);
  G.sun.intensity=0.98*daylight*eclipseF*overcastF;
  G.sun.position.copy(sunDir).multiplyScalar(2600).add(cam.cur.focus);
  G.sun.target.position.copy(cam.cur.focus);
  G.sun.castShadow=cam.cur.dist<1600&&daylight>0.05;
  const sc=G.sun.shadow.camera,ext=clamp(cam.cur.dist*0.9,220,1200);
  sc.left=-ext;sc.right=ext;sc.top=ext;sc.bottom=-ext;sc.updateProjectionMatrix();
  G.hemi.intensity=0.16+0.3*daylight*eclipseF;
  G.amb.intensity=0.1+0.06*daylight;
  G.sunDisc.position.copy(sunDir).multiplyScalar(11800).add(camera.position);
  G.sunDisc.visible=el2>-0.06;
  G.moonDisc.position.copy(sunDir).multiplyScalar(-11800).add(camera.position);
  G.moonDisc.visible=el2<0.1;
  // sky palette
  const night=new THREE.Color(0x0d1526),nightB=new THREE.Color(0x141c30);
  const dayT=new THREE.Color(0x7fb2dd),dayB=new THREE.Color(0xd7e3e8);
  const duskT=new THREE.Color(0x4a5a8a),duskB=new THREE.Color(0xe89a5a);
  let top,bot;
  const tw=clamp(Math.abs(el2)/0.22,0,1);
  if(el2>0){top=duskT.clone().lerp(dayT,tw);bot=duskB.clone().lerp(dayB,tw);}
  else{top=duskT.clone().lerp(night,tw);bot=duskB.clone().lerp(nightB,tw);}
  if(W.weather.state!=='clear'&&el2>0){top.multiplyScalar(overcastF*0.9);bot.multiplyScalar(overcastF*0.95);}
  if(W.eclipse>0){top.multiplyScalar(0.25);bot.multiplyScalar(0.3);}
  G.skyU.top.value.copy(top);G.skyU.bot.value.copy(bot);
  G.skyU.sunPos.value.copy(sunDir);
  G.sky.position.copy(camera.position);G.stars.position.copy(camera.position); // dome follows the eye
  scene.fog.color.copy(bot).multiplyScalar(0.96);
  const fogBase=W.weather.state==='rain'||W.weather.state==='snow'?1400:2600;
  const fogNear=Math.max(fogBase,cam.cur.dist*1.5); // don't wash out the map view from altitude
  scene.fog.near=fogNear;scene.fog.far=fogNear*4.4;
  G.stars.material.opacity=clamp(-el2*4,0,0.9);
  // night windows & torches
  const nightF=clamp(-el2*5,0,1);
  G.bodies.material.emissive=G.bodies.material.emissive||new THREE.Color();
  G.bodies.material.emissive.setRGB(0.22*nightF,0.13*nightF,0.03*nightF);
  if(nightF>0.3){
    let ti=0,nearest=null,nd=1e18;
    for(const s of W.settlements){const d=dist2d(camera.position.x,camera.position.z,s.pos.x,s.pos.z);if(d<nd){nd=d;nearest=s;}}
    if(nearest&&nd<800){
      for(const b of nearest.buildings){
        if(ti>=G.torches.length)break;
        if(b.district==='market'&&b.state==='sound'){
          const t=G.torches[ti++];t.position.set(b.x,b.y+5,b.z);t.intensity=1.4*nightF;
        }
      }
    }
    for(let i=ti;i<G.torches.length;i++)G.torches[i].intensity=0;
  }else G.torches.forEach(t=>t.intensity=0);
  /* --- seasons --- */
  updateTerrainColors(seasonIdx(),(simDay%90)/90);
  /* --- water --- */
  if(G.rivers){G.rivers.position.y=(W.flooding>0?2.6:0)+Math.sin(now*1.7)*0.15;}
  if(G.sea)G.sea.position.y=SEA+0.5+Math.sin(now*0.9)*0.3;
  for(const wh of G.wheels)wh.rotation.x+=dt*1.4;
  /* --- weather particles --- */
  const raining=W.weather.state==='rain'||W.weather.state==='storm';
  const snowing=W.weather.state==='snow';
  G.rain.visible=raining;G.snow.visible=snowing;
  if(raining||snowing){
    const P=(raining?G.rain:G.snow).geometry.attributes.position;
    const speed=raining?300:40;
    // the column is stored relative to a base just under the eye — at world y 0..500 it used
    // to fall below the highlands and far beneath the camera at map altitude
    const base=Math.max(hAt(camera.position.x,camera.position.z),camera.position.y-450);
    const pd=(raining?G.rain:G.snow)._rel||((raining?G.rain:G.snow)._rel=new Float32Array(P.count).map(()=>Math.random()*500));
    for(let i=0;i<P.count;i++){
      let y=pd[i]-speed*dt*(0.7+((i*13)%10)/18);
      if(y<0)y=420+Math.random()*80;
      pd[i]=y;
      P.setXYZ(i,camera.position.x+((i*127)%900)-450+(snowing?Math.sin(now+i)*14:0),base+y,
        camera.position.z+((i*311)%900)-450);
    }
    P.needsUpdate=true;
  }
  if(W.weather.state==='storm'&&Math.random()<dt*0.25){G.amb.intensity=1.6;setTimeout(()=>G.amb.intensity=0.25,90);}
  /* --- smoke & flame --- */
  {
    // chimney smoke near camera, pyres, burning buildings
    let nearest=null,nd=1e18;
    for(const s of W.settlements){const d=dist2d(camera.position.x,camera.position.z,s.pos.x,s.pos.z);if(d<nd){nd=d;nearest=s;}}
    if(nearest&&nd<1500&&Math.random()<dt*24){
      const b=nearest.buildings[Math.floor(Math.random()*nearest.buildings.length)];
      if(b&&b.state==='sound')spawnSmoke(b.x,b.y+b.h*1.6,b.z,false);
      if(nearest.pyres&&Math.random()<0.5)spawnSmoke(nearest.pos.x+30,nearest.pos.y+6,nearest.pos.z,true);
    }
    for(const s of W.settlements)for(const b of s.fires){
      if(Math.random()<dt*20){spawnFlame(b.x,b.y+3,b.z);spawnSmoke(b.x,b.y+b.h+4,b.z,true);}
    }
    if(W.dragon&&W.dragon.state==='raiding'&&G.dragonMesh.visible&&Math.random()<dt*10)
      spawnSmoke(G.dragonMesh.position.x,G.dragonMesh.position.y-3,G.dragonMesh.position.z,true);
    const sp=G.smoke.geometry.attributes.position;
    G.smokeData.forEach((p,i)=>{
      if(p.life>0){p.life-=dt;p.y+=p.vy*dt;p.x+=Math.cos(W.weather.wind)*dt*4;p.z+=Math.sin(W.weather.wind)*dt*4;
        sp.setXYZ(i,p.x,p.y,p.z);}
      else sp.setXYZ(i,0,-999,0);
    });
    sp.needsUpdate=true;
    const fp=G.flames.geometry.attributes.position;
    G.flameData.forEach((p,i)=>{
      if(p.life>0){p.life-=dt;p.y+=dt*6;fp.setXYZ(i,p.x,p.y,p.z);}
      else fp.setXYZ(i,0,-999,0);
    });
    fp.needsUpdate=true;
  }
  /* --- comet --- */
  if(W.comet&&simDay<W.comet.start+12){
    const f=(simDay-W.comet.start)/12;
    G.comet.visible=true;
    const a=f*Math.PI;
    G.comet.position.set(camera.position.x-Math.cos(a)*9000,3000+Math.sin(a)*4000,camera.position.z-7000+f*3000);
    G.comet.lookAt(G.comet.position.x+1000,G.comet.position.y+400,G.comet.position.z);
  }else G.comet.visible=false;
  /* --- caravans & cogs --- */
  let ci=0,cogI=0,dotI=0;
  const unitScale=clamp(cam.cur.dist*0.0035,1,6); // keep traffic legible from altitude
  const showDots=cam.cur.dist>900;
  for(const c of W.caravans){
    const f=(simDay-c.departDay)/Math.max(0.01,c.arriveDay-c.departDay);
    const p=polyPos(c.poly,f);
    if(!p)continue;
    const y=c.sea?SEA+1:(c.river?hAt(p.x,p.z)+1.2:hAt(p.x,p.z)+1.0); // road surface or water line
    c._rpos={x:p.x,y:y+8,z:p.z};
    if(!c.proxy){
      c.proxy=new THREE.Mesh(new THREE.SphereGeometry(16,6,5),new THREE.MeshBasicMaterial({visible:false}));
      c.proxy.userData.pick={type:'caravan',c};scene.add(c.proxy);
    }
    c.proxy.position.set(p.x,y+6,p.z);
    if(c.sea||c.river){
      if(cogI<G.cogs.length){const g=G.cogs[cogI++];g.visible=true;g.position.set(p.x,y,p.z);g.rotation.y=-(p.dir||0);g.scale.setScalar(Math.min(unitScale,c.river?2:3));}
    }else if(ci<48){
      setInst(G.caravans,ci++,p.x,y,p.z,-(p.dir||0),unitScale,unitScale,unitScale);
    }
    if(showDots&&dotI<G.caravanDots.length){
      const sp=G.caravanDots[dotI++];
      sp.visible=true;sp.position.set(p.x,y+14,p.z);
      const ds=clamp(camera.position.distanceTo(sp.position)*0.01,8,40);
      sp.scale.set(ds,ds,1);
    }
  }
  for(let i=ci;i<48;i++)setInst(G.caravans,i,0,-500,0,0,1,1,1);
  for(let i=cogI;i<G.cogs.length;i++)G.cogs[i].visible=false;
  for(let i=dotI;i<G.caravanDots.length;i++)G.caravanDots[i].visible=false;
  G.caravans.instanceMatrix.needsUpdate=true;
  /* --- armies --- */
  let si2=0;
  for(const a of W.armies){
    let p;
    if(a.state==='march'||a.state==='rout'){
      const f=(simDay-a.departDay)/Math.max(0.01,a.arriveDay-a.departDay);
      p=polyPos(a.poly,f);
    }else if(a.state==='battle'&&a.battlePos){ // fight where the hosts met, not back at their muster town
      const off=a.side==='crown'?-14:14;
      p={x:a.battlePos.x+off,z:a.battlePos.z+off*0.5,dir:a.side==='crown'?0.46:Math.PI+0.46};
    }
    if(!p){const s=W.settlements[a.at];p={x:s.pos.x+(a.state==='siege'?90:20),z:s.pos.z+40,dir:0};}
    const y=hAt(p.x,p.z);
    a._rpos={x:p.x,y:y+10,z:p.z};
    if(a.flag){
      const fs=clamp(cam.cur.dist*0.0011,1,4.5);
      a.flag.position.set(p.x,y+14+fs*3+Math.sin(now*2+a.id)*0.6,p.z);
      a.flag.quaternion.copy(camera.quaternion); // true billboard; Euler .y alone skews at most angles
      a.flag.scale.setScalar(fs);
    }
    // soldiers when near
    const dcam=dist2d(camera.position.x,camera.position.z,p.x,p.z);
    if(dcam<2400){
      const n=Math.min(90,Math.max(8,Math.round(a.strength/8)));
      const dir=p.dir||0;
      for(let k=0;k<n&&si2<900;k++){
        const col=k%6-2.5,row=Math.floor(k/6);
        const ox=Math.cos(dir)*(-row*3)+Math.cos(dir+Math.PI/2)*col*2.6;
        const oz=Math.sin(dir)*(-row*3)+Math.sin(dir+Math.PI/2)*col*2.6;
        let jx=0,jz=0;
        if(a.state==='battle'){jx=Math.sin(now*7+k*3)*1.4;jz=Math.cos(now*6+k*5)*1.4;}
        const sx=p.x+ox+jx,sz=p.z+oz+jz;
        const bob=a.state==='march'?Math.abs(Math.sin(now*8+k))*0.4:0;
        setInst(G.soldiers,si2,sx,hAt(sx,sz)+0.9+bob,sz,-dir+Math.PI/2,1,1,1);
        G.soldiers.setColorAt(si2,C1.setHex(W.houses[a.house].sigilHue[0]));
        si2++;
      }
    }
  }
  for(let i=si2;i<900;i++)setInst(G.soldiers,i,0,-500,0,0,1,1,1);
  G.soldiers.instanceMatrix.needsUpdate=true;
  if(G.soldiers.instanceColor)G.soldiers.instanceColor.needsUpdate=true;
  /* --- dragon --- */
  const d=W.dragon;
  if(d&&!d.dead){
    if(d.state==='raiding'||d.state==='returning'){
      const f=clamp((simDay-d.departDay)/Math.max(0.01,d.arriveDay-d.departDay),0,1);
      const p=polyPos(d.path,f);
      if(p){
        G.dragonMesh.visible=true;
        const py=p.y!==undefined?p.y:400;
        G.dragonMesh.position.set(p.x,py,p.z);
        G.dragonMesh.rotation.y=-(p.dir||0)+Math.PI/2;
        d._rpos={x:p.x,y:py,z:p.z};
        const flap=Math.sin(now*6)*0.7;
        G.dragonWings[0].rotation.z=flap;G.dragonWings[1].rotation.z=-flap;
      }
    }else if(d.state==='sleeping'&&cam.cur.dist<3000&&dist2d(camera.position.x,camera.position.z,d.lair.x,d.lair.z)<2200){
      G.dragonMesh.visible=true;
      G.dragonMesh.position.set(d.lair.x,d.lair.y+6,d.lair.z);
      d._rpos={x:d.lair.x,y:d.lair.y+6,z:d.lair.z};
      G.dragonWings[0].rotation.z=1.2;G.dragonWings[1].rotation.z=-1.2;
    }else G.dragonMesh.visible=false;
  }else if(G.dragonMesh)G.dragonMesh.visible=false;
  /* --- citizens (bubble band) --- */
  {
    let nearest=null,nd=1e18;
    for(const s of W.settlements){const dd=dist2d(camera.position.x,camera.position.z,s.pos.x,s.pos.z);if(dd<nd){nd=dd;nearest=s;}}
    if(nearest&&cam.cur.dist<200&&nd<nearest.radius+250){
      if(G.citList.length===0||G.citList[0].s!==nearest){
        G.citList=[];
        const n=Math.min(60,Math.round(nearest.pop/12)+6);
        for(let i=0;i<n;i++){
          const b=nearest.buildings[Math.floor(Math.random()*nearest.buildings.length)];
          if(!b)break;
          G.citList.push({s:nearest,x:b.x+4,z:b.z+4,dir:Math.random()*7,t:0});
        }
      }
      let k=0;
      for(const c of G.citList){
        c.t-=dt;
        if(c.t<=0){c.dir=Math.random()*Math.PI*2;c.t=1+Math.random()*3;}
        c.x+=Math.cos(c.dir)*dt*3;c.z+=Math.sin(c.dir)*dt*3;
        const dd=dist2d(c.x,c.z,c.s.pos.x,c.s.pos.z);
        if(dd>c.s.radius){c.dir+=Math.PI;}
        const bob=Math.abs(Math.sin(now*6+k*2))*0.3;
        setInst(G.citizens,k++,c.x,hAt(c.x,c.z)+0.85+bob,c.z,-c.dir+Math.PI/2,0.9,0.9,0.9);
      }
      for(let i=k;i<80;i++)setInst(G.citizens,i,0,-500,0,0,1,1,1);
      G.citizens.instanceMatrix.needsUpdate=true;
    }else if(G.citList.length){
      G.citList=[];
      for(let i=0;i<80;i++)setInst(G.citizens,i,0,-500,0,0,1,1,1);
      G.citizens.instanceMatrix.needsUpdate=true;
    }
  }
  /* --- birds --- */
  for(const b of G.birds){
    const u=b.userData;u.a+=dt*u.sp;
    const bx=u.c.x+Math.cos(u.a)*u.r,bz=u.c.z+Math.sin(u.a)*u.r;
    b.position.set(bx,Math.max(hAt(bx,bz)+40,u.c.y?u.c.y+u.h:u.h+hAt(bx,bz)),bz);
    b.rotation.y=-u.a;
  }
  /* --- labels: fade by distance --- */
  for(const sp of G.labels){
    const dd=camera.position.distanceTo(sp.position);
    const vis=G.labelsOn&&cam.cur.dist>240;
    sp.visible=vis;
    if(vis){
      const sc=clamp(dd*0.0011,0.45,3.4);
      sp.scale.set(sp.userData.w*0.42*sc,sp.userData.h*0.42*sc,1);
      sp.material.opacity=clamp((dd-180)/300,0,1);
    }
  }
  for(const bn of G.banners)bn.rotation.y=Math.sin(now*0.8)*0.3+camera.rotation.y*0.2;
}

/* =========================================================================
   MAIN LOOP & BOOT
   ========================================================================= */
let simAccum=0,lastT=0,hudT=0,overlayT=0,uiT=0;
function animate(t){
  requestAnimationFrame(animate);
  const now=t/1000;
  let dt=Math.min(0.1,now-lastT||0.016);lastT=now;
  // advance simulation
  simAccum+=dt*SPEEDS[speedIdx];
  let ticks=0;
  while(simAccum>=1&&ticks<40){simAccum-=1;simTick();ticks++;}
  if(simAccum>45)simAccum=45; // don't spiral if a frame stalls
  W.clock.frac=W.clock.frac||0;
  if(SPEEDS[speedIdx]>0)W.clock.frac=simAccum; // 0..1 within the current day
  // cinematic sun: a full day/night cycle every ~150 real seconds while running,
  // decoupled from sim speed so high speeds don't strobe the lighting
  if(SPEEDS[speedIdx]>0)W.visT=(W.visT||0.38)+dt/150;
  const displayDay=W.clock.day+clamp(W.clock.frac,0,0.999);
  const saveDay=W.clock.day;W.clock.day=displayDay;
  director.update(perfNow(),dt);
  updateCamera(dt,now);
  animateWorld(dt,now);
  W.clock.day=saveDay;
  if(G.detDirty&&now-(G.detT||0)>0.5){G.detT=now;rebuildDetails();} // chimneys & spires follow fire and rebuilding
  hudT-=dt;
  if(hudT<=0){hudT=0.5;updateHUD();refreshInspect();renderPetition();
    if((uiT=(uiT+1)%2)===0)refreshCrownPanel();}
  overlayT-=dt;
  if(overlayT<=0){overlayT=6;if(overlayMode)refreshOverlay();}
  renderer.render(scene,camera);
}
async function boot(){
  const m=location.hash.match(/s=(\d+)/);
  const seed=m?parseInt(m[1],10)>>>0:Math.floor(Math.random()*1e9);
  if(!m)history.replaceState(null,'','#s='+seed);
  const line=document.getElementById('loadline'),bar=document.querySelector('#loadbar>div');
  const progress=(txt,f)=>{line.textContent=txt;bar.style.width=Math.round(f*100)+'%';
    return new Promise(r=>setTimeout(r,30));};
  await progress('Forging the realm…',0.02);
  await generateWorld(seed,progress);
  // 3D labels are baked to canvases once: wait (briefly) for the manuscript face so they don't bake in the fallback
  try{if(document.fonts)await Promise.race([document.fonts.load('24px "IM Fell English"'),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  initGraphics();
  buildTerrain();buildFields();lastSeasonKey='';updateTerrainColors(0,0);buildTrees();buildBuildings();buildLabels();buildAgents();buildParticles();buildDynamic();
  simInit();
  initUI();initInput();
  // opening entries
  allLines.push('THE ANNALS OF '+W.name.toUpperCase());
  const m0=W.monarch;
  reignHeader(m0);
  emit('crown',4,W.capital.pos,`Here begin the annals of the realm of ${W.name}, set down faithfully by the chroniclers of ${W.capital.name}.`);
  emit('crown',3,W.capital.pos,`${fullTitle(m0)}, ${m0.traits.join(' and ')}, holds the throne at ${W.capital.name}. ${W.settlements.length-1} towns and villages owe fealty, and the five great houses keep their seats.`);
  // camera opening: establish over capital
  cam.focus.set(W.capital.pos.x,W.capital.pos.y,W.capital.pos.z);
  cam.cur.focus.copy(cam.focus);
  cam.dist=3200;cam.cur.dist=4200;cam.yaw=rand('sim')*Math.PI*2;cam.cur.yaw=cam.yaw-0.4;
  cam.mode='director';
  document.getElementById('loading').style.opacity='0';
  setTimeout(()=>document.getElementById('loading').remove(),900);
  requestAnimationFrame(animate);
}
boot();
</script>
