function costOf(d){return typeof d.cost==='function'?d.cost():d.cost;}
function decreeBlock(d){ // → [reason or '', cost]
  const c=costOf(d);
  const ok=d.ok?d.ok():true;
  if(ok!==true)return [ok,c];
  const cd=d.cd?cdLeft('d_'+d.k):0;
  if(cd)return [`ready in ${cd} d`,c];
  if(c>0&&W.treasury<c)return ['too costly',c];
  return ['',c];
}
function runDecree(k){
  const d=DECREES.find(x=>x.k===k);if(!d)return;
  const [why,c]=decreeBlock(d);if(why)return;
  if(d.place){setPlaceMode('charter',c,'Choose the ground for the new village — Esc to cancel');return;}
  W.treasury-=c;if(d.cd)setCd('d_'+d.k,d.cd);
  d.run(c);
}

/* ---- the great houses ---- */
function royalSingle(){return W.notables.find(n=>n.alive&&!n.spouse&&n.house===0&&['monarch','heir','cousin'].includes(n.role)&&ageOf(n)>=16&&ageOf(n)<=45);}
function houseSingle(hi,sex){return W.notables.find(n=>n.alive&&!n.spouse&&n.house===hi&&n.sex!==sex&&['head','scion','cousin'].includes(n.role)&&ageOf(n)>=16&&ageOf(n)<=45);}
function attaintOdds(hi){const h=W.houses[hi];return clamp(0.35+(W.legitimacy-50)/100+(1-h.might)*0.4-(h.loyalty<30?0.1:0),0.08,0.88);}
function houseCmd(cmd,hi){
  const h=W.houses[hi];if(!h||h.exiled)return;
  const seat=W.settlements[h.seat]?.pos||W.capital.pos;
  if(cmd==='honour'){if(W.treasury<500||cdLeft('h_hon'+hi))return;W.treasury-=500;setCd('h_hon'+hi,120);
    h.loyalty=clamp(h.loyalty+12,0,100);emit('crown',4,seat,`The crown heaps honours upon ${h.name}: a wardenship, a manor, and a seat at the high table.`);}
  else if(cmd==='hostage'){if(h.hostageUntil>day())return;takeHostage(hi);}
  else if(cmd==='match'){if(cdLeft('h_match'+hi))return;
    const a=royalSingle();const b=a&&houseSingle(hi,a.sex);if(!a||!b)return;
    a.spouse=b.id;b.spouse=a.id;setCd('h_match'+hi,360);
    h.loyalty=clamp(h.loyalty+15,0,100);W.capital.festivalUntil=day()+3;
    emit('crown',6,W.capital.pos,`A royal match: ${fullTitle(a)} weds ${fullTitle(b)} of ${h.name}. The match binds the houses in friendship.`,{festival:true});}
  else if(cmd==='attaint'){
    if(W.war)return;
    if(W.player.confirm!=='att'+hi){W.player.confirm='att'+hi;W.player.confirmUntil=performance.now()+5000;return;}
    W.player.confirm=null;
    W.legitimacy=clamp(W.legitimacy-6,0,100);
    if(chance('sim',attaintOdds(hi))){
      h.exiled=true;h.exiledDay=day();
      W.settlements.forEach(s=>{if(s.owner===hi)s.owner=0;});
      const loot=Math.round(1200*h.wealth);W.treasury+=loot;
      W.houses.forEach((o,i)=>{if(i&&i!==hi&&!o.exiled)o.loyalty=clamp(o.loyalty-6,0,100);});
      emit('crown',9,seat,`${h.name} is attainted of treason! Its lands and ${loot.toLocaleString()} in coin are forfeit to the crown, and its lord flees beyond the mountains. The other houses look on in fear.`);
      const head=notableById(h.head);if(head&&chance('sim',0.4))killNotable(head,'on the scaffold, protesting innocence',true);
      refreshOverlay();
    }else{
      h.loyalty=10;W.truceUntil=0;
      startWar(hi,'refuses the crown’s summons to answer for treason');
    }
  }
}

/* ---- settlements & hosts ---- */
function settlementCmd(cmd,si){
  const s=W.settlements[si];if(!s||inRevolt(s.owner))return;
  const pay=c=>{if(W.treasury<c)return false;W.treasury-=c;return true;};
  if(cmd==='relief'){if(cdLeft('s_rel'+si)||!pay(250))return;setCd('s_rel'+si,60);
    s.stores.grain+=s.pop*0.4;s.unrest=clamp(s.unrest-6,0,100);emit('trade',3,s.pos,`Royal grain is distributed at the market cross of ${s.name}.`);}
  else if(cmd==='garrison'){if(!pay(400))return;s.garrison+=40;emit('war',3,s.pos,`Forty men-at-arms march into ${s.name} to strengthen its garrison.`);}
  else if(cmd==='walls'){if(s.walls>=2||!pay(1500*(s.walls+1)))return;s.walls++;
    if(!s.wallRad){riverStrips();traceWall(s,14);if(G.feat)featWalls(s);(s.history||(s.history=[])).push({ago:0,t:'Walled by order of the crown.'});
      for(const b of clearWallLine(s)){b.state='ruin';b.rebuildT=1e9;s.ruinCount++;updateBuildingInstance(b);}} // pulled down for the wall
    rebuildWalls();
    emit('war',4,s.pos,`Masons are set to work at ${s.name}: ${s.walls===1?'a palisade and ditch rise about the town':'the walls are raised again in good stone'}.`);}
  else if(cmd==='seal')sealGates(s,!(s.quarantineUntil>day()));
  else if(cmd==='suppress'){if(!pay(150))return;
    const hot=s.unrest>80;s.unrest=clamp(s.unrest-20,0,100);s.prosperity=clamp(s.prosperity-5,1,100);
    emit('fates',4,s.pos,`Soldiers clear the streets of ${s.name}; the ringleaders are put in the stocks.`);
    if(hot&&chance('sim',0.3)){igniteFire(s,1,'riot');emit('fates',5,s.pos,`The crowd in ${s.name} fights back, and a torch finds a thatched roof.`);}}
}
function settlementActsHTML(s){
  const si=W.settlements.indexOf(s);
  if(inRevolt(s.owner))return '<div class="note">Held by rebels — the crown’s writ does not run here.</div>';
  const rel=cdLeft('s_rel'+si);
  return cbtn('s-relief',si,'Send relief grain',250,rel?`ready in ${rel} d`:'')+
    cbtn('s-garrison',si,'Reinforce the garrison (+40)',400,'')+
    cbtn('s-walls',si,s.walls>=2?'Walls are stone':(s.walls?'Rebuild the walls in stone':'Raise a palisade'),1500*(s.walls+1),s.walls>=2?'complete':'')+
    cbtn('s-seal',si,s.quarantineUntil>day()?'Open the gates':'Seal the gates (quarantine)',0,'')+
    cbtn('s-suppress',si,'Suppress unrest (−20)',150,'');
}
function orderArmy(a,si){
  if(!a||a.gone)return;
  const s=W.settlements[si];
  if(a.state==='battle'){emit('war',2,null,`${a.name} is locked in battle and cannot heed new orders.`);return;}
  a.hold=true;
  if(a.state==='march'||a.state==='rout')a.nextOrder=si; // takes effect when it next makes camp
  else{liftSiege(a);a.state='idle';marchArmy(a,si);}
  emit('war',3,s.pos,`By the crown's command, ${a.name} marches on ${s.name}.`);
  refreshInspect();
}
function armyCmd(cmd,id){
  const a=W.armies.find(x=>x.id===+id);if(!a||a.side!=='crown')return;
  if(cmd==='order'){markManual();setPlaceMode('order',a,`Click a settlement to march ${a.name} there — Esc to cancel`);}
  else if(cmd==='hold'){a.hold=true;if(a.state==='march'){a.nextOrder=null;}emit('war',2,null,`${a.name} is ordered to hold and await the crown's word.`);}
  else if(cmd==='release'){a.hold=false;a.nextOrder=null;emit('war',2,null,`${a.name} is given leave to make war as its captains see fit.`);}
  else if(cmd==='disband'){if(a.state==='battle')return;disbandArmy(a);hideInspect();
    emit('war',3,W.capital.pos,`${a.name} is paid off and sent home to the plough.`);}
}
function armyActsHTML(a){
  if(a.state==='battle')return '<div class="note">Locked in battle.</div>';
  return cbtn('a-order',a.id,'Order a march… (click a town)',0,'')+
    (a.hold?cbtn('a-release',a.id,'Release to its captains',0,''):cbtn('a-hold',a.id,'Hold position',0,''))+
    cbtn('a-disband',a.id,'Pay off and disband (saves 14 g/day)',0,'');
}
function cbtn(cmd,arg,label,cost,why,desc){
  const dis=!!why||(cost>0&&W.treasury<cost);
  const tag=why?why:(cost>0?cost.toLocaleString()+' g':(cost<0?'+'+(-cost).toLocaleString()+' g':''));
  return `<button class="cbtn" data-cmd="${cmd}" data-arg="${arg}"${dis?' disabled':''}><span>${label}${desc?`<small>${desc}</small>`:''}</span><span class="cost">${tag}</span></button>`;
}

/* ---- ambitions, legacy, the fall of a line ---- */
const AMBITIONS=[
  ['coffers','Fill the coffers — 10,000 gold in the treasury',10,()=>W.treasury>=10000],
  ['multitude','A multitude — the realm’s people grow by half',15,()=>realmPop()>=W.player.startPop*1.5],
  ['loyal','Concord — every great house at loyalty 65+',15,()=>W.houses.every((h,i)=>!i||h.exiled||h.loyalty>=65)],
  ['beloved','Beloved — legitimacy of 90',15,()=>W.legitimacy>=90],
  ['peace','Ten years of peace under your rule',20,()=>!W.war&&day()-W.player.peaceSince>=3600],
  ['victor','Crush a rebellion in the field',20,null],
  ['wyrm','Rid the realm of the dragon',25,null],
  ['founder','Charter a new village',10,null]
];
function sovAmbition(key){
  const P=W.player;if(!P||!P.on||P.amb[key])return;
  const a=AMBITIONS.find(x=>x[0]===key);if(!a)return;
  P.amb[key]=day();P.legacy+=a[2];saveBest(P.legacy);
  emit('crown',5,W.capital.pos,`Ambition fulfilled — ${a[1].split(' — ')[0]}. The heralds add ${a[2]} to the legacy of ${W.houses[0].name}.`);
}
function dynastyChanged(oldName){
  W.dynasty=(W.dynasty||1)+1;
  const P=W.player;if(!P||!P.on)return;
  const yrs=Math.floor((day()-P.since)/360),L=P.legacy;saveBest(L);
  petition({key:'fall',title:'Your line is broken',pos:W.capital.pos,days:90,ai:0,
    text:`The dynasty you guided${oldName?' ('+oldName+')':''} has lost the throne after ${yrs} year${yrs===1?'':'s'} of your rule, with a legacy of ${L}${bestLegacy()>L?' (best for this realm: '+bestLegacy()+')':''}. ${fullTitle(W.monarch)} now wears the crown.`,
    opts:[{label:`Rule on as ${W.houses[0].name}`,act:()=>{P.legacy=0;P.amb={};P.since=day();P.startPop=realmPop();P.peaceSince=day();}},
          {label:'Lay down the crown and return to the chronicle',act:()=>setSovereign(false)}]});
}
function tickSovereign(){
  const P=W.player;if(!P)return;
  if(W.petitions.length){
    if(!sovOn()){ // left Sovereign mode or watching: the council clears the table
      while(W.petitions.length){const p=W.petitions.shift();runPetition(p,aiPick(p));}
      afterPetition();
    }else if(day()>=W.petitions[0].due){
      const p=W.petitions.shift(),i=aiPick(p);
      emit('crown',3,null,`The crown is silent on “${p.title}”; the council decides: ${p.opts[i].label.replace(/^./,c=>c.toLowerCase())}.`);
      runPetition(p,i);afterPetition();
    }
  }
  if(!P.on)return;
  if(day()%360===0&&day()>P.since){P.legacy+=2;saveBest(P.legacy);}
  if(day()%10===0)for(const a of AMBITIONS)if(a[3]&&!P.amb[a[0]]&&a[3]())sovAmbition(a[0]);
  if(sovOn()&&!W.petitions.length&&chance('sim',0.004))courtDilemma();
}
function setSovereign(on){
  if(!W||!W.player||on===W.player.on)return;
  const P=W.player;P.on=on;
  document.body.classList.toggle('sov',on);
  if(on){
    if(document.body.classList.contains('watch'))toggleWatch();
    if(!P.started){P.started=true;P.since=day();P.startPop=realmPop();P.peaceSince=day();}
    markManual();
    const dr=document.getElementById('drawer');
    if(dr.classList.contains('closed'))toggleDrawer();
    selectTab('crown');
    emit('crown',4,W.capital.pos,`${fullTitle(W.monarch)} takes the reins of government in person. Decrees, petitions and the hosts of the crown now wait upon the royal word.`);
  }else{
    if(placeMode==='order'||placeMode==='charter')setPlaceMode(null);
    while(W.petitions.length){const p=W.petitions.shift();runPetition(p,aiPick(p));}
    afterPetition();
    buildDrawer(drawerTab);
  }
  renderPetition();updateHUD();if(inspTarget)showInspect(inspTarget);
}

function runCmd(cmd,arg){
  switch(cmd){
    case 'sov-on':setSovereign(true);break;
    case 'sov-off':setSovereign(false);break;
    case 'pause-toggle':W.player.pause=!W.player.pause;break;
    case 'decree':runDecree(arg);break;
    case 'h-honour':case 'h-hostage':case 'h-match':case 'h-attaint':houseCmd(cmd.slice(2),+arg);break;
    case 'notable':{const n=notableById(+arg);if(n)showInspect({type:'notable',n});break;}
    case 'army':{const a=W.armies.find(x=>x.id===+arg);if(a){showInspect({type:'army',a});flyTo(a._rpos.x,a._rpos.z,420);markManual();}break;}
    case 's-relief':case 's-garrison':case 's-walls':case 's-seal':case 's-suppress':settlementCmd(cmd.slice(2),+arg);break;
    case 'a-order':case 'a-hold':case 'a-release':case 'a-disband':armyCmd(cmd.slice(2),arg);break;

function drawLandMap(g,S){ // the estate surveyor's hand: furlongs hatched along their strips, meadows, vines, hedges and parish bounds
  if(!G.land)return;
  const id=g.getImageData(0,0,S,S),d=id.data,px=SIZE/S,F=G.land.F,m=G.land.mask;
  const ink=(o,r,gg,b,a)=>{d[o]=d[o]*(1-a)+r*a;d[o+1]=d[o+1]*(1-a)+gg*a;d[o+2]=d[o+2]*(1-a)+b*a;};
  const near2=(x,z)=>{const fx=(x+SIZE/2)/FG,fz=(z+SIZE/2)/FG,ci=Math.floor(fx),cj=Math.floor(fz);let a=null,b=null,da=1e9,db=1e9,pa,pb;
    for(let j=cj-1;j<=cj+1;j++)for(let i=ci-1;i<=ci+1;i++){const f=F[clamp(j,0,FN-1)*FN+clamp(i,0,FN-1)],sx=i+0.15+0.7*f.jx,sz=j+0.15+0.7*f.jz,dd=(fx-sx)**2+(fz-sz)**2;
      if(dd<da){db=da;b=a;pb=pa;da=dd;a=f;pa=[sx,sz];}else if(dd<db){db=dd;b=f;pb=[sx,sz];}}
    const nx=pb[0]-pa[0],nz=pb[1]-pa[1],L=Math.hypot(nx,nz)||1;
    return[a,b,Math.abs((fx-(pa[0]+pb[0])/2)*nx/L+(fz-(pa[1]+pb[1])/2)*nz/L)*FG];};
  for(let yy=0;yy<S;yy++)for(let xx=0;xx<S;xx++){
    const x=(xx+0.5)*px-SIZE/2,z=(yy+0.5)*px-SIZE/2,[f,f2,eb]=near2(x,z),o=(yy*S+xx)*4,c=cIdx(toCell(x),toCell(z));
    if(f.dom!==f2.dom&&eb<px*0.8&&(f.dom>=0||f2.dom>=0)&&((xx+yy)>>1)%3!==0){ink(o,122,52,38,0.55);continue;} // the parish bound, dotted
    if(f.kind===LK.NONE||f.state<LS.TILLED||(f.kind===LK.VINE?!m[c*4+1]:!m[c*4])||m[c*4+2])continue;
    if(eb<px*0.7&&f2!==f){ink(o,90,96,60,0.5);continue;} // hedge or headland
    if(f.state===LS.PASTURE||f.state===LS.SCRUB){ink(o,150,170,110,0.28);continue;}
    if(f.state===LS.BURNT){ink(o,70,50,40,0.45);continue;}
    if(f.kind===LK.MEADOW){ink(o,140,175,110,0.35);continue;}
    if(f.kind===LK.VINE){ink(o,120,70,110,((xx+yy*3)%4===0)?0.6:0.12);continue;}
    const w=f.w||30,t=(x*-Math.sin(f.th)+z*Math.cos(f.th))/(w*2),fr=t-Math.floor(t);
    ink(o,196,170,112,0.2);if(fr*w*2<px*0.9)ink(o,120,96,60,0.45); // every other strip ruled
  }
  g.putImageData(id,0,0);
}
function buildMapCanvas(){
  const S=1000,c=document.createElement('canvas');c.width=c.height=S;
  const g=c.getContext('2d'),px=S/GRID;
  const mx=(x)=>(x+SIZE/2)/SIZE*S,mz=(z)=>(z+SIZE/2)/SIZE*S;
  const rng=layoutRng(777),rr=()=>rng();
  /* parchment with a little foxing */
  g.fillStyle='#E9DCC3';g.fillRect(0,0,S,S);
  for(let i=0;i<2600;i++){g.fillStyle=`rgba(${120+rr()*40|0},${90+rr()*30|0},${50+rr()*20|0},${rr()*0.05})`;g.beginPath();g.arc(rr()*S,rr()*S,1+rr()*7,0,7);g.fill();}
  /* land tint + hill-shading, drawn per cell into a small image and scaled up smoothly */
  const img=document.createElement('canvas');img.width=img.height=GRID;const ig=img.getContext('2d'),id=ig.createImageData(GRID,GRID);
  const tint={[B.MARSH]:[169,181,143],[B.MEADOW]:[214,210,168],[B.FARM]:[222,210,160],[B.FOREST]:[176,190,146],[B.PINE]:[160,178,146],[B.ROCK]:[196,186,166],[B.SNOW]:[236,232,222]};
  for(let cz=0;cz<GRID;cz++)for(let cx=0;cx<GRID;cx++){
    const i=cIdx(cx,cz),o=i*4;
    if(W.water[i]===1){ // sea: paler near the shore
      let near=9;for(let r=1;r<=8&&near===9;r++)for(let d=-r;d<=r&&near===9;d++)for(const[a,b]of[[d,-r],[d,r],[-r,d],[r,d]])if(inB(cx+a,cz+b)&&!W.water[cIdx(cx+a,cz+b)]){near=r;break;}
      const t=clamp(near/8,0,1);id.data[o]=lerp(176,138,t);id.data[o+1]=lerp(198,166,t);id.data[o+2]=lerp(200,182,t);id.data[o+3]=255;continue;
    }
    const col=tint[W.biome[i]]||tint[B.MEADOW];
    const hx=W.h[cIdx(Math.max(0,cx-1),cz)]-W.h[cIdx(Math.min(GRID-1,cx+1),cz)],hz=W.h[cIdx(cx,Math.max(0,cz-1))]-W.h[cIdx(cx,Math.min(GRID-1,cz+1))];
    const sh=clamp(1+(hx+hz)*0.006,0.72,1.18); // light from the north-west
    id.data[o]=clamp(col[0]*sh,0,255);id.data[o+1]=clamp(col[1]*sh,0,255);id.data[o+2]=clamp(col[2]*sh*0.98,0,255);id.data[o+3]=255;
  }
  ig.putImageData(id,0,0);
  g.imageSmoothingEnabled=true;g.globalAlpha=0.85;g.drawImage(img,0,0,S,S);g.globalAlpha=1;
  drawLandMap(g,S);
  /* coastline */
  g.strokeStyle='rgba(60,80,95,0.55)';g.lineWidth=1.2;
  for(let cz=1;cz<GRID-1;cz++)for(let cx=1;cx<GRID-1;cx++){
    const i=cIdx(cx,cz);if(W.water[i]!==1)continue;
    if(!W.water[cIdx(cx+1,cz)]){g.beginPath();g.moveTo((cx+0.5)*px,cz*px);g.lineTo((cx+0.5)*px,(cz+1)*px);g.stroke();}
    if(!W.water[cIdx(cx-1,cz)]){g.beginPath();g.moveTo((cx-0.5)*px,cz*px);g.lineTo((cx-0.5)*px,(cz+1)*px);g.stroke();}
    if(!W.water[cIdx(cx,cz+1)]){g.beginPath();g.moveTo(cx*px,(cz+0.5)*px);g.lineTo((cx+1)*px,(cz+0.5)*px);g.stroke();}
    if(!W.water[cIdx(cx,cz-1)]){g.beginPath();g.moveTo(cx*px,(cz-0.5)*px);g.lineTo((cx+1)*px,(cz-0.5)*px);g.stroke();}
  }
  /* territories: soft washes in each house's colour */
  for(const s of W.settlements){
    const h=W.houses[s.owner];if(!h)continue;
    const col='#'+h.sigilHue[0].toString(16).padStart(6,'0'),R=(s.kind==='capital'?800:s.kind==='town'?600:380)/SIZE*S;
    const gr=g.createRadialGradient(mx(s.pos.x),mz(s.pos.z),R*0.2,mx(s.pos.x),mz(s.pos.z),R);

function polyPos(poly,f){
  if(!poly||!poly.length)return null;
  if(poly.length===1)return{x:poly[0].x,z:poly[0].z};
  f=clamp(f,0,1);
  const total=poly._len||(poly._len=poly.reduce((t,p,i)=>i?t+dist2d(poly[i-1].x,poly[i-1].z,p.x,p.z):0,0));
  let want=f*total,acc=0;
  for(let i=1;i<poly.length;i++){
    const seg=dist2d(poly[i-1].x,poly[i-1].z,poly[i].x,poly[i].z);
    if(acc+seg>=want){
      const t=seg>0?(want-acc)/seg:0;
      return{x:lerp(poly[i-1].x,poly[i].x,t),z:lerp(poly[i-1].z,poly[i].z,t),
        y:poly[i].y!==undefined?lerp(poly[i-1].y??poly[i].y,poly[i].y,t):undefined,
        dir:Math.atan2(poly[i].z-poly[i-1].z,poly[i].x-poly[i-1].x)};
    }
    acc+=seg;
  }
  const last=poly[poly.length-1];
  return{x:last.x,z:last.z,y:last.y};
}

let dayCycleOn=false; // steady daylight by default — the cycle strobes at high sim speeds
function currentDayF(){
  if(!dayCycleOn)return 0.42; // pleasant late morning
  // compress night to ~20% of the cycle so the documentary stays watchable
  const t=(W.visT||0)%1;
  return t<0.8?0.25+(t/0.8)*0.5:0.75+((t-0.8)/0.2)*0.5;
}
function animateWorld(dt,now){
  const dayF=currentDayF();
  const simDay=W.clock.day;
  /* --- sun / moon / sky --- */
  const el2=Math.sin((dayF-0.25)*2*Math.PI); // sun elevation: dawn .25, noon .5, dusk .75
  const sunDir=new THREE.Vector3(Math.cos(dayF*Math.PI*2)*0.8,el2,Math.sin(dayF*Math.PI*2)*0.55).normalize();
  const daylight=clamp(el2*1.6+0.12,0.14,1); // nights stay readable, never pitch black
  const eclipseF=W.eclipse>0?0.12:1;
  const overcastF=(W.weather.state==='clear')?1:(W.weather.state==='overcast'?0.72:0.5);
  G.sun.intensity=0.98*daylight*eclipseF*overcastF;
  G.sun.position.copy(sunDir).multiplyScalar(2600).add(cam.cur.focus);
  G.sun.target.position.copy(cam.cur.focus);
  G.sun.castShadow=cam.cur.dist<1600&&daylight>0.05;
  const sc=G.sun.shadow.camera,ext=clamp(cam.cur.dist*0.9,220,1200);
  sc.left=-ext;sc.right=ext;sc.top=ext;sc.bottom=-ext;sc.updateProjectionMatrix();

  G.sunDisc.position.copy(sunDir).multiplyScalar(11800).add(camera.position);
  G.sunDisc.visible=el2>-0.06;
  G.moonDisc.position.copy(sunDir).multiplyScalar(-11800).add(camera.position);
  G.moonDisc.visible=el2<0.1;
  // sky palette
  const night=new THREE.Color(0x0d1526),nightB=new THREE.Color(0x141c30);
  const dayT=new THREE.Color(0x7fb2dd),dayB=new THREE.Color(0xd7e3e8);
  const duskT=new THREE.Color(0x4a5a8a),duskB=new THREE.Color(0xe89a5a);

  else{top=duskT.clone().lerp(night,tw);bot=duskB.clone().lerp(nightB,tw);}
  if(W.weather.state!=='clear'&&el2>0){top.multiplyScalar(overcastF*0.9);bot.multiplyScalar(overcastF*0.95);}
  if(W.eclipse>0){top.multiplyScalar(0.25);bot.multiplyScalar(0.3);}

    if(nearest&&nd<800){

  /* --- weather particles --- */
  const raining=W.weather.state==='rain'||W.weather.state==='storm';

    const sp=G.smoke.geometry.attributes.position;
    G.smokeData.forEach((p,i)=>{
      if(p.life>0){p.life-=dt;p.y+=p.vy*dt;p.x+=Math.cos(W.weather.wind)*dt*4;p.z+=Math.sin(W.weather.wind)*dt*4;
        sp.setXYZ(i,p.x,p.y,p.z);}
      else sp.setXYZ(i,0,-999,0);
    });
    sp.needsUpdate=true;
    const fp=G.flames.geometry.attributes.position;
    G.flameData.forEach((p,i)=>{
      if(p.life>0){p.life-=dt;p.y+=dt*6;fp.setXYZ(i,p.x,p.y,p.z);}
      else fp.setXYZ(i,0,-999,0);
    });
    fp.needsUpdate=true;
  }
  updateFx(dt,now);
  /* --- comet --- */
  if(W.comet&&simDay<W.comet.start+12){
    const f=(simDay-W.comet.start)/12;
    G.comet.visible=true;
    const a=f*Math.PI;
    G.comet.position.set(camera.position.x-Math.cos(a)*9000,3000+Math.sin(a)*4000,camera.position.z-7000+f*3000);
    G.comet.lookAt(G.comet.position.x+1000,G.comet.position.y+400,G.comet.position.z);
  }else G.comet.visible=false;
  /* --- traffic: carts, barges and cogs on their own clock --- */
  let ci=0,cogI=0,bargeI=0,dotI=0;
  const unitScale=clamp(cam.cur.dist*0.0035,1,6); // keep traffic legible from altitude
  const showDots=cam.cur.dist>900,vm=[0,1,1.5,2.5,4,8][speedIdx]||0,T=G.traffic||[];
  for(let i=T.length-1;i>=0;i--){const t=T[i];t.d+=t.spd*vm*dt;
    if(t.d>=t.len||t.cons.robbed){if(t.proxy){scene.remove(t.proxy);t.proxy.geometry.dispose();}t.info.gone=true;T.splice(i,1);}} // arrived, or driven off by robbers
  for(const t of T){
    if(t.d<0)continue; // still loading at the gate
    const c=t.info,p=polyPos(t.poly,t.d/t.len);
    if(!p)continue;
    const y=c.sea?SEA+1:(c.river?hAt(p.x,p.z)+1.2:hAt(p.x,p.z)+1.0); // road surface or water line
    c._rpos={x:p.x,y:y+8,z:p.z};
    if(!t.proxy){
      t.proxy=new THREE.Mesh(new THREE.SphereGeometry(12,6,5),new THREE.MeshBasicMaterial({visible:false}));
      t.proxy.userData.pick={type:'caravan',c};scene.add(t.proxy);
    }
    t.proxy.position.set(p.x,y+6,p.z);
    if(c.sea||c.river){
      const pool=c.sea?G.cogs:G.barges,k=c.sea?cogI++:bargeI++;
      if(k<pool.length){const g=pool[k];g.visible=true;g.position.set(p.x,y-0.3+Math.sin(now*1.3+k)*0.15,p.z);g.rotation.set(Math.sin(now*0.9+k)*0.03,-(p.dir||0),0);g.scale.setScalar(Math.min(unitScale,c.river?2:3));}
    }else if(ci<TRAFFIC_CAP){
      const bob=Math.abs(Math.sin(now*6+t.len+t.d*0.4))*0.12; // wheels on ruts
      setInst(G.caravans,ci,p.x,y-0.9+bob,p.z,-(p.dir||0),unitScale,unitScale,unitScale);
      setInst(G.cartCovers,ci,p.x,y-0.9+bob,p.z,-(p.dir||0),unitScale,unitScale,unitScale);
      G.cartCovers.setColorAt(ci,C1.setHex(CARGOCOL[c.good]||0xe6d8a8));ci++;
    }
    if(showDots&&dotI<G.caravanDots.length){
      const sp=G.caravanDots[dotI++];
      sp.visible=true;sp.position.set(p.x,y+14,p.z);
      const ds=clamp(camera.position.distanceTo(sp.position)*0.01,8,40);
      sp.scale.set(ds,ds,1);
    }
  }
  G.caravans.count=G.cartCovers.count=ci;
  G.caravans.instanceMatrix.needsUpdate=true;G.cartCovers.instanceMatrix.needsUpdate=true;if(G.cartCovers.instanceColor)G.cartCovers.instanceColor.needsUpdate=true;
  for(let i=cogI;i<G.cogs.length;i++)G.cogs[i].visible=false;
  for(let i=bargeI;i<G.barges.length;i++)G.barges[i].visible=false;
  for(let i=dotI;i<G.caravanDots.length;i++)G.caravanDots[i].visible=false;
  G.caravans.instanceMatrix.needsUpdate=true;
  /* --- armies --- */
  let si2=0;
  for(const a of W.armies){
    let p;
    if(a.state==='march'||a.state==='rout'){
      const f=(simDay-a.departDay)/Math.max(0.01,a.arriveDay-a.departDay);
      p=polyPos(a.poly,f);
    }else if(a.state==='battle'&&a.battlePos){ // fight where the hosts met, not back at their muster town
      const off=a.side==='crown'?-14:14;
      p={x:a.battlePos.x+off,z:a.battlePos.z+off*0.5,dir:a.side==='crown'?0.46:Math.PI+0.46};
    }
    if(!p){const s=W.settlements[a.at];p={x:s.pos.x+(a.state==='siege'?90:20),z:s.pos.z+40,dir:0};}
    const y=hAt(p.x,p.z);
    a._rpos={x:p.x,y:y+10,z:p.z};
    if(a.flag){
      const fs=clamp(cam.cur.dist*0.0011,0.3,4.5); // a real banner up close, a legible marker from on high
      a.flag.position.set(p.x+Math.cos(p.dir||0)*2,y+19*fs+Math.sin(now*2+a.id)*0.2*fs,p.z+Math.sin(p.dir||0)*2);
      a.flag.quaternion.copy(camera.quaternion); // true billboard; Euler .y alone skews at most angles
      a.flag.scale.setScalar(fs);
    }
    // soldiers when near: ranks in the house's colours; scaled up with distance so a host still reads
    const dcam=dist2d(camera.position.x,camera.position.z,p.x,p.z);
    if(dcam<2600){
      const H=W.houses[a.house],us=clamp(cam.cur.dist*0.0025,1.15,4);
      const cT=new THREE.Color(H.sigilHue[0]),cS=new THREE.Color(H.sigilHue[1]),hsl={};
      cT.getHSL(hsl);cT.setHSL(hsl.h,Math.max(hsl.s,0.45),Math.max(hsl.l,0.5)); // even a sable livery must read at a glance
      const n=Math.min(140,Math.max(12,Math.round(a.strength/5))),per=10;
      const dir=p.dir||0,fx=Math.cos(dir),fz=Math.sin(dir),lx=-fz,lz=fx;
      for(let k=0;k<n&&si2<1500;k++){
        const col=k%per-(per-1)/2,row=Math.floor(k/per);
        let sx=p.x+(fx*(-row*1.9)+lx*col*1.3)*us,sz=p.z+(fz*(-row*1.9)+lz*col*1.3)*us;
        if(a.state==='battle'){sx+=Math.sin(now*7+k*3)*0.9*us;sz+=Math.cos(now*6+k*5)*0.9*us;}
        else if(a.state==='siege'||a.state==='idle'){sx+=Math.sin(k*12.9)*0.5;sz+=Math.cos(k*7.3)*0.5;}
        const bob=a.state==='march'||a.state==='rout'?Math.abs(Math.sin(now*8+k))*0.12*us:0;
        const yy=hAt(sx,sz)+bob,ry=-dir+Math.PI/2+(a.state==='rout'?Math.PI:0);
        setInst(G.soldiers,si2,sx,yy,sz,ry,us,us,us);setInst(G.soldierShields,si2,sx,yy,sz,ry,us,us,us);setInst(G.soldierKit,si2,sx,yy,sz,ry,us,us,us);
        G.soldiers.setColorAt(si2,cT);G.soldierShields.setColorAt(si2,cS);
        si2++;
      }
    }
  }
  for(const m of[G.soldiers,G.soldierShields,G.soldierKit]){m.count=si2;m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;}
  /* --- dragon --- */
  const d=W.dragon;
  const dsc=clamp(cam.cur.dist*0.0011,1,3);G.dragonMesh.scale.setScalar(dsc);
  if(d&&!d.dead){
    if(d.state==='raiding'||d.state==='returning'){
      const f=clamp((simDay-d.departDay)/Math.max(0.01,d.arriveDay-d.departDay),0,1);
      const p=polyPos(d.path,f);
      if(p){
        G.dragonMesh.visible=true;
        const py=(p.y!==undefined?p.y:400)+Math.sin(now*1.5)*3;
        G.dragonMesh.position.set(p.x,py,p.z);
        G.dragonMesh.rotation.set(Math.sin(now*6)*0.04,-(p.dir||0)+Math.PI/2,Math.sin(now*0.7)*0.12);
        d._rpos={x:p.x,y:py,z:p.z};
        const flap=Math.sin(now*4.5)*0.75;
        G.dragonWings[0].rotation.z=flap;G.dragonWings[1].rotation.z=-flap;
        if(d.state==='raiding'&&f>0.78&&Math.random()<dt*40){ // fire from the jaws as it stoops on the town
          const m=G.dragonMesh.localToWorld(new THREE.Vector3(0,2.5,13+Math.random()*6));
          spawnFlame(m.x,m.y-Math.random()*20,m.z);
        }
      }
    }else if(d.state==='sleeping'&&cam.cur.dist<3000&&dist2d(camera.position.x,camera.position.z,d.lair.x,d.lair.z)<2200){
      G.dragonMesh.visible=true;
      G.dragonMesh.position.set(d.lair.x,d.lair.y+2.5,d.lair.z);G.dragonMesh.rotation.set(0,0.6,0);
      d._rpos={x:d.lair.x,y:d.lair.y+6,z:d.lair.z};
      G.dragonWings[0].rotation.z=-0.9;G.dragonWings[1].rotation.z=0.9; // wings folded along the flanks
      if(Math.random()<dt*0.6)spawnSmoke(d.lair.x,d.lair.y+6,d.lair.z+12,true); // it breathes in its sleep
    }else G.dragonMesh.visible=false;
  }else if(G.dragonMesh)G.dragonMesh.visible=false;
  /* --- townsfolk walking the streets --- */
  {
    let nearest=null,nd=1e18;
    for(const s of W.settlements){const dd=dist2d(cam.cur.focus.x,cam.cur.focus.z,s.pos.x,s.pos.z);if(dd<nd){nd=dd;nearest=s;}}
    if(nearest&&cam.cur.dist<260&&nd<(nearest.extentR||nearest.radius)+120){
      if(G.citList.length===0||G.citList[0].s!==nearest){
        G.citList=[];
        const sts=(nearest.streets||[]).filter(t=>!t.hidden&&t.kind!=='edge'&&t.pts.length>1);
        const pal=[0x7a3b2e,0x3e5a7a,0x5b6b3a,0x8a7a5a,0x6b4a6e,0xa88b4a,0x4a4a4a,0x9a5a3a,0xb8ae98];
        const n=Math.min(140,Math.round(nearest.pop/8)+12);
        for(let i=0;i<n&&sts.length;i++){
          // most folk are near the heart of town, on the market and the high streets
          let st=sts[Math.floor(Math.random()*sts.length)];
          for(let t=0;t<3;t++){const o=sts[Math.floor(Math.random()*sts.length)];if(dist2d(o.pts[0].x,o.pts[0].z,nearest.pos.x,nearest.pos.z)<dist2d(st.pts[0].x,st.pts[0].z,nearest.pos.x,nearest.pos.z))st=o;}
          const L=polyLen(st.pts);if(L<5)continue;
          G.citList.push({s:nearest,st,L,t:Math.random()*L,v:(0.9+Math.random()*0.7)*(Math.random()<0.5?1:-1),off:(Math.random()-0.5)*st.hw*1.5,
            col:new THREE.Color(pal[Math.floor(Math.random()*pal.length)]).multiplyScalar(0.85+Math.random()*0.3),pause:0});
        }
      }
      let k=0;
      for(const c of G.citList){
        if(c.pause>0)c.pause-=dt;else{c.t+=c.v*dt;if(Math.random()<dt*0.05)c.pause=1+Math.random()*4;}
        if(c.t<0||c.t>c.L){c.v=-c.v;c.t=clamp(c.t,0,c.L);}
        const p=polyPos(c.st.pts,c.t/c.L);if(!p)continue;
        const dir=p.dir||0,x=p.x-Math.sin(dir)*c.off,z=p.z+Math.cos(dir)*c.off;
        const bob=c.pause>0?0:Math.abs(Math.sin(now*7+k*2))*0.06;
        const ry=-dir+(c.v>0?Math.PI/2:-Math.PI/2);
        setInst(G.citizens,k,x,hAt(x,z)+0.28+bob,z,ry,1,1,1);setInst(G.citKit,k,x,hAt(x,z)+0.28+bob,z,ry,1,1,1);
        G.citizens.setColorAt(k,c.col);k++;
      }
      G.citizens.count=G.citKit.count=k;
      G.citizens.instanceMatrix.needsUpdate=true;G.citKit.instanceMatrix.needsUpdate=true;if(G.citizens.instanceColor)G.citizens.instanceColor.needsUpdate=true;
    }else if(G.citList.length){G.citList=[];G.citizens.count=G.citKit.count=0;}
  }
  /* --- birds --- */
  for(const b of G.birds){
    const u=b.userData;u.a+=dt*u.sp;
    const bx=u.c.x+Math.cos(u.a)*u.r,bz=u.c.z+Math.sin(u.a)*u.r;
    b.position.set(bx,Math.max(hAt(bx,bz)+40,u.c.y?u.c.y+u.h:u.h+hAt(bx,bz)),bz);
    b.rotation.y=-u.a;
  }
  /* --- labels: fade by distance --- */
  for(const sp of G.labels){
    const dd=camera.position.distanceTo(sp.position);
    const vis=G.labelsOn&&cam.cur.dist>240;
    sp.visible=vis;
    if(vis){
      const sc=clamp(dd*0.0011,0.45,3.4);
      sp.scale.set(sp.userData.w*0.42*sc,sp.userData.h*0.42*sc,1);
      sp.material.opacity=clamp((dd-180)/300,0,1);
    }
  }
  for(const bn of G.banners)bn.rotation.y=Math.sin(now*0.8)*0.3+camera.rotation.y*0.2;
}

/* =========================================================================
   MAIN LOOP & BOOT
   ========================================================================= */
let simAccum=0,lastT=0,hudT=0,overlayT=0,uiT=0;
function animate(t){
  requestAnimationFrame(animate);
  const now=t/1000;
  let dt=Math.min(0.1,now-lastT||0.016);lastT=now;
  // advance simulation
  if(!Number.isFinite(simAccum))simAccum=0;
  simAccum+=dt*(SPEEDS[speedIdx]||0);
  let ticks=0;const tb=performance.now();
  while(simAccum>=1&&(ticks<40||performance.now()-tb<28)){simAccum-=1;simTick();ticks++;} // time-budgeted, so the fastest speed runs as fast as the machine allows
  const cap=Math.max(45,(SPEEDS[speedIdx]||0)*0.25);if(simAccum>cap)simAccum=cap; // don't spiral if a frame stalls
  W.clock.frac=W.clock.frac||0;
  if(SPEEDS[speedIdx]>0)W.clock.frac=simAccum; // 0..1 within the current day
  // cinematic sun: a full day/night cycle every ~150 real seconds while running,
  // decoupled from sim speed so high speeds don't strobe the lighting
  if(SPEEDS[speedIdx]>0)W.visT=(W.visT||0.38)+dt/150;
  const displayDay=W.clock.day+clamp(W.clock.frac,0,0.999);
  const saveDay=W.clock.day;W.clock.day=Number.isFinite(displayDay)?displayDay:saveDay;
  try{director.update(perfNow(),dt);updateCamera(dt,now);animateWorld(dt,now);}
  finally{W.clock.day=saveDay;} // an error mid-frame must not leave the calendar on a fractional (or worse) day
  if(G.detDirty&&now-(G.detT||0)>0.5){G.detT=now;rebuildDetails();}
  featFlush(now);
  if(G.roadsDirty&&now-(G.roadT||0)>2){G.roadT=now;G.roadsDirty=false;rebuildRoadMesh();} // chimneys & spires follow fire and rebuilding
  hudT-=dt;
  if(hudT<=0){hudT=0.5;updateHUD();refreshInspect();renderPetition();
    if((uiT=(uiT+1)%2)===0)refreshCrownPanel();}
  overlayT-=dt;
  if(overlayT<=0){overlayT=6;if(overlayMode)refreshOverlay();}
  renderer.render(scene,camera);
}
async function boot(){
  const m=location.hash.match(/s=(\d+)/);
  const seed=m?parseInt(m[1],10)>>>0:Math.floor(Math.random()*1e9);
  if(!m)history.replaceState(null,'','#s='+seed);
  const line=document.getElementById('loadline'),bar=document.querySelector('#loadbar>div');
  const progress=(txt,f)=>{line.textContent=txt;bar.style.width=Math.round(f*100)+'%';
    return new Promise(r=>setTimeout(r,30));};
  await progress('Forging the realm…',0.02);
  await generateWorld(seed,progress);
  // 3D labels are baked to canvases once: wait (briefly) for the manuscript face so they don't bake in the fallback
  try{if(document.fonts)await Promise.race([document.fonts.load('24px "IM Fell English"'),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
  initGraphics();
  buildTerrain();buildFields();lastSeasonKey='';updateTerrainColors(0,0);buildTrees();buildBuildings();buildLabels();buildAgents();buildParticles();buildFx();buildDynamic();
  simInit();
  initUI();initInput();
  // opening entries
  allLines.push('THE ANNALS OF '+W.name.toUpperCase());
  const m0=W.monarch;
  reignHeader(m0);
  emit('crown',4,W.capital.pos,`Here begin the annals of the realm of ${W.name}, set down faithfully by the chroniclers of ${W.capital.name}.`);
  emit('crown',3,W.capital.pos,`${fullTitle(m0)}, ${m0.traits.join(' and ')}, holds the throne at ${W.capital.name}. ${W.settlements.length-1} towns and villages owe fealty, and the five great houses keep their seats.`);
  // camera opening: establish over capital
  cam.focus.set(W.capital.pos.x,W.capital.pos.y,W.capital.pos.z);
  cam.cur.focus.copy(cam.focus);
  cam.dist=3200;cam.cur.dist=4200;cam.yaw=rand('sim')*Math.PI*2;cam.cur.yaw=cam.yaw-0.4;
  cam.mode='director';
  document.getElementById('loading').style.opacity='0';
  setTimeout(()=>document.getElementById('loading').remove(),900);
  requestAnimationFrame(animate);
}
boot();
</script>
