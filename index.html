<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Annals</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap');
:root{
  --parch:#E9DCC3; --parch2:#DFCFAF; --ink:#2B2320; --ink2:#4a3f36;
  --gold:#C9A227; --red:#8a2f22; --edge:#b7a482;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#101318;}
body{font-family:'Segoe UI',system-ui,'Helvetica Neue',sans-serif;color:var(--ink);}
#gl{position:absolute;inset:0;}
#gl canvas{touch-action:none;} /* our own orbit/pinch handlers, not the browser's scroll/zoom */
canvas{display:block;}
.serif{font-family:'IM Fell English',Georgia,'Times New Roman',serif;}

/* ---------- loading ---------- */
#loading{position:absolute;inset:0;background:radial-gradient(ellipse at center,#1d2430 0%,#0c0f14 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;color:var(--parch);
  transition:opacity .8s;}
#loading h1{font-family:'IM Fell English',Georgia,serif;font-size:42px;letter-spacing:2px;margin-bottom:14px;color:var(--gold);}
#loadline{font-family:'IM Fell English',Georgia,serif;font-size:18px;font-style:italic;opacity:.85;min-height:26px;}
#loadbar{width:280px;height:3px;background:#2b3242;margin-top:18px;border-radius:2px;overflow:hidden;}
#loadbar>div{height:100%;width:0;background:var(--gold);transition:width .2s;}

/* ---------- HUD top ---------- */
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:14px;
  padding:6px 12px;z-index:20;pointer-events:none;
  background:linear-gradient(180deg,rgba(20,16,12,.72),rgba(20,16,12,0));}
#hud .chip{display:flex;align-items:center;gap:6px;color:var(--parch);font-size:13px;
  text-shadow:0 1px 2px rgba(0,0,0,.8);white-space:nowrap;}
#hud .chip b{color:var(--gold);font-weight:600;}
#hud img.sig{width:18px;height:18px;border-radius:3px;border:1px solid rgba(233,220,195,.4);}
#datechip{font-family:'IM Fell English',Georgia,serif;font-size:16px !important;}
#timec{margin-left:auto;pointer-events:auto;display:flex;gap:4px;}
#rulebtn{pointer-events:auto;background:rgba(201,162,39,.18);border:1px solid var(--gold);color:var(--gold);height:26px;padding:0 10px;
  border-radius:4px;cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap;}
#rulebtn:hover{background:rgba(201,162,39,.32);}
body.sov #rulebtn{background:var(--gold);color:#241d10;}
#rulebtn .pc{display:inline-block;min-width:16px;margin-left:5px;padding:0 4px;border-radius:8px;background:var(--red);color:var(--parch);font-size:11px;}
#legacychip{display:none !important;}
body.sov #legacychip{display:flex !important;}
#timec button{background:rgba(233,220,195,.12);border:1px solid rgba(233,220,195,.35);color:var(--parch);
  min-width:34px;height:26px;border-radius:4px;cursor:pointer;font-size:12px;}
#timec button.on{background:var(--gold);color:#241d10;border-color:var(--gold);font-weight:700;}
#timec button:hover{border-color:var(--gold);}

/* ---------- Chronicle ---------- */
#chron{position:absolute;top:44px;right:10px;bottom:10px;width:340px;z-index:15;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--parch),var(--parch2));border:1px solid var(--edge);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);overflow:hidden;}
#chron header{padding:8px 12px 4px;border-bottom:1px solid var(--edge);}
#chron header{display:flex;align-items:center;gap:6px;cursor:pointer;}
#chron h2{font-family:'IM Fell English',Georgia,serif;font-size:19px;font-weight:normal;color:var(--ink);flex:1;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#chronmin{background:none;border:none;color:var(--ink2);font-size:14px;cursor:pointer;padding:0 2px;}
#chron.min{bottom:auto;}
#chron.min #chronfilters,#chron.min #chronlist,#chron.min #chronfoot{display:none;}
#chronfilters{display:flex;gap:4px;padding:5px 10px;border-bottom:1px solid var(--edge);flex-wrap:wrap;}
#chronfilters .f{font-size:11px;padding:2px 9px;border-radius:10px;border:1px solid var(--edge);cursor:pointer;color:var(--ink2);background:transparent;}
#chronfilters .f.on{background:var(--ink);color:var(--parch);border-color:var(--ink);}
#chronlist{flex:1;overflow-y:auto;padding:6px 10px;scrollbar-width:thin;}
#chronlist::-webkit-scrollbar{width:6px}#chronlist::-webkit-scrollbar-thumb{background:var(--edge);border-radius:3px}
.centry{font-family:'IM Fell English',Georgia,serif;font-size:14px;line-height:1.35;padding:5px 4px;cursor:pointer;
  border-bottom:1px dotted rgba(74,63,54,.25);}
.centry:hover{background:rgba(201,162,39,.15);}
.centry .cd{color:var(--red);font-size:12px;font-style:italic;margin-right:4px;}
.creign{font-family:'IM Fell English',Georgia,serif;text-align:center;font-size:15px;color:var(--red);
  padding:10px 6px 6px;font-style:italic;}
.creign:before,.creign:after{content:"❦";color:var(--gold);margin:0 8px;font-style:normal;}
#chronfoot{display:flex;gap:6px;padding:6px 10px;border-top:1px solid var(--edge);}
#chronfoot button{flex:1;font-size:11px;padding:4px;background:transparent;border:1px solid var(--edge);border-radius:4px;cursor:pointer;color:var(--ink2);}
#chronfoot button:hover{border-color:var(--ink);color:var(--ink);}

/* ---------- Drawer ---------- */
#drawer{position:absolute;top:44px;left:10px;bottom:10px;width:270px;z-index:15;display:flex;flex-direction:column;
  background:linear-gradient(160deg,var(--parch),var(--parch2));border:1px solid var(--edge);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);overflow:hidden;transition:transform .3s;}
#drawer.closed{transform:translateX(-262px);}
/* the toggle lives outside the drawer: #drawer clips its overflow, which used to hide it */
#drawertoggle{position:absolute;left:280px;top:52px;z-index:16;width:22px;height:44px;background:var(--parch);border:1px solid var(--edge);
  border-left:none;border-radius:0 5px 5px 0;cursor:pointer;color:var(--ink2);font-size:12px;transition:left .3s;}
body.drawerclosed #drawertoggle{left:18px;}
#dtabs{display:flex;border-bottom:1px solid var(--edge);}
#dtabs .t{flex:1;text-align:center;font-size:11.5px;padding:7px 0;cursor:pointer;color:var(--ink2);border-right:1px solid var(--edge);}
#dtabs .t:last-child{border-right:none;}
#dtabs .t.on{background:var(--ink);color:var(--parch);}
#dbody{flex:1;overflow-y:auto;padding:10px;scrollbar-width:thin;}
#dbody::-webkit-scrollbar{width:6px}#dbody::-webkit-scrollbar-thumb{background:var(--edge);border-radius:3px}
.slrow{margin-bottom:9px;}
.slrow label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2);margin-bottom:2px;}
.slrow label b{color:var(--ink);font-weight:600;}
.slrow input[type=range]{width:100%;accent-color:var(--gold);height:16px;}
.actbtn{display:block;width:100%;text-align:left;font-size:12.5px;padding:6px 9px;margin-bottom:5px;cursor:pointer;
  background:rgba(43,35,32,.06);border:1px solid var(--edge);border-radius:4px;color:var(--ink);}
.actbtn:hover{background:var(--gold);border-color:var(--gold);color:#241d10;}
.actbtn .tg{float:right;color:var(--red);font-weight:700;}
.ovbtn{display:block;width:100%;text-align:left;font-size:12.5px;padding:6px 9px;margin-bottom:5px;cursor:pointer;
  background:transparent;border:1px solid var(--edge);border-radius:4px;color:var(--ink);}
.ovbtn.on{background:var(--ink);color:var(--parch);border-color:var(--ink);}
.wrow{margin-bottom:8px;font-size:12px;}
.wrow input[type=text]{width:100%;padding:5px;border:1px solid var(--edge);border-radius:4px;background:rgba(255,255,255,.4);font-size:13px;color:var(--ink);}
.wbtn{width:100%;font-size:12.5px;padding:6px;margin-bottom:5px;cursor:pointer;background:rgba(43,35,32,.06);
  border:1px solid var(--edge);border-radius:4px;color:var(--ink);}
.wbtn:hover{border-color:var(--ink);}
.houserow{display:flex;align-items:center;gap:7px;margin-bottom:7px;font-size:12px;}
.houserow img{width:22px;height:22px;border-radius:3px;border:1px solid var(--edge);}
.houserow .hbar{flex:1;height:5px;background:rgba(43,35,32,.15);border-radius:3px;overflow:hidden;}
.houserow .hbar>div{height:100%;background:var(--gold);}
.houserow.exiled .hname{text-decoration:line-through;opacity:.55;}
.dhead{font-family:'IM Fell English',Georgia,serif;font-size:14px;color:var(--red);margin:8px 0 6px;border-bottom:1px solid var(--edge);padding-bottom:2px;}
.succline{font-size:11.5px;color:var(--ink2);margin-bottom:3px;}
.succline.pk,.houserow.pk{cursor:pointer;}
.succline.pk:hover,.houserow.pk:hover .hname{text-decoration:underline;}
.note{font-size:11.5px;color:var(--ink2);font-style:italic;margin:4px 0 8px;line-height:1.35;}
.slrow input[type=range]:disabled{opacity:.4;}
/* ---------- crown (sovereign) panel ---------- */
.cstat{display:flex;justify-content:space-between;font-size:12px;color:var(--ink2);padding:1px 0;}
.cstat b{color:var(--ink);font-weight:600;}
.cbtn{display:flex;justify-content:space-between;align-items:center;gap:6px;width:100%;text-align:left;font-size:12px;padding:5px 8px;margin-bottom:4px;
  cursor:pointer;background:rgba(43,35,32,.06);border:1px solid var(--edge);border-radius:4px;color:var(--ink);}
.cbtn:hover:not(:disabled){background:var(--gold);border-color:var(--gold);color:#241d10;}
.cbtn:disabled{opacity:.45;cursor:default;}
.cbtn .cost{font-size:11px;color:var(--red);white-space:nowrap;}
.cbtn small{display:block;font-size:10.5px;color:var(--ink2);margin-top:1px;}
.cbtn:hover:not(:disabled) .cost{color:#241d10;}
.chouse{border:1px solid var(--edge);border-radius:4px;padding:5px 6px;margin-bottom:6px;}
.chouse .houserow{margin-bottom:4px;}
.chouse .hb{display:flex;flex-wrap:wrap;gap:3px;}
.chouse .hb button{flex:1 1 45%;font-size:10.5px;padding:3px 4px;cursor:pointer;background:transparent;border:1px solid var(--edge);border-radius:3px;color:var(--ink);}
.chouse .hb button:hover:not(:disabled){background:var(--gold);border-color:var(--gold);}
.chouse .hb button:disabled{opacity:.4;cursor:default;}
.tag{font-size:10px;color:var(--red);font-style:italic;margin-left:3px;}
.amb{font-size:11.5px;color:var(--ink2);margin-bottom:2px;}
.amb.done{color:var(--ink);}
.amb.done:before{content:"✓ ";color:#3d6b2a;font-weight:700;}
.amb:not(.done):before{content:"○ ";}
.warbar{height:7px;border-radius:4px;background:linear-gradient(90deg,var(--red),#d9c89b 50%,#3d6b2a);position:relative;margin:4px 0 6px;}
.warbar i{position:absolute;top:-3px;width:3px;height:13px;background:var(--ink);border-radius:1px;}

/* ---------- Inspector ---------- */
#insp{position:absolute;left:290px;bottom:14px;width:290px;z-index:16;display:none;
  background:linear-gradient(160deg,var(--parch),var(--parch2));border:1px solid var(--edge);border-radius:6px;
  box-shadow:0 6px 24px rgba(0,0,0,.5);padding:10px 12px;}
#insp h3{font-family:'IM Fell English',Georgia,serif;font-size:17px;font-weight:normal;display:flex;align-items:center;gap:8px;}
#insp h3 img{width:22px;height:22px;border-radius:3px;border:1px solid var(--edge);}
#insp .sub{font-size:11px;color:var(--red);font-style:italic;margin-bottom:6px;}
#insp .row{display:flex;justify-content:space-between;font-size:12px;padding:2px 0;color:var(--ink2);}
#insp .row b{color:var(--ink);font-weight:600;}
#insp .agline{font-family:'IM Fell English',Georgia,serif;font-style:italic;font-size:12.5px;margin-top:6px;color:var(--ink);}
#inspx{position:absolute;top:6px;right:9px;cursor:pointer;color:var(--ink2);font-size:14px;background:none;border:none;}
#inspfollow{margin-top:7px;width:100%;font-size:11.5px;padding:4px;cursor:pointer;background:transparent;border:1px solid var(--edge);border-radius:4px;color:var(--ink2);}
#inspfollow:hover{border-color:var(--ink);color:var(--ink);}
#inspacts{margin-top:6px;}
#inspacts:empty{display:none;}
#inspacts .cbtn{font-size:11.5px;padding:4px 7px;}
body.drawerclosed #insp{left:30px;}

/* ---------- beat card ---------- */
#beat{position:absolute;left:50%;bottom:36px;transform:translateX(-50%);max-width:620px;z-index:14;
  background:rgba(20,16,12,.78);border:1px solid rgba(201,162,39,.5);border-radius:6px;padding:9px 20px;
  color:var(--parch);text-align:center;display:none;pointer-events:none;}
#beat .bt{font-family:'IM Fell English',Georgia,serif;font-size:17px;line-height:1.3;}
#beat .bd{font-size:11px;color:var(--gold);font-style:italic;margin-top:2px;}

/* watch-mode date */
#watchdate{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:14;display:none;
  font-family:'IM Fell English',Georgia,serif;font-size:20px;color:var(--parch);text-shadow:0 1px 3px #000;pointer-events:none;}

#hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);z-index:13;font-size:11px;
  color:rgba(233,220,195,.55);pointer-events:none;text-shadow:0 1px 2px #000;white-space:nowrap;}

body.hideui #hud,body.hideui #chron,body.hideui #drawer,body.hideui #insp,body.hideui #hint{display:none !important;}
body.watch #chron,body.watch #drawer,body.watch #insp,body.watch #hint,body.watch #hud{display:none !important;}
body.watch #watchdate{display:block;}
#placehint{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);z-index:30;display:none;
  background:var(--red);color:var(--parch);padding:5px 16px;border-radius:4px;font-size:13px;white-space:nowrap;}
body.watch #drawertoggle,body.hideui #drawertoggle,body.watch #petition,body.hideui #petition{display:none !important;}
/* ---------- petitions: the court awaits a decision ---------- */
#petition{position:absolute;top:48px;left:50%;transform:translateX(-50%);width:min(460px,calc(100vw - 24px));z-index:25;display:none;
  background:linear-gradient(160deg,var(--parch),var(--parch2));border:2px solid var(--gold);border-radius:6px;
  box-shadow:0 10px 40px rgba(0,0,0,.6);padding:10px 14px 9px;}
#petition h4{font-family:'IM Fell English',Georgia,serif;font-size:18px;font-weight:normal;color:var(--red);margin-bottom:3px;display:flex;gap:8px;align-items:baseline;}
#petition h4 span{flex:1;}
#petition h4 a{font-family:system-ui,sans-serif;font-size:11px;color:var(--ink2);cursor:pointer;text-decoration:underline;}
#petition .pt{font-family:'IM Fell English',Georgia,serif;font-size:14px;line-height:1.35;color:var(--ink);margin-bottom:8px;}
#petition .pf{font-size:10.5px;color:var(--ink2);font-style:italic;margin-top:4px;}
/* ---------- narrow screens: panels stop overlapping ---------- */
@media (max-width:900px){
  #chron{width:280px;}
  #insp{width:min(290px,calc(100vw - 20px));}
  #hint{display:none;}
}
@media (max-width:760px){ /* HUD: chips wrap, then the time controls take their own row */
  #hud{flex-wrap:wrap;row-gap:3px;gap:8px;padding:4px 8px;}
  #hud .chip{font-size:12px;}
  #datechip{font-size:14px !important;}
  #timec{margin-left:0;width:100%;justify-content:flex-end;}
  #timec button{min-width:28px;}
  #chron{top:auto;bottom:10px;left:10px;right:10px;width:auto;max-height:40vh;}
  #chron.min{bottom:10px;}
  #drawer{top:100px;width:min(270px,calc(100vw - 40px));}
  #drawertoggle{top:108px;left:min(280px,calc(100vw - 30px));}
  #insp,body.drawerclosed #insp{left:10px;bottom:auto;top:100px;}
  #beat{bottom:auto;top:100px;max-width:calc(100vw - 20px);}
  #petition{top:100px;}
  #placehint{white-space:normal;width:calc(100vw - 40px);text-align:center;}
}
</style>
</head>
<body>
<div id="gl"></div>
<div id="loading"><h1 id="loadtitle">ANNALS</h1><div id="loadline">Forging the realm…</div><div id="loadbar"><div></div></div></div>

<div id="hud">
  <span class="chip" id="datechip">—</span>
  <span class="chip" id="wxchip">☀</span>
  <span class="chip" id="crownchip"><img class="sig" id="crownsig" alt=""><b id="crownname">—</b></span>
  <span class="chip">⛁ <b id="treasury">0</b></span>
  <span class="chip">☺ <b id="realmpop">0</b></span>
  <span class="chip" id="legitchip" title="Legitimacy">♛ <b id="legit">0</b></span>
  <span class="chip" id="legacychip" title="Legacy of your dynasty">✦ <b id="legacy">0</b></span>
  <div id="timec">
    <button id="rulebtn" title="Rule the realm yourself: decrees, petitions, war orders">♛ Rule</button>
    <button data-s="0" title="Pause (Space)">⏸</button><button data-s="1">▶</button><button data-s="2" class="on">▶▶</button><button data-s="3">▶▶▶</button><button data-s="4">▶▶▶▶</button>
  </div>
</div>
<div id="watchdate">—</div>

<div id="chron">
  <header id="chronhead"><h2 id="chrontitle">The Annals</h2><button id="chronmin" title="Collapse / expand">▾</button></header>
  <div id="chronfilters">
    <button class="f on" data-f="all">All</button>
    <button class="f" data-f="crown">Crown</button>
    <button class="f" data-f="war">War</button>
    <button class="f" data-f="trade">Trade</button>
    <button class="f" data-f="fates">Fates</button>
  </div>
  <div id="chronlist"></div>
  <div id="chronfoot">
    <button id="btnexport">Export chronicle</button>
    <button id="btnshare">Copy share link</button>
  </div>
</div>

<div id="drawer">
  <div id="dtabs">
    <div class="t" data-t="crown">Crown</div>
    <div class="t on" data-t="rates">Rates</div>
    <div class="t" data-t="acts">Acts</div>
    <div class="t" data-t="over">Overlays</div>
    <div class="t" data-t="world">Realm</div>
  </div>
  <div id="dbody"></div>
</div>
<button id="drawertoggle" title="Hide / show the panel">◂</button>

<div id="insp">
  <button id="inspx">✕</button>
  <h3 id="insptitle">—</h3>
  <div class="sub" id="inspsub"></div>
  <div id="inspbody"></div>
  <div id="inspacts"></div>
  <button id="inspfollow">Follow</button>
</div>

<div id="beat"><div class="bt" id="beattext"></div><div class="bd" id="beatdate"></div></div>
<div id="placehint">Click the map to place — Esc to cancel</div>
<div id="petition"></div>
<div id="hint">drag orbit · right-drag pan · scroll zoom · click to inspect · Space pause · 1–4 speed · R rule · M map · C watch · H hide UI</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================================
   ANNALS — a living kingdom in a single file
   Everything procedural. Seed in the URL hash is the whole save file.
   ========================================================================= */
'use strict';

/* ---------------- RNG: sfc32, separate streams for gen & history -------- */
function sfc32(a,b,c,d){return function(){a>>>=0;b>>>=0;c>>>=0;d>>>=0;let t=(a+b)|0;a=b^b>>>9;b=c+(c<<3)|0;c=(c<<21|c>>>11);d=d+1|0;t=t+d|0;c=c+t|0;return(t>>>0)/4294967296;};}
function seedStreams(seed){
  function mix(n){n=Math.imul(n^n>>>15,n|1);n^=n+Math.imul(n^n>>>7,n|61);return(n^n>>>14)>>>0;}
  const s=seed>>>0;
  return {
    gen: sfc32(mix(s),mix(s+0x9e37),mix(s+0x85eb),mix(s+0xc2b2)),
    sim: sfc32(mix(s+0x1b87),mix(s+0x27d4),mix(s+0x1656),mix(s+0x9c83))
  };
}
let SEED=1234567, RS=null;
const rand=(st)=>RS[st]();
const randi=(st,n)=>Math.floor(RS[st]()*n);
const pick=(st,arr)=>arr[Math.floor(RS[st]()*arr.length)];
const chance=(st,p)=>RS[st]()<p;
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const dist2d=(ax,az,bx,bz)=>Math.hypot(ax-bx,az-bz);

/* ---------------- value noise + fBm ------------------------------------- */
function makeNoise(seed){
  const s=seed|0;
  function h(x,y){let n=(x|0)*374761393+(y|0)*668265263+s*1013904223;n=Math.imul(n^(n>>>13),1274126177);n^=n>>>16;return(n>>>0)/4294967296;}
  return function(x,y){
    const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;
    const u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
    return h(xi,yi)*(1-u)*(1-v)+h(xi+1,yi)*u*(1-v)+h(xi,yi+1)*(1-u)*v+h(xi+1,yi+1)*u*v;
  };
}
function fbm(n2,x,y,oct,lac,gain){
  let a=.5,f=1,s=0,norm=0;
  for(let i=0;i<oct;i++){s+=a*n2(x*f,y*f);norm+=a;a*=gain;f*=lac;}
  return s/norm;
}

/* ---------------- constants --------------------------------------------- */
const SIZE=6000, GRID=220, CELL=SIZE/GRID, SEA=0;
const GOODS=['grain','fish','timber','ore','tools','cloth','wine'];

/* ---------------- heraldry: procedural sigils to canvas ----------------- */
function makeSigil(hue,charge){
  const c=document.createElement('canvas');c.width=c.height=48;const g=c.getContext('2d');
  const f='#'+hue[0].toString(16).padStart(6,'0'), m='#'+hue[1].toString(16).padStart(6,'0');
  g.fillStyle=f;g.fillRect(0,0,48,48);
  g.fillStyle='rgba(0,0,0,.18)';g.fillRect(0,24,48,24);
  g.strokeStyle=m;g.fillStyle=m;g.lineWidth=3;g.lineCap='round';g.lineJoin='round';
  const P=(pts,close)=>{g.beginPath();g.moveTo(pts[0][0],pts[0][1]);for(let i=1;i<pts.length;i++)g.lineTo(pts[i][0],pts[i][1]);if(close)g.closePath();};
  switch(charge){
    case 'stag':P([[16,38],[16,22],[10,10],[16,18],[20,8],[24,16],[28,8],[32,18],[38,10],[32,22],[32,38]]);g.stroke();break;
    case 'tower':P([[16,40],[16,16],[13,16],[13,10],[19,10],[19,14],[22,14],[22,10],[26,10],[26,14],[29,14],[29,10],[35,10],[35,16],[32,16],[32,40]],true);g.fill();break;
    case 'wave':g.beginPath();for(let i=0;i<3;i++){g.moveTo(8,18+i*8);g.bezierCurveTo(18,12+i*8,30,24+i*8,40,18+i*8);}g.stroke();break;
    case 'oak':g.beginPath();g.arc(24,18,10,0,7);g.fill();g.fillRect(21,24,6,16);break;
    case 'wolf':P([[12,38],[18,20],[14,12],[22,18],[26,10],[30,18],[36,14],[32,24],[36,38]],true);g.fill();break;
    case 'comet':g.beginPath();g.arc(32,14,6,0,7);g.fill();g.lineWidth=4;P([[28,18],[10,38]]);g.stroke();break;
    case 'key':g.beginPath();g.arc(24,14,6,0,7);g.stroke();g.fillRect(22,20,4,18);g.fillRect(26,30,6,3);g.fillRect(26,35,8,3);break;
    case 'sun':g.beginPath();g.arc(24,24,8,0,7);g.fill();for(let i=0;i<8;i++){const a=i*Math.PI/4;P([[24+Math.cos(a)*11,24+Math.sin(a)*11],[24+Math.cos(a)*17,24+Math.sin(a)*17]]);g.stroke();}break;
    case 'crescent':g.beginPath();g.arc(24,24,11,0,7);g.fill();g.fillStyle=f;g.beginPath();g.arc(29,21,10,0,7);g.fill();break;
    case 'crown':P([[12,34],[12,20],[18,26],[24,14],[30,26],[36,20],[36,34]],true);g.fill();break;
    case 'swords':P([[12,10],[36,38]]);g.stroke();P([[36,10],[12,38]]);g.stroke();g.fillRect(20,32,8,4);break;
    case 'fish':g.beginPath();g.ellipse(22,24,12,6,0,0,7);g.fill();P([[34,24],[42,17],[42,31]],true);g.fill();break;
    case 'raven':P([[14,36],[20,22],[16,14],[26,18],[34,10],[30,22],[34,30],[24,28]],true);g.fill();break;
    case 'rose':for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;g.beginPath();g.arc(24+Math.cos(a)*7,22+Math.sin(a)*7,5,0,7);g.fill();}g.fillStyle=f;g.beginPath();g.arc(24,22,3,0,7);g.fill();break;
    case 'anchor':g.beginPath();g.arc(24,12,4,0,7);g.stroke();g.fillRect(22,16,4,18);g.beginPath();g.arc(24,30,10,0.3,Math.PI-0.3);g.stroke();break;
    default:g.beginPath();g.moveTo(24,8);g.lineTo(30,26);g.lineTo(24,40);g.lineTo(18,26);g.closePath();g.fill();
  }
  return c;
}

/* =========================================================================
   WORLD GENERATION — runs once per seed, deterministic from the gen stream
   ========================================================================= */
const cIdx=(cx,cz)=>cz*GRID+cx;
const inB=(cx,cz)=>cx>=0&&cz>=0&&cx<GRID&&cz<GRID;
const cellX=(cx)=>cx*CELL-SIZE/2;   // lattice-aligned with the terrain mesh vertices
const cellZ=(cz)=>cz*CELL-SIZE/2;
const toCell=(x)=>clamp(Math.round((x+SIZE/2)/CELL),0,GRID-1);

function hAt(x,z){ // exact height of the RENDERED surface: PlaneGeometry splits each quad along
  // its (0,1)-(1,0) diagonal, so bilinear sampling put roads, walls and houses metres off the ground
  const fx=clamp((x+SIZE/2)/CELL,0,GRID-1.001), fz=clamp((z+SIZE/2)/CELL,0,GRID-1.001);
  const x0=Math.floor(fx),z0=Math.floor(fz),tx=fx-x0,tz=fz-z0,h=W.h;
  const h00=h[cIdx(x0,z0)],h10=h[cIdx(x0+1,z0)],h01=h[cIdx(x0,z0+1)],h11=h[cIdx(x0+1,z0+1)];
  return tx+tz<=1?h00+(h10-h00)*tx+(h01-h00)*tz:h11+(h01-h11)*(1-tx)+(h10-h11)*(1-tz);
}
/* ---------------- polyline helpers ---------------------------------------- */
function polyLen(p){let L=0;for(let k=1;k<p.length;k++)L+=dist2d(p[k-1].x,p[k-1].z,p[k].x,p[k].z);return L;}
function lerpPt(a,b,f){const o={x:lerp(a.x,b.x,f),z:lerp(a.z,b.z,f)};if(a.w!==undefined)o.w=lerp(a.w,b.w??a.w,f);return o;}
function resample(p,step){ // evenly spaced points along a polyline (keeps both ends)
  if(p.length<2)return p.map(q=>({...q}));
  const out=[{...p[0]}];let need=step;
  for(let i=1;i<p.length;i++){
    const a=p[i-1],b=p[i],L=dist2d(a.x,a.z,b.x,b.z);let pos=0;
    while(L-pos>=need){pos+=need;out.push(lerpPt(a,b,pos/L));need=step;}
    need-=L-pos;
  }
  const last=p[p.length-1],o=out[out.length-1];
  if(dist2d(o.x,o.z,last.x,last.z)>step*0.35)out.push({...last});else out[out.length-1]={...last};
  return out;
}
function smoothPath(p,iters){ // [1 2 1] passes; the ends stay pinned
  let q=p.map(o=>({...o}));
  for(let k=0;k<iters;k++){
    const r=q.map(o=>({...o}));
    for(let i=1;i<q.length-1;i++){
      r[i].x=(q[i-1].x+q[i].x*2+q[i+1].x)/4;r[i].z=(q[i-1].z+q[i].z*2+q[i+1].z)/4;
      if(q[i].w!==undefined)r[i].w=(q[i-1].w+q[i].w*2+q[i+1].w)/4;
    }
    q=r;
  }
  return q;
}
function segDist(px,pz,a,b){const dx=b.x-a.x,dz=b.z-a.z,L2=dx*dx+dz*dz||1;const t=clamp(((px-a.x)*dx+(pz-a.z)*dz)/L2,0,1);return Math.hypot(px-(a.x+dx*t),pz-(a.z+dz*t));}
function slopeAt(cx,cz){
  const h=W.h,c=h[cIdx(cx,cz)];let m=0;
  for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]])if(inB(cx+dx,cz+dz))m=Math.max(m,Math.abs(h[cIdx(cx+dx,cz+dz)]-c));
  return m/CELL;
}

async function generateWorld(seed,progress){
  SEED=seed>>>0; RS=seedStreams(SEED);
  const n1=makeNoise(SEED^0xA53), n2=makeNoise(SEED^0x5EED), n3=makeNoise(SEED^0xF00D), nMoist=makeNoise(SEED^0xB0A);
  W={seed:SEED,h:new Float32Array(GRID*GRID),water:new Uint8Array(GRID*GRID),flow:new Float32Array(GRID*GRID),
     biome:new Uint8Array(GRID*GRID),moist:new Float32Array(GRID*GRID),
     settlements:[],roads:[],routes:{},houses:[],notables:[],armies:[],caravans:[],banditCamps:[],
     riverPaths:[],bridges:[],roadCells:new Uint8Array(GRID*GRID),treasury:2200,legitimacy:70,
     clock:{day:0},weather:{state:'clear',t:0,wind:rand('gen')*Math.PI*2},snowpack:0,drought:false,flooding:0,
     war:null,truceUntil:0,plagueActive:false,comet:null,eclipse:0,prophet:null,
     dragon:null,monarch:null,reignStart:0,reignNum:{},name:placeName(),kingdomAdj:null,
     stats:{battles:0,greatFires:0}};

  await progress('Raising the bones of the earth…',0.05);
  /* --- terrain: fBm + domain warp + mountain spine + optional coast ----- */
  const spineA=rand('gen')*Math.PI, spineOff=(rand('gen')-0.5)*0.5;
  const coastal=rand('gen')<0.42, coastEdge=randi('gen',4); // 0=N 1=E 2=S 3=W
  const ca=Math.cos(spineA),sa=Math.sin(spineA);
  for(let cz=0;cz<GRID;cz++)for(let cx=0;cx<GRID;cx++){
    const u=cx/GRID-0.5,v=cz/GRID-0.5;
    const wx=fbm(n3,u*3+9,v*3,3,2,.5)-.5, wz=fbm(n3,u*3,v*3+7,3,2,.5)-.5; // domain warp
    let e=fbm(n1,(u+wx*.35)*4,(v+wz*.35)*4,5,2,.5);
    e=Math.pow(e,1.35);
    // mountain spine along a line through the map
    const d=Math.abs((u*ca+v*sa)-spineOff);
    const ridge=Math.exp(-d*d/(2*0.055*0.055))*(0.55+0.45*fbm(n2,u*7,v*7,4,2,.5));
    e=e*0.55+ridge*0.6;
    // gentle falloff at map rim so the world reads as an island of relevance
    const rim=Math.max(Math.abs(u),Math.abs(v))*2;
    e*=1-Math.pow(Math.max(0,rim-0.82)/0.18,2)*0.85;
    let hgt=e*760-20;
    if(coastal){
      const t=[v+0.5,0.5-u,0.5-v,u+0.5][coastEdge]; // distance from coast edge 0..1
      hgt-=Math.pow(Math.max(0,0.30-t)/0.30,1.6)*240;
    }
    W.h[cIdx(cx,cz)]=hgt;
    W.moist[cIdx(cx,cz)]=fbm(nMoist,u*5+3,v*5+11,4,2,.5);
  }
  // normalize: ensure some land above sea
  let maxh=-1e9;for(let i=0;i<W.h.length;i++)maxh=Math.max(maxh,W.h[i]);
  if(maxh<400)for(let i=0;i<W.h.length;i++)W.h[i]*=400/maxh;

  await progress('Carving the rivers…',0.2);
  /* --- hydrology: fill depressions, then flow accumulation, carve rivers --
     Priority-flood fill guarantees every cell drains monotonically to the
     map rim or the sea, so rivers always run from the highlands down. */
  {
    const visited=new Uint8Array(GRID*GRID);
    const heap=[];
    const hpush=(h,i)=>{heap.push([h,i]);let k=heap.length-1;
      while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;const t=heap[p];heap[p]=heap[k];heap[k]=t;k=p;}};
    const hpop=()=>{const top=heap[0],last=heap.pop();
      if(heap.length){heap[0]=last;let k=0;
        for(;;){const l=k*2+1,r=l+1;let m=k;
          if(l<heap.length&&heap[l][0]<heap[m][0])m=l;
          if(r<heap.length&&heap[r][0]<heap[m][0])m=r;
          if(m===k)break;const t=heap[m];heap[m]=heap[k];heap[k]=t;k=m;}}
      return top;};
    for(let cx=0;cx<GRID;cx++){for(const cz of[0,GRID-1]){const i=cIdx(cx,cz);if(!visited[i]){visited[i]=1;hpush(W.h[i],i);}}}
    for(let cz=0;cz<GRID;cz++){for(const cx of[0,GRID-1]){const i=cIdx(cx,cz);if(!visited[i]){visited[i]=1;hpush(W.h[i],i);}}}
    while(heap.length){
      const[hh,c]=hpop();
      const cx=c%GRID,cz=(c/GRID)|0;
      for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dz)continue;const nx=cx+dx,nz=cz+dz;
        if(!inB(nx,nz))continue;const ni=cIdx(nx,nz);
        if(visited[ni])continue;
        visited[ni]=1;
        if(W.h[ni]<hh+0.05)W.h[ni]=hh+0.05; // fill pits just enough to drain
        hpush(W.h[ni],ni);
      }
    }
  }
  const order=[];for(let i=0;i<GRID*GRID;i++)order.push(i);
  order.sort((a,b)=>W.h[b]-W.h[a]);
  const down=new Int32Array(GRID*GRID).fill(-1);
  for(const i of order){
    const cx=i%GRID,cz=(i/GRID)|0;let best=-1,bh=W.h[i];
    for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dz)continue;const nx=cx+dx,nz=cz+dz;
      if(inB(nx,nz)&&W.h[cIdx(nx,nz)]<bh){bh=W.h[cIdx(nx,nz)];best=cIdx(nx,nz);}
    }
    down[i]=best;
  }
  for(let i=0;i<GRID*GRID;i++)W.flow[i]=1;
  for(const i of order){if(down[i]>=0)W.flow[down[i]]+=W.flow[i];}
  // mark sea
  for(let i=0;i<GRID*GRID;i++)if(W.h[i]<=SEA)W.water[i]=1;
  // major river: highest-accumulation land cell, trace to sea/edge; plus tributaries via threshold
  const RIVT=140;
  for(let i=0;i<GRID*GRID;i++)if(W.flow[i]>RIVT&&!W.water[i])W.water[i]=2;
  // guarantee one major river: from best mountain source follow down
  let srcBest=-1,srcScore=-1;
  for(let i=0;i<GRID*GRID;i++){if(W.h[i]>250&&W.flow[i]>20&&W.flow[i]*W.h[i]>srcScore&&down[i]>=0){srcScore=W.flow[i]*W.h[i];srcBest=i;}}
  if(srcBest>=0){let c=srcBest,guard=0;while(c>=0&&guard++<2000){if(!W.water[c])W.water[c]=2;if(W.h[c]<=SEA)break;c=down[c];}}
  // carve river cells & record paths for rendering
  const isRiv=(i)=>W.water[i]===2;
  { // carve a soft valley, not a one-cell trench (the trench read as blocky diamonds)
    const carve=new Float32Array(GRID*GRID);
    for(let i=0;i<GRID*GRID;i++)if(isRiv(i)){
      const dep=Math.min(7,2+W.flow[i]*0.004),cx=i%GRID,cz=(i/GRID)|0;
      for(let dz=-2;dz<=2;dz++)for(let dx=-2;dx<=2;dx++){
        if(!inB(cx+dx,cz+dz))continue;const j=cIdx(cx+dx,cz+dz);
        const f=Math.pow(clamp(1-Math.hypot(dx,dz)/2.3,0,1),1.4);
        if(dep*f>carve[j])carve[j]=dep*f;
      }
    }
    for(let i=0;i<GRID*GRID;i++)if(carve[i]>0)W.h[i]=W.water[i]?W.h[i]-carve[i]:Math.max(W.h[i]-carve[i],Math.min(W.h[i],0.6));
  }
  // collect river polylines (from sources: river cells whose upstream has no river)
  const hasUp=new Uint8Array(GRID*GRID);
  for(let i=0;i<GRID*GRID;i++)if(isRiv(i)&&down[i]>=0&&isRiv(down[i]))hasUp[down[i]]=1;
  for(let i=0;i<GRID*GRID;i++)if(isRiv(i)&&!hasUp[i]){
    const path=[];let c=i,guard=0;
    while(c>=0&&guard++<2500){path.push({x:cellX(c%GRID),z:cellZ((c/GRID)|0),w:Math.min(34,6+W.flow[c]*0.012),h:W.h[c]});if(!isRiv(c))break;c=down[c];}
    if(path.length>4)W.riverPaths.push(path);
  }
  W.coastal=coastal;
  W.down=down; // drainage graph — reused for river barge routes

  await progress('Seeding meadow and forest…',0.35);
  /* --- biomes ------------------------------------------------------------ */
  for(let cz=0;cz<GRID;cz++)for(let cx=0;cx<GRID;cx++){
    const i=cIdx(cx,cz),h=W.h[i],m=W.moist[i],sl=slopeAt(cx,cz);
    if(W.water[i]===1){W.biome[i]=B.WATER;continue;}
    if(W.water[i]===2){W.biome[i]=B.WATER;continue;}
    let nearWater=false;
    for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++)if(inB(cx+dx,cz+dz)&&W.water[cIdx(cx+dx,cz+dz)])nearWater=true;
    if(h>560)W.biome[i]=B.SNOW;
    else if(h>430||sl>0.55)W.biome[i]=B.ROCK;
    else if(h>300&&m>0.35)W.biome[i]=B.PINE;
    else if(h<12&&nearWater&&m>0.55)W.biome[i]=B.MARSH;
    else if(m>0.58&&h<330)W.biome[i]=B.FOREST;
    else if(sl<0.12&&h<180&&m>0.32)W.biome[i]=B.FARM;
    else W.biome[i]=B.MEADOW;
  }

  await progress('Founding the settlements…',0.5);
  /* --- settlement siting -------------------------------------------------- */
  const score=(cx,cz)=>{
    const i=cIdx(cx,cz);
    if(W.water[i]||W.h[i]<3||W.h[i]>260)return -1;
    let s=0,riv=false,sea=false,farm=0,forest=0;
    for(let dz=-3;dz<=3;dz++)for(let dx=-3;dx<=3;dx++){
      if(!inB(cx+dx,cz+dz))continue;const j=cIdx(cx+dx,cz+dz);
      if(W.water[j]===2)riv=true;if(W.water[j]===1)sea=true;
      if(W.biome[j]===B.FARM)farm++;if(W.biome[j]===B.FOREST||W.biome[j]===B.PINE)forest++;
    }
    s+=riv?30:0;s+=sea?26:0;s+=farm*1.2;s+=Math.min(forest,8)*0.5;
    s-=slopeAt(cx,cz)*90;s-=W.h[i]*0.05;
    // flat buildable area
    let flat=0;for(let dz=-2;dz<=2;dz++)for(let dx=-2;dx<=2;dx++)if(inB(cx+dx,cz+dz)&&slopeAt(cx+dx,cz+dz)<0.15&&!W.water[cIdx(cx+dx,cz+dz)])flat++;
    s+=flat*0.9;
    return s;
  };
  const cand=[];
  for(let cz=4;cz<GRID-4;cz+=2)for(let cx=4;cx<GRID-4;cx+=2){const s=score(cx,cz);if(s>20)cand.push({cx,cz,s});}
  cand.sort((a,b)=>b.s-a.s);
  const nTowns=2+randi('gen',2), nVill=3+randi('gen',3);
  const wanted=[{kind:'capital',pop:2200+randi('gen',700),minD:0},
    ...Array.from({length:nTowns},()=>({kind:'town',pop:420+randi('gen',760),minD:850})),
    ...Array.from({length:nVill},()=>({kind:'village',pop:70+randi('gen',220),minD:520}))];
  for(const w of wanted){
    let placed=false;
    for(const c of cand){
      const x=cellX(c.cx),z=cellZ(c.cz);
      if(W.settlements.every(s=>dist2d(x,z,s.pos.x,s.pos.z)>Math.max(w.minD,520))){
        const i=cIdx(c.cx,c.cz);
        let sea=false,riv=false;
        for(let dz=-3;dz<=3;dz++)for(let dx=-3;dx<=3;dx++)if(inB(c.cx+dx,c.cz+dz)){if(W.water[cIdx(c.cx+dx,c.cz+dz)]===1)sea=true;if(W.water[cIdx(c.cx+dx,c.cz+dz)]===2)riv=true;}
        W.settlements.push({
          name:placeName(),kind:w.kind,pos:{x,z,y:W.h[i]},cx:c.cx,cz:c.cz,pop:w.pop,
          prosperity:50,unrest:8,walls:w.kind==='capital'?2:(w.kind==='town'&&chance('gen',0.5)?1:0),
          stores:{grain:w.pop*0.5,fish:sea?w.pop*0.3:8,timber:40,ore:10,tools:15,cloth:10,wine:8},
          harbor:sea,river:riv,owner:0,buildings:[],garrison:Math.round(w.pop*0.04),
          infected:0,recovered:0,plagueDead:0,fires:[],ruinCount:0,pyres:false,
          festivalUntil:0,siegeBy:null,revolted:false,growthClock:0,lastRaid:-999
        });
        placed=true;break;
      }
    }
    if(!placed&&cand.length){const c=cand[randi('gen',Math.min(80,cand.length))];/* fallback ignore spacing */}
  }
  // ensure at least capital + 4 others exist
  W.capital=W.settlements[0];

  await progress('Laying the king’s roads…',0.62);
  buildRoads();

  await progress('Raising timber and stone…',0.75);
  for(const s of W.settlements)layoutSettlement(s);
  stitchRoads();

  await progress('Blazoning the great houses…',0.88);
  makeHousesAndCast();

  /* dragon lair at highest peak */
  let peak=0;for(let i=1;i<GRID*GRID;i++)if(W.h[i]>W.h[peak])peak=i;
  W.dragon={name:pick('gen',NAMEB.dragon),lair:{x:cellX(peak%GRID),z:cellZ((peak/GRID)|0),y:W.h[peak]},
    state:'sleeping',hoard:800,pos:null,path:null,target:null,mood:'slumbering',wakes:0};

  await progress('Opening the annals…',0.97);
}

/* ---------------- roads: A* over slope/water cost field ------------------ */
function buildRoads(){
  const cost=(a,b)=>{ // between neighboring cells
    const dh=Math.abs(W.h[a]-W.h[b])/CELL;
    let c=1+dh*dh*46;
    if(W.water[b]===1)return 1e9;
    if(W.water[b]===2)c+=26; // bridge
    const bi=W.biome[b];
    if(bi===B.FOREST||bi===B.PINE)c+=2.2;
    if(bi===B.MARSH)c+=6;if(bi===B.ROCK)c+=7;if(bi===B.SNOW)c+=14;
    return c;
  };
  function astar(s,t){
    // binary-heap A* — cheap enough to search the whole grid, so mountain
    // crossings get real switchback roads instead of falling back
    const g=new Float64Array(GRID*GRID).fill(Infinity);
    const from=new Int32Array(GRID*GRID).fill(-1);
    const closed=new Uint8Array(GRID*GRID);
    const heap=[];
    const hpush=(f,i)=>{heap.push([f,i]);let k=heap.length-1;
      while(k>0){const p=(k-1)>>1;if(heap[p][0]<=heap[k][0])break;const t2=heap[p];heap[p]=heap[k];heap[k]=t2;k=p;}};
    const hpop=()=>{const top=heap[0],last=heap.pop();
      if(heap.length){heap[0]=last;let k=0;
        for(;;){const l=k*2+1,r=l+1;let m=k;
          if(l<heap.length&&heap[l][0]<heap[m][0])m=l;
          if(r<heap.length&&heap[r][0]<heap[m][0])m=r;
          if(m===k)break;const t2=heap[m];heap[m]=heap[k];heap[k]=t2;k=m;}}
      return top;};
    const tx=t%GRID,tz=(t/GRID)|0;
    const hx=(i)=>Math.hypot(i%GRID-tx,((i/GRID)|0)-tz);
    g[s]=0;hpush(hx(s),s);
    let guard=0;
    while(heap.length&&guard++<200000){
      const cur=hpop()[1];
      if(closed[cur])continue;
      closed[cur]=1;
      if(cur===t)break;
      const cx=cur%GRID,cz=(cur/GRID)|0,gc=g[cur];
      for(let dz=-1;dz<=1;dz++)for(let dx=-1;dx<=1;dx++){
        if(!dx&&!dz)continue;const nx=cx+dx,nz=cz+dz;if(!inB(nx,nz))continue;
        const ni=cIdx(nx,nz);
        if(closed[ni])continue;
        const step=cost(cur,ni)*(dx&&dz?1.414:1);
        if(step>1e8)continue;
        const ng=gc+step;
        if(ng<g[ni]){g[ni]=ng;from[ni]=cur;hpush(ng+hx(ni),ni);}
      }
    }
    if(from[t]<0&&s!==t)return null;
    const path=[];let c=t;while(c>=0&&c!==s){path.push(c);c=from[c];}path.push(s);path.reverse();
    return path;
  }
  const connected=[0];
  for(let i=1;i<W.settlements.length;i++){
    // connect to nearest connected settlement
    let bj=-1,bd=1e18;
    for(const j of connected){const d=dist2d(W.settlements[i].pos.x,W.settlements[i].pos.z,W.settlements[j].pos.x,W.settlements[j].pos.z);if(d<bd){bd=d;bj=j;}}
    const a=W.settlements[i],b=W.settlements[bj];
    const cells=astar(cIdx(a.cx,a.cz),cIdx(b.cx,b.cz));
    if(cells){
      // an 8-connected A* path is a staircase; resample and relax it into a surveyor's curve
      const raw=cells.map(c=>({x:cellX(c%GRID),z:cellZ((c/GRID)|0)}));
      const path=resample(smoothPath(resample(raw,9),14),8);
      for(const c of cells)if(!W.water[c])W.roadCells[c]=1;
      W.roads.push({a:i,b:bj,path,len:polyLen(path)});
    }else{
      // no path found: lay a terrain-following track so the route is at least visible
      const path=[];const n=Math.max(2,Math.round(bd/25));
      for(let k=0;k<=n;k++){
        const x=lerp(a.pos.x,b.pos.x,k/n),z=lerp(a.pos.z,b.pos.z,k/n);
        path.push({x,z});
        const ci2=cIdx(toCell(x),toCell(z));
        if(!W.water[ci2])W.roadCells[ci2]=1;
      }
      W.roads.push({a:i,b:bj,path,len:bd});
    }
    connected.push(i);
  }
  // settlement-graph routing (BFS), route(a,b) => polyline
  W.adj={};W.settlements.forEach((s,i)=>W.adj[i]=[]);
  W.roads.forEach((r,ri)=>{W.adj[r.a].push({to:r.b,ri});W.adj[r.b].push({to:r.a,ri});});
}
function route(ai,bi){
  const key=ai+'_'+bi;
  if(W.routes[key])return W.routes[key];
  // BFS
  const prev={};const q=[ai];prev[ai]=null;
  while(q.length){const c=q.shift();if(c===bi)break;for(const e of W.adj[c])if(!(e.to in prev)){prev[e.to]=c;q.push(e.to);}}
  if(!(bi in prev))return null;
  const hops=[];let c=bi;while(prev[c]!==null){hops.push([prev[c],c]);c=prev[c];}hops.reverse();
  let poly=[];
  for(const[f,t]of hops){
    const r=W.roads.find(r=>(r.a===f&&r.b===t)||(r.a===t&&r.b===f));
    let seg=r.path.slice();
    if(r.a!==f)seg.reverse();
    if(poly.length)seg=seg.slice(1);
    poly=poly.concat(seg);
  }
  let len=0;for(let k=1;k<poly.length;k++)len+=dist2d(poly[k-1].x,poly[k-1].z,poly[k].x,poly[k].z);
  const res={poly,len};W.routes[key]=res;
  return res;
}
/* river barge routing: two settlements are river-linked if their drainage
   traces meet — same river, or tributary joining the main stem */
function traceDown(ci){
  const seq=[];let c=ci,g=0;
  while(c>=0&&g++<3000){seq.push(c);if(W.h[c]<=SEA)break;c=W.down[c];}
  return seq;
}
function riverRoute(ai,bi){
  const A=W.settlements[ai],Bs=W.settlements[bi];
  if(A.rivCell==null||Bs.rivCell==null)return null;
  const sa=traceDown(A.rivCell),sb=traceDown(Bs.rivCell);
  const setB=new Map(sb.map((c,j)=>[c,j]));
  let mi=-1,mj=-1;
  for(let i=0;i<sa.length;i++){if(setB.has(sa[i])){mi=i;mj=setB.get(sa[i]);break;}}
  if(mi<0)return null;
  const cells=sa.slice(0,mi+1).concat(sb.slice(0,mj).reverse());
  if(cells.length<4)return null;
  const poly=cells.map(c=>({x:cellX(c%GRID),z:cellZ((c/GRID)|0)}));
  let len=0;for(let k=1;k<poly.length;k++)len+=dist2d(poly[k-1].x,poly[k-1].z,poly[k].x,poly[k].z);
  return {poly,len};
}

/* ---------------- settlement layout: streets, lots, buildings ------------
   Streets radiate from a market square (each king's road enters along its
   own spoke), ring lanes cross them, and buildings stand shoulder to
   shoulder along the frontages, facing the street, filled from the square
   outward. Unused frontage — gaps, outer lanes, the roads out of town —
   becomes the growth queue, so new roofs extend streets instead of
   scattering. A private RNG per town keeps layout tweaks from reshuffling
   the rest of the world. */
function layoutRng(idx){return seedStreams((SEED^Math.imul(idx+1,0x9E3779B1))>>>0).gen;}
function obbCorners(x,z,w,d,rot){ // footprint corners; three.js Y-rotation maps local x→(cos,−sin)
  const c=Math.cos(rot),sn=Math.sin(rot),o=[];
  for(const[ox,oz]of[[w/2,d/2],[-w/2,d/2],[-w/2,-d/2],[w/2,-d/2]])o.push({x:x+ox*c+oz*sn,z:z-ox*sn+oz*c});
  return o;
}
function obbOverlap(A,B){ // separating-axis test on two footprints {x,z,w,d,rot}
  const ca=obbCorners(A.x,A.z,A.w,A.d,A.rot),cb=obbCorners(B.x,B.z,B.w,B.d,B.rot);
  for(const o of[A,B]){
    const c=Math.cos(o.rot),sn=Math.sin(o.rot);
    for(const[ax,az]of[[c,-sn],[sn,c]]){
      let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
      for(const p of ca){const v=p.x*ax+p.z*az;if(v<a0)a0=v;if(v>a1)a1=v;}
      for(const p of cb){const v=p.x*ax+p.z*az;if(v<b0)b0=v;if(v>b1)b1=v;}
      if(a1<b0||b1<a0)return false;
    }
  }
  return true;
}
function makeHash(cs){ // tiny spatial hash for footprints and street segments
  const m=new Map(),key=(i,j)=>i*100003+j;
  return{
    add(o,r){for(let i=Math.floor((o.x-r)/cs);i<=Math.floor((o.x+r)/cs);i++)for(let j=Math.floor((o.z-r)/cs);j<=Math.floor((o.z+r)/cs);j++){
      const k=key(i,j);let a=m.get(k);if(!a)m.set(k,a=[]);a.push(o);}},
    near(x,z,r){const out=new Set();
      for(let i=Math.floor((x-r)/cs);i<=Math.floor((x+r)/cs);i++)for(let j=Math.floor((z-r)/cs);j<=Math.floor((z+r)/cs);j++){
        const a=m.get(key(i,j));if(a)for(const o of a)out.add(o);}
      return out;}
  };
}
function groundBuilding(b){ // floor on the highest corner, foundations down to the lowest
  let lo=1e9,hi=-1e9;
  for(const c of obbCorners(b.x,b.z,b.w,b.d,b.rot)){const y=hAt(c.x,c.z);if(y<lo)lo=y;if(y>hi)hi=y;}
  const yc=hAt(b.x,b.z);lo=Math.min(lo,yc);hi=Math.max(hi,yc);
  b.y=hi;b.y0=lo-0.8;
}
function frontFoot(c,arch,tier,rnd){ // a footprint set back from the street edge, facing it
  const a=ARCH[arch],k=0.85+tier*0.15;
  const w=a[0]*k*(0.92+rnd()*0.16),d=a[1]*k*(0.92+rnd()*0.16);
  const set=c.hw+0.9+d/2+(tier===0?rnd()*1.6:rnd()*0.4);
  const px=-c.uz*c.side,pz=c.ux*c.side;
  return{x:c.mx+px*set,z:c.mz+pz*set,w,d,rot:-Math.atan2(c.uz,c.ux)};
}
function layoutSettlement(s){
  const idx=W.settlements.indexOf(s),rng=layoutRng(idx),rr=()=>rng(),rpick=a=>a[Math.floor(rng()*a.length)];
  const isCap=s.kind==='capital',isTown=s.kind==='town';
  const R=isCap?240:isTown?150:70; // walled/initial core radius
  s.radius=R+40;s.coreR=R;s.wallR=R+14;s.plazaR=isCap?24:isTown?17:11;
  const count=Math.min(isCap?Math.round(s.pop/4):Math.round(s.pop/4.2),isCap?620:isTown?280:48);
  const buildable=(x,z)=>{const ci=toCell(x),cj=toCell(z);const i=cIdx(ci,cj);return !W.water[i]&&slopeAt(ci,cj)<0.35&&W.h[i]>1;};
  /* spokes: each king's road gets its own, then lanes spread into the widest gaps */
  const spokes=[];
  W.roads.forEach((r,ri)=>{
    if(r.a!==idx&&r.b!==idx)return;
    const path=r.a===idx?r.path:[...r.path].reverse();
    let q=path[path.length-1];
    for(const p of path)if(dist2d(p.x,p.z,s.pos.x,s.pos.z)>R*0.8){q=p;break;}
    spokes.push({a:Math.atan2(q.z-s.pos.z,q.x-s.pos.x),road:ri});
  });
  const nd=isCap?6:isTown?4:3;
  for(let t=0;t<60&&spokes.length<nd;t++){
    const a=rr()*Math.PI*2;
    if(spokes.every(o=>Math.abs(Math.atan2(Math.sin(a-o.a),Math.cos(a-o.a)))>0.75))spokes.push({a,road:null});
  }
  const HW=isCap?3.4:isTown?3:2.4; // street half-width
  s.streets=[];s.roadSpoke={};s.spokeDirs=[];
  for(const sp of spokes){
    const pts=[];let a=sp.a;
    const reach=sp.road!=null?R:R*(s.kind==='village'?1.9:1.45); // lanes run on past the walls into the fields
    for(let r=s.plazaR;r<=reach+0.1;r+=10){
      a+=(rr()-0.5)*0.07;
      const x=s.pos.x+Math.cos(a)*r,z=s.pos.z+Math.sin(a)*r;
      if(!buildable(x,z))break;
      pts.push({x,z});
    }
    if(pts.length>=2){s.streets.push({pts,hw:HW,kind:'spoke'});s.spokeDirs.push(sp.a);if(sp.road!=null)s.roadSpoke[sp.road]=pts;}
  }
  for(const rf of isCap?[0.34,0.58,0.83]:isTown?[0.42,0.77]:[]){
    const rr2=R*rf;let pts=[];
    const n=Math.max(12,Math.round(rr2*2*Math.PI/10));
    for(let i=0;i<=n;i++){
      const a=i/n*Math.PI*2,x=s.pos.x+Math.cos(a)*rr2,z=s.pos.z+Math.sin(a)*rr2;
      if(!buildable(x,z)){if(pts.length>=3)s.streets.push({pts,hw:HW*0.8,kind:'ring'});pts=[];continue;}
      pts.push({x,z});
    }
    if(pts.length>=3)s.streets.push({pts,hw:HW*0.8,kind:'ring'});
  }
  /* obstacles: streets, and king's roads outside the core */
  const segH=makeHash(24),roadHW=5;
  const addSeg=(a,b,hw)=>{const o={a,b,hw,x:(a.x+b.x)/2,z:(a.z+b.z)/2};segH.add(o,dist2d(a.x,a.z,b.x,b.z)/2+hw+2);};
  for(const st of s.streets)for(let i=0;i<st.pts.length-1;i++)addSeg(st.pts[i],st.pts[i+1],st.hw);
  const roadRuns=[];
  for(const r of W.roads){
    let run=[];
    for(let i=0;i<r.path.length;i++){
      const p=r.path[i],d=dist2d(p.x,p.z,s.pos.x,s.pos.z);
      if(i&&d>R*0.95&&d<R*2.2)addSeg(r.path[i-1],p,roadHW);
      if(d>R+18&&d<R*1.9)run.push(p);else{if(run.length>1)roadRuns.push(run);run=[];}
    }
    if(run.length>1)roadRuns.push(run);
  }
  /* frontage candidates every few metres, nearest the square first */
  const cands=[];
  const frontage=(pts,hw,tag,jit)=>{
    for(let i=0;i<pts.length-1;i++){
      const a=pts[i],b=pts[i+1],dx=b.x-a.x,dz=b.z-a.z,L=Math.hypot(dx,dz)||1,ux=dx/L,uz=dz/L;
      for(let t=0;t<L;t+=3.5){
        const mx=a.x+ux*t,mz=a.z+uz*t;
        for(const side of[-1,1])cands.push({mx,mz,ux,uz,side,hw,tag,d:dist2d(mx,mz,s.pos.x,s.pos.z)+rr()*jit});
      }
    }
  };
  for(const st of s.streets)frontage(st.pts,st.hw,st.kind,10);
  for(const run of roadRuns)frontage(run,roadHW,'road',40);
  cands.sort((p,q)=>p.d-q.d);
  /* placement */
  const placed=makeHash(16);
  const probe=(f)=>{const c=obbCorners(f.x,f.z,f.w,f.d,f.rot),o=[...c,{x:f.x,z:f.z}];
    for(let i=0;i<4;i++)o.push({x:(c[i].x+c[(i+1)%4].x)/2,z:(c[i].z+c[(i+1)%4].z)/2});return o;};
  const fits=(f,gap,noBuild)=>{
    let inside=0,outside=0;
    for(const c of probe(f)){
      if(!noBuild&&!buildable(c.x,c.z))return false;
      const dc=dist2d(c.x,c.z,s.pos.x,s.pos.z);
      if(dc<s.plazaR+1.5)return false;
      if(Math.abs(dc-s.wallR)<5)return false; // keep the wall line clear (walls may be raised later)
      if(dc<s.wallR)inside++;else outside++;
      for(const g of segH.near(c.x,c.z,1))if(segDist(c.x,c.z,g.a,g.b)<g.hw+0.8)return false;
    }
    if(inside&&outside)return false; // straddling the wall line
    const r=Math.hypot(f.w,f.d)/2+gap;
    const F={x:f.x,z:f.z,w:f.w+gap*2,d:f.d+gap*2,rot:f.rot};
    for(const o of placed.near(f.x,f.z,r))if(obbOverlap(F,o))return false;
    return true;
  };
  function place(arch,tier,f,district,hm){
    const a=ARCH[arch];
    const b={arch,tier,x:f.x,z:f.z,rot:f.rot,w:f.w,d:f.d,h:a[2]*(0.8+tier*0.25)*(hm||1),
      roof:a[3],district,state:'sound',s,burnT:0,rebuildT:0,hue:rr()};
    groundBuilding(b);s.buildings.push(b);placed.add(b,Math.hypot(b.w,b.d)/2+1);
    return b;
  }
  s._lay={fits,place,placed,segH}; // growth (and the fields) reuse the same rules
  /* keep on defensible high ground inside the walls */
  if(isCap){
    let best=null,bh=-1e9;
    for(const rf of[0.55,0.45,0.65,0.35])for(let a=0;a<24;a++){
      const ang=a/24*Math.PI*2,x=s.pos.x+Math.cos(ang)*R*rf,z=s.pos.z+Math.sin(ang)*R*rf;
      const f={x,z,w:20,d:24,rot:rr()*Math.PI};
      if(fits(f,2)&&hAt(x,z)>bh){bh=hAt(x,z);best=f;}
    }
    if(best){s.keepPos={x:best.x,z:best.z,y:hAt(best.x,best.z)};place('keep',2,best,'keep');}
  }
  /* civic buildings ring the market square, between the streets, facing it */
  const angs=s.spokeDirs.map(a=>(a%(Math.PI*2)+Math.PI*2)%(Math.PI*2)).sort((a,b)=>a-b);
  const gaps=[];
  for(let i=0;i<angs.length;i++){const a=angs[i],b=i+1<angs.length?angs[i+1]:angs[0]+Math.PI*2;gaps.push({m:(a+b)/2,g:b-a});}
  if(!gaps.length)gaps.push({m:rr()*6.28,g:6.28});
  gaps.sort((p,q)=>q.g-p.g);
  const civic=[isCap||isTown?'temple':'granary','tavern','granary'];
  if(s.harbor||s.river)civic.push('warehouse');
  if(isCap)civic.push('shop','shop');
  civic.forEach((arch,k)=>{
    const gp=gaps[k%gaps.length],m=gp.m+(k>=gaps.length?(rr()-0.5)*gp.g*0.5:0);
    const a=ARCH[arch],tier=isCap||arch==='temple'?2:1,kk=0.85+tier*0.15,w=a[0]*kk,d=a[1]*kk;
    for(let push=0;push<8;push++){
      const dist=s.plazaR+d/2+2+push*4;
      const f={x:s.pos.x+Math.cos(m)*dist,z:s.pos.z+Math.sin(m)*dist,w,d,rot:-Math.atan2(Math.cos(m),-Math.sin(m))};
      if(fits(f,1)){place(arch,tier,f,arch==='temple'?'temple':'market');break;}
    }
  });
  /* a mill on the watercourse */
  if(s.river){
    let best=null,bd=1e9;
    for(let dz=-6;dz<=6;dz++)for(let dx=-6;dx<=6;dx++){
      const ci=s.cx+dx,cj=s.cz+dz;if(!inB(ci,cj)||W.water[cIdx(ci,cj)]!==2)continue;
      const d=dx*dx+dz*dz;if(d<bd){bd=d;best={x:cellX(ci),z:cellZ(cj)};}
    }
    if(best){
      const a=Math.atan2(s.pos.z-best.z,s.pos.x-best.x);
      for(let t=16;t<60;t+=4){
        const f={x:best.x+Math.cos(a)*t,z:best.z+Math.sin(a)*t,w:9,d:9,rot:-Math.atan2(Math.cos(a),-Math.sin(a))};
        if(buildable(f.x,f.z)&&fits(f,1,true)){s.mill=place('mill',1,f,'artisan');break;}
      }
    }
  }
  /* fill the frontages */
  let n=0;const grow=[];
  for(const c of cands){
    const inCore=c.tag!=='road'&&dist2d(c.mx,c.mz,s.pos.x,s.pos.z)<=R;
    if(!inCore||n>=count){grow.push(c);continue;}
    const dc=clamp(c.d/R,0,1);
    let district,arch;

    else if(dc<0.55){district='artisan';arch=rpick(['smithy','shop','house','house','longhouse']);}
    else{district='residential';arch=rpick(['house','house','house','longhouse','house','granary']);}
    let tier=dc<0.3?2:dc<0.65?1:0;
    if(s.kind==='village')tier=Math.max(0,tier-1);
    if(rr()<0.2)tier=Math.max(0,tier-1);

function stitchRoads(){ // a road now runs centre → its spoke street → the open road → the far spoke → centre
  W.roads.forEach((r,ri)=>{
    const A=W.settlements[r.a],B=W.settlements[r.b];
    if(!r.open)r.open=r.path; // the untrimmed open-country road
    const pts=r.open.filter(p=>dist2d(p.x,p.z,A.pos.x,A.pos.z)>(A.coreR||0)*0.98&&dist2d(p.x,p.z,B.pos.x,B.pos.z)>(B.coreR||0)*0.98);
    const sa=A.roadSpoke&&A.roadSpoke[ri],sb=B.roadSpoke&&B.roadSpoke[ri];
    const head=[{x:A.pos.x,z:A.pos.z},...(sa||[])],tail=[...(sb?[...sb].reverse():[]),{x:B.pos.x,z:B.pos.z}];
    r.path=[...head,...pts,...tail];r.len=polyLen(r.path);

  });

}

function mergeGeoms(list){ // list of [geometry, matrix] → one non-indexed BufferGeometry
  let pos=[],norm=[];
  const nm=new THREE.Matrix3();
  for(const[g0,m]of list){
    const g=g0.index?g0.toNonIndexed():g0;
    nm.getNormalMatrix(m);
    const p=g.attributes.position,n=g.attributes.normal,v=new THREE.Vector3();
    for(let i=0;i<p.count;i++){
      v.set(p.getX(i),p.getY(i),p.getZ(i)).applyMatrix4(m);pos.push(v.x,v.y,v.z);

    }
    if(g!==g0)g.dispose();
  }
  const out=new THREE.BufferGeometry();
  out.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  out.setAttribute('normal',new THREE.Float32BufferAttribute(norm,3));
  return out;
}

function terrNormal(x,z){const e=5,dx=hAt(x+e,z)-hAt(x-e,z),dz=hAt(x,z+e)-hAt(x,z-e),l=Math.hypot(dx,2*e,dz);return[-dx/l,2*e/l,-dz/l];}
function newAcc(){return{p:[],n:[],c:[],i:[]};}
function accMesh(acc,mat){
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(acc.p,3));
  g.setAttribute('normal',new THREE.Float32BufferAttribute(acc.n,3));

/* one connected strip along a polyline: shared vertices at every joint (the old per-segment quads
   gapped and overlapped at bends), several samples across for painted verges and ruts */
function strip(pts,acc,o){
  const n=pts.length;if(n<2)return;
  const fr=o.fr,m=fr.length,base=acc.p.length/3;
  for(let k=0;k<n;k++){
    const a=pts[Math.max(0,k-1)],b=pts[Math.min(n-1,k+1)];
    let tx=b.x-a.x,tz=b.z-a.z;const L=Math.hypot(tx,tz)||1;tx/=L;tz/=L;
    const hw=o.hw(k),yc=o.flatY?o.flatY(k):0;
    for(let j=0;j<m;j++){
      const x=pts[k].x-tz*hw*fr[j],z=pts[k].z+tx*hw*fr[j];
      acc.p.push(x,o.flatY?yc:hAt(x,z)+o.lift,z);
      const nn=o.flatY?[0,1,0]:terrNormal(x,z);acc.n.push(nn[0],nn[1],nn[2]);
      C1.setHex(o.col(k,j,x,z));acc.c.push(C1.r,C1.g,C1.b);
    }
  }
  for(let k=0;k<n-1;k++)for(let j=0;j<m-1;j++){
    const i0=base+k*m+j,i1=i0+1,i2=i0+m,i3=i2+1;
    acc.i.push(i0,i1,i2,i1,i3,i2);
  }
}
function disc(acc,cx,cz,R,lift,colFn){ // draped polar grid (market squares)
  const rings=6,sect=28,base=acc.p.length/3;
  for(let r=0;r<=rings;r++)for(let k=0;k<sect;k++){
    const rr=R*r/rings,a=k/sect*Math.PI*2,x=cx+Math.cos(a)*rr,z=cz+Math.sin(a)*rr;
    acc.p.push(x,hAt(x,z)+lift,z);const nn=terrNormal(x,z);acc.n.push(nn[0],nn[1],nn[2]);
    C1.setHex(colFn(r,k));acc.c.push(C1.r,C1.g,C1.b);
    if(r===0)break; // a single centre vertex
  }
  for(let r=0;r<rings;r++)for(let k=0;k<sect;k++){
    const k2=(k+1)%sect;
    const a=r===0?base:base+1+(r-1)*sect+k,b=r===0?base:base+1+(r-1)*sect+k2;
    const c=base+1+r*sect+k,d=base+1+r*sect+k2;
    if(r===0)acc.i.push(base,d,c);

/* river strips are cached: roads need them to find where bridges go */
function riverStrips(){
  if(G.rivStrips)return G.rivStrips;
  G.rivStrips=[];G.rivHash=makeHash(40);
  for(const path of W.riverPaths){
    const pts=resample(smoothPath(resample(path,10),6),6);
    const hw=pts.map((p,k)=>Math.max(4,(p.w||10)/2)*Math.min(1,0.35+k/14)); // springs start as a trickle
    // surface: sit above the channel across its middle, and never run uphill (downstream max envelope)
    const t=pts.map((p,k)=>{
      const a=pts[Math.max(0,k-1)],b=pts[Math.min(pts.length-1,k+1)],L=dist2d(a.x,a.z,b.x,b.z)||1,px=-(b.z-a.z)/L,pz=(b.x-a.x)/L,o=hw[k]*0.4;
      return Math.max(hAt(p.x,p.z),hAt(p.x+px*o,p.z+pz*o),hAt(p.x-px*o,p.z-pz*o))+0.9;});
    const ys=t.slice();for(let k=ys.length-2;k>=0;k--)ys[k]=Math.max(ys[k],ys[k+1]);
    const st={pts,ys,hw};G.rivStrips.push(st);
    for(let k=0;k<pts.length-1;k++){const o={a:pts[k],b:pts[k+1],hw:hw[k],y:ys[k],x:pts[k].x,z:pts[k].z};G.rivHash.add(o,dist2d(o.a.x,o.a.z,o.b.x,o.b.z)+hw[k]);}
  }

}
function riverAt(x,z,pad){ // the river segment under (x,z), if any
  for(const o of G.rivHash.near(x,z,1))if(segDist(x,z,o.a,o.b)<o.hw+pad)return o;
  return null;
}
const ROADCOL={verge:0x6d6a44,dirt:0x8f7a52,rut:0x7a6546,crown:0x9c8660};
const PAVECOL={verge:0x6f685a,dirt:0x8d8576,rut:0x80796b,crown:0x9a9384};
function rebuildRoadMesh(){ // king's roads, streets and market squares: one draped, vertex-coloured mesh; bridges where roads meet rivers
  if(G.roads){scene.remove(G.roads);G.roads.geometry.dispose();}
  if(G.bridges){scene.remove(G.bridges);G.bridges.dispose();}
  riverStrips();

  const FR=[-1,-0.78,-0.45,0,0.45,0.78,1];
  const roadCol=(pal)=>(k,j)=>j===0||j===6?pal.verge:j===2||j===4?pal.rut:j===3?pal.crown:pal.dirt;
  for(const r of W.roads){
    const pts=resample(smoothPath(resample(r.drawn||r.path,6),2),5);
    // split into dry runs; each wet run becomes a bridge between the dry banks
    let run=[],wet=null;
    const flush=()=>{if(run.length>1)strip(run,acc,{fr:FR,hw:()=>4.2,lift:0.3,col:roadCol(ROADCOL)});run=[];};
    for(let k=0;k<pts.length;k++){
      const w=riverAt(pts[k].x,pts[k].z,2.5);
      if(w){if(!wet){wet={from:pts[Math.max(0,k-1)],y:w.y};flush();}wet.y=Math.max(wet.y,w.y);}
      else{if(wet){spans.push({a:wet.from,b:pts[k],y:wet.y});run=[pts[Math.max(0,k-1)]];wet=null;}run.push(pts[k]);}
    }
    flush();
  }
  for(const s of W.settlements){
    const paved=s.kind!=='village';
    for(const st of s.streets||[]){
      const pts=resample(st.pts,5);
      strip(pts,acc,{fr:FR,hw:()=>st.hw,lift:0.28,col:(k,j,x,z)=>roadCol(paved&&dist2d(x,z,s.pos.x,s.pos.z)<s.coreR?PAVECOL:ROADCOL)(k,j)});
    }
    if(s.plazaR)disc(acc,s.pos.x,s.pos.z,s.plazaR+1.5,0.32,(r,k)=>r===6?0x7d7668:((r+k)%2?0x9d9585:0x948c7c));

    polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-4})));

    const mx=(sp.a.x+sp.b.x)/2,mz=(sp.a.z+sp.b.z)/2;

const TV_DRY=new THREE.Color(0xa39d5e);
function colorForVertex(i,sp,snowT,seed){
  const bio=W.biome[i],h=W.h[i];
  const nn=Math.sin(i*127.1+(seed%97))*43758.5453; const n=nn-Math.floor(nn); // stable patternless jitter
  let c;
  switch(bio){
    case B.WATER:
      if(W.water[i]===1){ // sea: sandy shallows blending to deep blue
        const t=clamp(-h/26,0,1);
        c=C1.setHex(0xc9bd93).lerp(new THREE.Color(0x24506e),0.35+t*0.65);
      }else{ // river cell: wet bank — the ribbon itself carries the water
        c=C1.setHex(0x5c6e4a);
      }
      break;
    case B.MARSH:c=C1.setHex(sp.marsh);break;
    case B.MEADOW:c=C1.setHex(sp.mead);break;
    case B.FARM:c=C1.setHex(sp.farm);if(((i*7)%13)<3)c.multiplyScalar(0.9);break;
    case B.FOREST:c=C1.setHex(sp.forest);break;
    case B.PINE:c=C1.setHex(sp.pine);break;
    case B.ROCK:c=C1.setHex(sp.rock);break;
    default:c=C1.setHex(0xe8ecef);
  }
  c.multiplyScalar(0.92+n*0.16);
  if(bio===B.MEADOW||bio===B.FARM||bio===B.FOREST||bio===B.MARSH){ // broad, soft variation: dry swales and lush hollows
    const v=G.tvar?G.tvar[i]:0;
    if(v>0)c.lerp(TV_DRY,v*0.3);else c.multiplyScalar(1+v*0.18);
  }
  if(bio===B.ROCK||bio===B.SNOW){ // coherent snowcaps: whiten smoothly with height
    const t=clamp((h-470)/130,0,1);
    c.lerp(new THREE.Color(0xe9edf2),t*t);
  }
  // note: road/river overlays are stamped after the blend pass so they stay crisp
  if(W.drought&&(bio===B.MEADOW||bio===B.FARM))c.lerp(new THREE.Color(0xb3a35c),0.55);
  // winter snow accumulation on flat/high ground
  if(snowT>0&&bio!==B.WATER){
    const t=clamp(snowT*(h>380?1:h>120?0.75:0.55),0,1);

  }
  return c;
}
function buildTerrain(){
  // vertex (cx,cz) must sit exactly at (cellX(cx),cellZ(cz)): a SIZE-wide plane spaces vertices SIZE/(GRID-1)
  // apart, not CELL, which slid the ground up to a whole cell away from everything placed with hAt()
  const g=new THREE.PlaneGeometry(CELL*(GRID-1),CELL*(GRID-1),GRID-1,GRID-1);
  g.rotateX(-Math.PI/2);g.translate(-CELL/2,0,-CELL/2);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++)p.setY(i,W.h[i]);
  g.computeVertexNormals();
  const col=new Float32Array(p.count*3);
  g.setAttribute('color',new THREE.BufferAttribute(col,3));
  G.terrain=new THREE.Mesh(g,new THREE.MeshLambertMaterial({vertexColors:true}));
  G.terrain.receiveShadow=true;
  scene.add(G.terrain);
  updateTerrainColors(0,0);
  // sea
  if(W.coastal){
    const sg=new THREE.PlaneGeometry(SIZE*2.4,SIZE*2.4,48,48);sg.rotateX(-Math.PI/2);
    G.sea=new THREE.Mesh(sg,new THREE.MeshPhongMaterial({color:0x2e6285,transparent:true,opacity:0.92,shininess:90,specular:0x88aabb}));
    G.sea.position.y=SEA+0.5;scene.add(G.sea);
  }

  const riv=newAcc();
  for(const st of riverStrips())
    strip(st.pts,riv,{fr:[-1,-0.6,0,0.6,1],hw:k=>st.hw[k],flatY:k=>st.ys[k],
      col:(k,j)=>j===2?0x2b5a7e:(j===1||j===3)?0x356a8f:0x5b8ea8});
  G.rivers=accMesh(riv,new THREE.MeshPhongMaterial({vertexColors:true,transparent:true,opacity:0.94,shininess:90,specular:0x10181e,
    polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-3}));

}
let lastSeasonKey='';
function updateTerrainColors(si,blend){
  if(!G.tvar){const nv=makeNoise(SEED^0x7A11);G.tvar=new Float32Array(GRID*GRID);
    for(let i=0;i<GRID*GRID;i++){const cx=i%GRID,cz=(i/GRID)|0;G.tvar[i]=clamp((fbm(nv,cx/26,cz/26,3,2,0.5)-0.5)*3,-1,1);}}
  const sp0=PAL.seasons[si],sp1=PAL.seasons[(si+1)%4];
  const snowT=si===3?0.85:(si===0?Math.max(0,0.5-blend*2)*0.8:0);
  const key=si+'_'+(blend*8|0)+'_'+(W.drought?1:0);
  if(key===lastSeasonKey)return;lastSeasonKey=key;
  const sp={};for(const k of['mead','farm','forest','pine','rock','marsh']){
    const c0=new THREE.Color(sp0[k]),c1=new THREE.Color(sp1[k]);sp[k]=c0.lerp(c1,blend*blend).getHex();
  }
  const col=G.terrain.geometry.attributes.color,N=col.count;
  if(!G._cbuf)G._cbuf=new Float32Array(N*3);
  const buf=G._cbuf;
  for(let i=0;i<N;i++){
    const c=colorForVertex(i,sp,snowT,SEED);
    buf[i*3]=c.r;buf[i*3+1]=c.g;buf[i*3+2]=c.b;
  }
  // gentle neighbor blend calms biome banding into painterly gradients
  for(let cz=0;cz<GRID;cz++)for(let cx=0;cx<GRID;cx++){
    const i=cIdx(cx,cz);
    let r=buf[i*3]*0.6,g=buf[i*3+1]*0.6,b=buf[i*3+2]*0.6,ws=0.6;
    for(const[dx,dz]of[[1,0],[-1,0],[0,1],[0,-1]]){
      if(!inB(cx+dx,cz+dz))continue;
      const j=cIdx(cx+dx,cz+dz);
      r+=buf[j*3]*0.1;g+=buf[j*3+1]*0.1;b+=buf[j*3+2]*0.1;ws+=0.1;
    }
    col.setXYZ(i,r/ws,g/ws,b/ws);
  }
  // river cells: darker wet banks under the water strip (painting them blue made blocky diamonds;
  // roads are real meshes now, so the ground under them is left alone)
  const bankC=new THREE.Color(snowT>0.5?0x9aa39a:0x4d6a3c);
  for(let i=0;i<N;i++)if(W.water[i]===2){
    C1.setRGB(col.getX(i),col.getY(i),col.getZ(i)).lerp(bankC,0.55);col.setXYZ(i,C1.r,C1.g,C1.b);
  }
  col.needsUpdate=true;
  recolorFields(si,blend,snowT);
  // trees seasonal tint
  if(G.decid){
    const dc=new THREE.Color([0x40682f,0x4a6c2e,0x96541e,0x5e5344][si]);
    G.decid.material.color.copy(dc);
    G.pine.material.color.setHex(si===3?0x314a37:0x28472f);
  }
}

/* ---------------- trees --------------------------------------------------- */
function buildTrees(){
  const trunk=new THREE.CylinderGeometry(0.5,0.8,3.2,5,1,true);trunk.translate(0,1.6,0);
  const blob=new THREE.IcosahedronGeometry(3.4,0);blob.translate(0,5.4,0);blob.scale(1,1.15,1);
  const decidG=mergeGeoms([[trunk,new THREE.Matrix4()],[blob,new THREE.Matrix4()]]);
  const cone=new THREE.ConeGeometry(2.6,7.5,6);cone.translate(0,5.2,0);
  const pineG=mergeGeoms([[trunk,new THREE.Matrix4()],[cone,new THREE.Matrix4()]]);
  const spots={dec:[],pine:[]};
  const nj=makeNoise(SEED^0x77E);
  for(let cz=0;cz<GRID;cz++)for(let cx=0;cx<GRID;cx++){
    const i=cIdx(cx,cz),bio=W.biome[i];
    if(bio!==B.FOREST&&bio!==B.PINE)continue;
    if(W.roadCells[i]||W.settlements.some(s=>dist2d(cellX(cx),cellZ(cz),s.pos.x,s.pos.z)<(s.wallR||s.radius)*1.5))continue;
    const dens=bio===B.FOREST?3:2;
    for(let t=0;t<dens;t++){
      const x=cellX(cx)+ (nj(cx*3+t*7,cz*3)-0.5)*CELL*1.4, z=cellZ(cz)+(nj(cx*3,cz*3+t*13)-0.5)*CELL*1.4;
      const arr=bio===B.FOREST?spots.dec:spots.pine;
      arr.push({x,z,s:0.8+nj(cx+t,cz-t)*1.2,v:nj(cx*5+t,cz*5-t)});
    }
  }
  // thin evenly to the instance budget (capping in scan order used to plant only the northern forests)
  for(const k of['dec','pine']){const a=spots[k],cap=9000;if(a.length>cap){const st=a.length/cap;spots[k]=Array.from({length:cap},(_,i)=>a[Math.floor(i*st)]);}}
  G.decid=new THREE.InstancedMesh(decidG,new THREE.MeshLambertMaterial({color:0x4c7a3c}),Math.max(1,spots.dec.length));
  G.pine=new THREE.InstancedMesh(pineG,new THREE.MeshLambertMaterial({color:0x2e5138}),Math.max(1,spots.pine.length));
  spots.dec.forEach((t,i)=>{setInst(G.decid,i,t.x,hAt(t.x,t.z)-0.3,t.z,t.x,t.s,t.s*(0.9+t.v*0.3),t.s);G.decid.setColorAt(i,C1.setRGB(0.82+t.v*0.3,0.86+t.v*0.26,0.8+t.v*0.2));});
  spots.pine.forEach((t,i)=>{setInst(G.pine,i,t.x,hAt(t.x,t.z)-0.3,t.z,t.x,t.s,t.s*(1+t.v*0.4),t.s);G.pine.setColorAt(i,C1.setRGB(0.85+t.v*0.2,0.88+t.v*0.2,0.86+t.v*0.2));});
  G.decid.instanceMatrix.needsUpdate=true;G.pine.instanceMatrix.needsUpdate=true;
  G.decid.castShadow=G.pine.castShadow=true;
  scene.add(G.decid);scene.add(G.pine);
}

function hash01(n){const x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x);}

function updateBuildingInstance(b){

  else if(b.state==='ruin'||b.state==='rubble'){col=0x4a443e;roofCol=0x2c2824;h=b.h*0.35;}

/* ---------------- town walls: one continuous curtain per town ------------
   Curtain runs follow the wall line and the ground, broken only by water and
   by gates where streets and roads pass out; towers stand at every gate and
   at intervals, a gatehouse spans each gate, merlons crown stone walls. */
function wallGates(s){
  const g=[],wr=s.wallR,c=s.pos;
  const scan=p=>{for(let i=1;i<p.length;i++){
    const d0=dist2d(p[i-1].x,p[i-1].z,c.x,c.z)-wr,d1=dist2d(p[i].x,p[i].z,c.x,c.z)-wr;
    if(d0*d1<=0&&d0!==d1){const f=d0/(d0-d1);const x=lerp(p[i-1].x,p[i].x,f),z=lerp(p[i-1].z,p[i].z,f);
      const a=Math.atan2(z-c.z,x-c.x);if(g.every(o=>Math.abs(Math.atan2(Math.sin(a-o),Math.cos(a-o)))>0.04))g.push(a);}}};
  for(const st of s.streets||[])scan(st.pts);
  for(const r of W.roads)if(r.a===W.settlements.indexOf(s)||r.b===W.settlements.indexOf(s))scan(r.path);
  return g;
}
function rebuildWalls(){
  if(G.wallGrp){scene.remove(G.wallGrp);disposeTree(G.wallGrp);}
  const grp=new THREE.Group(),acc=newAcc(),inst={merlon:[],tower:[],cap:[],gate:[]};
  const quad=(a,b,c,d,n,col)=>{ // a,b,c,d counter-clockwise seen from the normal's side
    const base=acc.p.length/3;

  for(const s of W.settlements){

    const H=stone?7.5:5,T=stone?2.6:1.3,col=stone?0xa59c8d:0x6e5334;

      const a=i/N*Math.PI*2,x=c.x+Math.cos(a)*wr,z=c.z+Math.sin(a)*wr,ci=toCell(x),cj=toCell(z);
      ok.push(!W.water[cIdx(ci,cj)]&&slopeAt(ci,cj)<0.6&&gates.every(g=>Math.abs(Math.atan2(Math.sin(a-g),Math.cos(a-g)))>gh));
    }

        quad(I(q,q.g-2.5),I(p,p.g-2.5),I(p,p.top),I(q,q.top),[-mo[0],0,-mo[2]],cc);  // inner face
        quad(O(p,p.top),O(q,q.top),I(q,q.top),I(p,p.top),[0,1,0],new THREE.Color(cc).multiplyScalar(0.9).getHex()); // wall-walk
        if(stone){ // merlons along the outer parapet
          const L=dist2d(p.x,p.z,q.x,q.z);
          for(let t=1;t<L;t+=3.2){const f=t/L;inst.merlon.push([lerp(p.x,q.x,f)+p.ox*(h2-0.5),lerp(p.top,q.top,f),lerp(p.z,q.z,f)+p.oz*(h2-0.5),-Math.atan2(q.z-p.z,q.x-p.x)]);}

    }

    for(const g of gates){
      const x=c.x+Math.cos(g)*wr,z=c.z+Math.sin(g)*wr,ci=toCell(x),cj=toCell(z);
      if(W.water[cIdx(ci,cj)])continue;
      inst.gate.push([x,hAt(x,z),z,g,stone,H,wr*gh*2]);
    }
  }
  const mesh=accMesh(acc,new THREE.MeshLambertMaterial({vertexColors:true}));
  mesh.castShadow=true;mesh.receiveShadow=true;grp.add(mesh);
  const bx=new THREE.BoxGeometry(1,1,1);bx.translate(0,0.5,0);
  const cy=new THREE.CylinderGeometry(0.5,0.56,1,10);cy.translate(0,0.5,0);
  const cn=new THREE.ConeGeometry(0.5,1,10);cn.translate(0,0.5,0);

  const tw=mk(cy,inst.tower.length),tc=mk(cn,inst.tower.length);

  });
  const gt=mk(bx,inst.gate.length*2);let gi=0;
  inst.gate.forEach(v=>{
    const[x,g,z,a,stone,H,span]=v,ry=-Math.atan2(Math.cos(a),-Math.sin(a));
    setInst(gt,gi,x,g+H-1,z,ry,span+4,3.6,(stone?2.6:1.3)+1.2);gt.setColorAt(gi++,C1.setHex(stone?0x958c7e:0x5f472d));
    setInst(gt,gi,x,g+H+2.6,z,ry,span+2,1.2,(stone?2.6:1.3)+0.6);gt.setColorAt(gi++,C1.setHex(stone?0x4f5866:0x7d6441));
  });
  for(const m of[mer,tw,tc,gt]){m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;}
  G.wallGrp=grp;scene.add(grp);
}
/* ---------------- fields: strip-farmed parcels between the lanes ---------- */
const FIELDCOL={ // spring, summer, autumn, winter
  wheat:[0x7ea24c,0xcdb05a,0x9c7c47,0xd4d8db],green:[0x6c9a45,0x7c9c46,0x86804a,0xced2d5],
  plough:[0x7b6245,0x8f8c4e,0x6d5337,0xcbced0],fallow:[0x8a9a55,0x9f9c5c,0x8d7d50,0xd1d4d7]};
function buildFields(){
  const acc=newAcc(),meta=[],taken=makeHash(80);
  for(const s of W.settlements){
    if(!s._lay)continue;
    const rng=layoutRng(1000+W.settlements.indexOf(s)),rr=()=>rng();
    const inner=(s.wallR||s.coreR+14)+28,outer=inner+(s.kind==='capital'?330:s.kind==='town'?240:160);
    for(let rad=inner+45;rad<outer;rad+=90){
      const nA=Math.floor(2*Math.PI*rad/50);
      for(let k=0;k<nA;k++){
        const a=(k+rr()*0.3)/nA*Math.PI*2,rd=rad+(rr()-0.5)*14;
        const x=s.pos.x+Math.cos(a)*rd,z=s.pos.z+Math.sin(a)*rd;
        const W2=42+rr()*6,L=80+rr()*10,rot=-Math.atan2(Math.cos(a),-Math.sin(a))+(rr()<0.3?Math.PI/2:0);
        const cs=obbCorners(x,z,W2,L,rot);
        let good=true;
        for(const q of[...cs,{x,z}]){
          const ci=toCell(q.x),cj=toCell(q.z),i=cIdx(ci,cj),bio=W.biome[i];
          if(W.water[i]||slopeAt(ci,cj)>0.22||(bio!==B.FARM&&bio!==B.MEADOW)){good=false;break;}
          for(const g of s._lay.segH.near(q.x,q.z,34))if(segDist(q.x,q.z,g.a,g.b)<g.hw+30){good=false;break;}
          if(!good)break;
          if(W.settlements.some(o=>o!==s&&dist2d(q.x,q.z,o.pos.x,o.pos.z)<(o.wallR||o.radius)+30))good=false;
          for(const r of W.roads)for(let j=0;j<r.path.length&&good;j+=2)if(dist2d(q.x,q.z,r.path[j].x,r.path[j].z)<24)good=false;
          if(!good)break;
        }
        if(!good)continue;
        const F={x,z,w:W2+2,d:L+2,rot};
        if([...taken.near(x,z,70)].some(o=>obbOverlap(F,o)))continue;
        taken.add(F,70);
        // five furrow strips along the parcel, draped on the ground
        const type=['wheat','wheat','green','plough','fallow'][Math.floor(rr()*5)],strips=5,segs=6;
        const c=Math.cos(rot),sn=Math.sin(rot),base=acc.p.length/3;
        for(let u=0;u<=segs;u++)for(let v=0;v<=strips;v++){
          const lx=(v/strips-0.5)*W2,lz=(u/segs-0.5)*L;
          const px=x+lx*c+lz*sn,pz=z-lx*sn+lz*c;
          acc.p.push(px,hAt(px,pz)+0.35,pz);const nn=terrNormal(px,pz);acc.n.push(nn[0],nn[1],nn[2]);acc.c.push(0,0,0);
          meta.push(type,(v===0||v===strips||u===0||u===segs)?2:v%2); // 2 = hedgerow edge
        }
        for(let u=0;u<segs;u++)for(let v=0;v<strips;v++){
          const i0=base+u*(strips+1)+v,i1=i0+1,i2=i0+strips+1,i3=i2+1;
          acc.i.push(i0,i2,i1,i1,i2,i3);
        }
      }
    }
  }
  if(!acc.i.length)return;
  G.fields=accMesh(acc,new THREE.MeshLambertMaterial({vertexColors:true,side:THREE.DoubleSide,
    polygonOffset:true,polygonOffsetFactor:-1,polygonOffsetUnits:-2}));
  G.fields.receiveShadow=true;G.fieldMeta=meta;
  scene.add(G.fields);
}
function recolorFields(si,blend,snowT){
  if(!G.fields)return;
  const col=G.fields.geometry.attributes.color,m=G.fieldMeta,c0=new THREE.Color(),c1=new THREE.Color(),dr=new THREE.Color(0xb3a35c);
  for(let i=0;i<col.count;i++){
    const t=FIELDCOL[m[i*2]];c0.setHex(t[si]).lerp(c1.setHex(t[(si+1)%4]),blend*blend);
    if(W.drought&&m[i*2]!=='plough')c0.lerp(dr,0.5);
    c0.multiplyScalar(m[i*2+1]===2?0.62:m[i*2+1]?0.84:0.92); // hedged edges, alternate furrows
    col.setXYZ(i,c0.r,c0.g,c0.b);
  }

}
function addBuildingLive(s){ // growth: take the next frontage lot in the queue (street gaps, then outward)
  const L=s._lay;if(!L||!s.growSlots)return null;
  for(let t=0;t<14&&s.growSlots.length;t++){
    const c=s.growSlots.shift();
    const arch=pick('sim',['house','house','house','shop','longhouse']),tier=chance('sim',0.3)?1:0;
    const f=frontFoot(c,arch,tier,()=>rand('sim'));
    if(!L.fits(f,dist2d(c.mx,c.mz,s.pos.x,s.pos.z)<s.coreR?1:2.6))continue;
    if(G.bldList.length>=G.bodies.instanceMatrix.count)return null;
    const b=L.place(arch,tier,f,'residential');
    b.idx=G.bldList.length;G.bldList.push(b);G.bodies.count=G.roofs.count=G.bldList.length;
    updateBuildingInstance(b);
    return b;
  }
  return null;
}

function makeTextSprite(text,size,color){

  g.font='24px "IM Fell English",Georgia,serif';
  const w=Math.ceil(g.measureText(text).width)+18;
  c.width=w;c.height=38;
  g.font='24px "IM Fell English",Georgia,serif';g.textBaseline='middle';

      new THREE.MeshBasicMaterial({color,transparent:true,opacity:op,depthWrite:false}));
    m.rotation.x=-Math.PI/2;m.position.set(s.pos.x,s.pos.y+4+(s.radius*0.01),s.pos.z);
    grp.add(m);
  };
  if(overlayMode==='territory'){
    for(const s of W.settlements){
      const h=W.houses[s.owner];
      disc(s,h?h.sigilHue[0]:0x888888,0.32,s.kind==='capital'?800:s.kind==='town'?600:380);
    }
  }else if(overlayMode==='trade'){
    for(const r of W.roads){
      const pts=r.path.map(p=>new THREE.Vector3(p.x,hAt(p.x,p.z)+4,p.z));
      const g=new THREE.BufferGeometry().setFromPoints(pts);
      const vol=clamp((r.vol||0)/6,0.15,1);
      grp.add(new THREE.Line(g,new THREE.LineBasicMaterial({color:0xC9A227,transparent:true,opacity:vol})));
    }
  }else if(overlayMode==='prosperity'){
    for(const s of W.settlements)disc(s,new THREE.Color().setHSL(clamp(s.prosperity/100,0,1)*0.33,0.8,0.5).getHex(),0.4);
  }else if(overlayMode==='plague'){
    for(const s of W.settlements){const f=s.pop>0?s.infected/s.pop:0;disc(s,f>0.001?0x7a2090:0x2a6030,clamp(0.15+f*2.5,0.15,0.7));}
  }else if(overlayMode==='unrest'){
    for(const s of W.settlements)disc(s,new THREE.Color().setHSL((1-clamp(s.unrest/100,0,1))*0.33,0.85,0.45).getHex(),0.4);
  }
  G.overlay=grp;scene.add(grp);
}
